<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | IT Scholar Design</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="design.css">
    <style>
        body {
            font-family: Manrope, system-ui, sans-serif !important;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .hero-bg {
            background: radial-gradient(circle at top left, rgba(98, 161, 253, 0.22), transparent 36%), radial-gradient(circle at bottom right, rgba(213, 183, 250, 0.18), transparent 30%), linear-gradient(135deg, rgba(255, 255, 255, 0.97), rgba(238, 240, 255, 0.96));
        }

        .glass-card {
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(12px);
        }

        .clone-panel {
            border: 1px solid #e5e7eb;
            border-radius: 1.5rem;
            background: white;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.06);
        }

        .clone-soft-panel {
            border: 1px solid #e5e7eb;
            border-radius: 1.5rem;
            background: #eef0ff;
        }

        .clone-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .18em;
            color: #64748b;
        }

        .clone-kicker {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            border-radius: 999px;
            background: rgba(0, 91, 175, .10);
            color: #005baf;
            padding: .4rem .8rem;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .18em;
        }

        .clone-card-link {
            display: block;
            color: inherit;
            text-decoration: none;
        }

        .clone-card-link:hover {
            text-decoration: none;
        }

        .clone-map-card {
            display: block;
            background: #fff;
            border: 1px solid #e5ecf5;
            border-radius: 18px;
            padding: 1.25rem;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
            color: inherit;
            text-decoration: none;
        }

        .clone-map-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.08);
            border-color: #b8c8f5;
            text-decoration: none;
        }

        .clone-map-kicker {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .35rem .65rem;
            border-radius: 999px;
            background: rgba(10, 102, 194, .1);
            color: #0a66c2;
            font-size: .7rem;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .clone-sidebar-link {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .85rem 1rem;
            border-radius: .9rem;
            color: #64748b;
            font-size: .95rem;
            font-weight: 700;
            text-decoration: none;
            transition: all .18s ease;
        }

        .clone-sidebar-link:hover {
            background: rgba(255, 255, 255, .72);
            color: #005baf;
            transform: translateX(2px);
            text-decoration: none;
        }

        .clone-sidebar-link.is-active {
            background: #fff;
            color: #005baf;
            box-shadow: 0 12px 32px rgba(15, 23, 42, .08);
        }

        .clone-table {
            width: 100%;
            border-collapse: collapse;
        }

        .clone-table th {
            text-align: left;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .14em;
            color: #64748b;
            padding: .75rem 1rem;
            border-bottom: 1px solid #edf2f7;
        }

        .clone-table td {
            padding: .9rem 1rem;
            border-bottom: 1px solid #f8fafc;
            vertical-align: top;
            color: #202d51;
        }

        .clone-table tr:hover {
            background: #f8faff;
        }
    </style>
</head>

<body class="design-clone-page bg-[#f6f5ff] text-[#202d51] min-h-screen flex flex-col">
    <header id="top-nav"
        class="bg-white/80 backdrop-blur-lg shadow-sm fixed top-0 w-full flex justify-between items-center px-4 sm:px-8 h-16 z-50 border-b border-slate-100/80">
        <div class="flex items-center gap-4 md:gap-8 min-w-0"><a href="index.html"
                class="flex items-center gap-2 no-underline hover:opacity-90"><span
                    class="text-xl font-extrabold tracking-tighter text-[#005baf]">IT Scholar</span></a>
            <nav class="hidden md:flex items-center gap-6 text-sm font-semibold tracking-tight"><a href="courses.html"
                    class="text-slate-600 hover:text-[#005baf] transition-colors no-underline">Courses</a><a
                    href="announcements.html"
                    class="text-slate-600 hover:text-[#005baf] transition-colors no-underline">Announcements</a><a
                    href="screens.html" class="text-slate-600 hover:text-[#005baf] transition-colors no-underline">Clone
                    Map</a><a href="components.html"
                    class="text-slate-600 hover:text-[#005baf] transition-colors no-underline">Components</a></nav>
        </div>
        <div class="flex items-center gap-3 shrink-0"><a href="login.html"
                class="text-sm font-semibold text-[#005baf] no-underline hover:underline px-2">Login</a><a
                href="register.html"
                class="inline-flex items-center justify-center rounded-xl bg-[#005baf] px-4 py-2.5 text-sm font-bold text-white shadow-lg no-underline hover:opacity-90">Create
                account</a></div>
    </header>
    <main class="flex-1 pt-16 bg-[#f6f5ff]">
        <section class="flex-1 flex items-center justify-center px-4 py-12 pt-24">
            <div class="w-full max-w-md -panel p-8">
                <h2 class="text-xl font-extrabold text-[#202d51] text-center mb-6">Reset Password</h2>
                <p class="text-sm text-slate-600 mb-4">At least 8 characters with uppercase, lowercase, a digit, and a
                    special character.</p>
                <form class="space-y-4">
                    <div><label class="block text-xs font-semibold text-slate-500 mb-1">New Password</label><input
                            type="password" required autofocus
                            class="w-full rounded-lg border-slate-200 text-sm px-3 py-2.5 bg-white"></div>
                    <div><label class="block text-xs font-semibold text-slate-500 mb-1">Confirm Password</label><input
                            type="password" required
                            class="w-full rounded-lg border-slate-200 text-sm px-3 py-2.5 bg-white"></div><a
                        href="login.html"
                        class="block w-full py-3 rounded-lg bg-[#005baf] text-white font-bold text-sm hover:opacity-90 text-center no-underline">Update
                        Password</a>
                </form>
                <div class="mt-6 text-center"><a href="login.html"
                        class="text-sm font-semibold text-[#005baf] no-underline hover:underline">← Back to Login</a>
                </div>
            </div>
        </section>
    </main>
    <footer class="design-clone-footer mt-auto shrink-0 border-t border-slate-200/90 bg-white/95">
        <div
            class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-x-4 gap-y-2 text-xs text-slate-500">
            <p class="m-0 text-slate-400 leading-snug">© 2026 IT Scholar</p>
            <nav class="flex flex-wrap items-center justify-end gap-x-4 gap-y-1 font-medium" aria-label="Footer"><a
                    href="index.html" class="text-slate-600 hover:text-[#005baf] no-underline">Home</a><a
                    href="courses.html" class="text-slate-600 hover:text-[#005baf] no-underline">Courses</a><a
                    href="announcements.html"
                    class="text-slate-600 hover:text-[#005baf] no-underline">Announcements</a><a href="screens.html"
                    class="text-slate-600 hover:text-[#005baf] no-underline">All Screens</a></nav>
        </div>
    </footer>
</body>

</html>
