<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ cá nhân | E-Learning CNTT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><nav id="top-nav"></nav></header>
<main>
  <div class="page">
    <h2>Hồ sơ cá nhân</h2>
    <div id="profile-content"></div>
  </div>
</main>
<footer>© 2026 E-Learning CNTT. All rights reserved.</footer>
<script src="mockData/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!requireLogin()) return;
    renderNav();
    const user = DB.getCurrentUser();
    const fullUser = DB.getUsers().find(u => u.id === user.id);
    const initials = user.fullName.split(' ').map(w => w[0]).slice(-2).join('').toUpperCase();

    document.getElementById('profile-content').innerHTML = `
      <div class="profile-card">
        <div class="avatar">${initials}</div>
        <div class="profile-info">
          <h3>${user.fullName}</h3>
          <p>${user.email}</p>
          <p style="margin-top:.35rem;"><span class="badge badge-dark">${user.role}</span></p>
        </div>
      </div>

      <div style="background:#fff; border:1px solid #e0e7ef; border-radius:12px; padding:1.5rem; margin-bottom:1.5rem;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h3 style="font-size:1rem; color:#0a3d7a;">Thông tin cá nhân</h3>
          <button onclick="toggleEdit()" class="btn btn-outline btn-sm" id="edit-btn">✏️ Chỉnh sửa</button>
        </div>

        <div id="view-mode">
          <div class="info-grid">
            <div class="info-item"><label>Họ và tên</label><span>${fullUser.fullName}</span></div>
            <div class="info-item"><label>Email</label><span>${fullUser.email}</span></div>
            <div class="info-item"><label>Tên đăng nhập</label><span>${fullUser.username}</span></div>
            <div class="info-item"><label>Số điện thoại</label><span>${fullUser.phone || '—'}</span></div>
            <div class="info-item"><label>Vai trò</label><span>${fullUser.role}</span></div>
            <div class="info-item"><label>Ngày tham gia</label><span>${formatDate(fullUser.createdAt)}</span></div>
          </div>
        </div>

        <div id="edit-mode" style="display:none;">
          <form onsubmit="saveProfile(event)">
            <div class="info-grid">
              <div><label>Họ và tên</label><input type="text" id="edit-name" value="${fullUser.fullName}" required></div>
              <div><label>Số điện thoại</label><input type="tel" id="edit-phone" value="${fullUser.phone || ''}"></div>
            </div>
            <div style="display:flex; gap:.75rem; margin-top:1rem;">
              <button type="submit" style="width:auto; padding:.65rem 1.5rem;">Lưu thay đổi</button>
              <button type="button" onclick="toggleEdit()" class="btn-outline" style="width:auto; padding:.65rem 1.5rem;">Hủy</button>
            </div>
          </form>
        </div>
      </div>

      <div style="display:flex; gap:.75rem; flex-wrap:wrap;">
        <a href="change-password.html" class="btn btn-outline">🔐 Đổi mật khẩu</a>
        <a href="${user.role === 'TEACHER' ? 'teacher-dashboard.html' : 'student-dashboard.html'}" class="btn btn-outline">📊 Dashboard</a>
      </div>`;
  });

  function toggleEdit() {
    const view = document.getElementById('view-mode');
    const edit = document.getElementById('edit-mode');
    const btn = document.getElementById('edit-btn');
    const isEditing = edit.style.display !== 'none';
    view.style.display = isEditing ? 'block' : 'none';
    edit.style.display = isEditing ? 'none' : 'block';
    btn.textContent = isEditing ? '✏️ Chỉnh sửa' : '✕ Hủy';
  }

  function saveProfile(e) {
    e.preventDefault();
    const user = DB.getCurrentUser();
    const users = DB.getUsers();
    const fullUser = users.find(u => u.id === user.id);
    fullUser.fullName = document.getElementById('edit-name').value.trim();
    fullUser.phone = document.getElementById('edit-phone').value.trim();
    DB.saveUsers(users);
    const session = DB.getCurrentUser();
    session.fullName = fullUser.fullName;
    localStorage.setItem('currentUser', JSON.stringify(session));
    showToast('Cập nhật hồ sơ thành công!');
    setTimeout(() => location.reload(), 800);
  }
</script>
</body>
</html>
