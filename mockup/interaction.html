<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diễn đàn | E-Learning CNTT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><nav id="top-nav"></nav></header>
<main>
  <div class="page">
    <div class="page-header">
      <h2>Diễn đàn thảo luận</h2>
      <p style="color:#666; font-size:.9rem; margin:0;">Tất cả bài đăng từ các khóa học bạn tham gia.</p>
    </div>
    <div id="interaction-content"></div>
  </div>
</main>
<footer>© 2026 E-Learning CNTT. All rights reserved.</footer>
<script src="mockData/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!requireLogin()) return;
    renderNav();
    const user = DB.getCurrentUser();

    // Get all courses the user is enrolled in (or all if teacher/admin)
    const enrollments = DB.getEnrollments().filter(e => e.studentId === user.id);
    const enrolledCourseIds = enrollments.map(e => e.courseId);
    const courses = DB.getCourses();

    // Get posts: enrolled courses for students, all for teacher/admin
    const allPosts = DB.getPosts();
    const posts = (user.role === 'STUDENT')
      ? allPosts.filter(p => enrolledCourseIds.includes(p.courseId))
      : allPosts;

    const sorted = [...posts].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    if (!sorted.length) {
      document.getElementById('interaction-content').innerHTML =
        '<div class="empty-state"><p>Chưa có bài đăng nào. <a href="courses.html">Đăng ký khóa học</a> để tham gia diễn đàn.</p></div>';
      return;
    }

    document.getElementById('interaction-content').innerHTML = sorted.map(p => {
      const author = DB.getUsers().find(u => u.id === p.authorId);
      const course = courses.find(c => c.id === p.courseId);
      return `<div class="post-item" style="margin-bottom:.75rem;">
        <div style="display:flex; align-items:flex-start; gap:.6rem; flex-wrap:wrap;">
          <span class="post-type-badge type-${p.postType}">${p.postType}</span>
          <span class="post-title" style="flex:1;">${p.title}</span>
          ${course ? `<a href="forum.html?courseId=${course.id}" class="badge badge-dark" style="text-decoration:none; font-size:.78rem;">${course.courseCode}</a>` : ''}
        </div>
        <div class="post-meta" style="margin-top:.4rem;">
          👤 ${author ? author.fullName : 'N/A'} · ${formatDate(p.createdAt)} · 👁 ${p.viewCount}
        </div>
        <div style="margin-top:.5rem; font-size:.9rem; color:#555; line-height:1.6;">
          ${p.content.substring(0, 200)}${p.content.length > 200 ? '…' : ''}
        </div>
        ${course ? `<div style="margin-top:.5rem;"><a href="forum.html?courseId=${course.id}" class="btn-link" style="font-size:.85rem;">Xem trong diễn đàn →</a></div>` : ''}
      </div>`;
    }).join('');
  });
</script>
</body>
</html>
