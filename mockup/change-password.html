<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | E-Learning CNTT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <nav>
        <div class="logo">
        <span class="logo-mark">E</span>
            E-Learning CNTT
        </div>
        <div class="links">
            <a href="homepage.html">Home</a>
            <a href="logout.html" data-i18n="nav.logout">Logout</a>
            <button class="language-toggle" onclick="i18n && i18n.toggleLanguage()" title="Toggle Language">
                <span>🇬🇧</span>
            </button>
        </div>
    </nav>
</header>

<main>
<div class="container">
    <h2 data-i18n="change.title">Change Password</h2>
    <form>
        <label for="current-password" data-i18n="change.old">Old Password</label>
        <input type="password" id="current-password" required>

        <label for="new-password" data-i18n="change.new">New Password</label>
        <input type="password" id="new-password" required>

        <label for="confirm-new-password" data-i18n="change.confirm">Confirm New Password</label>
        <input type="password" id="confirm-new-password" required>

        <button type="submit" data-i18n="change.button">Update Password</button>
    </form>
</div>
</main>

<footer>
    <span data-i18n="footer.text">© 2026 E-Learning CNTT. All rights reserved.</span>
</footer>

<script src="js/i18n.js"></script>

</body>
</html>
