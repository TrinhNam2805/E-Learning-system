<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi mật khẩu | E-Learning CNTT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><nav id="top-nav"></nav></header>
<main>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Đổi mật khẩu</h2>
      <div id="msg"></div>
      <form onsubmit="doChange(event)">
        <label>Mật khẩu hiện tại</label>
        <input type="password" id="current" placeholder="••••••••" required>
        <label>Mật khẩu mới</label>
        <input type="password" id="newpw" placeholder="Tối thiểu 6 ký tự" required>
        <label>Xác nhận mật khẩu mới</label>
        <input type="password" id="confirm" placeholder="Nhập lại mật khẩu mới" required>
        <button type="submit" class="btn btn-full" style="margin-top:1rem;">Cập nhật mật khẩu</button>
      </form>
      <div class="auth-links"><a href="profile.html">← Quay lại hồ sơ</a></div>
    </div>
  </div>
</main>
<footer>© 2026 E-Learning CNTT. All rights reserved.</footer>
<script src="mockData/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => { if (!requireLogin()) return; renderNav(); });
  function doChange(e) {
    e.preventDefault();
    const user = DB.getCurrentUser();
    const users = DB.getUsers();
    const fullUser = users.find(u => u.id === user.id);
    const current = document.getElementById('current').value;
    const newpw = document.getElementById('newpw').value;
    const confirm = document.getElementById('confirm').value;
    const msg = document.getElementById('msg');
    if (fullUser.password !== current) { msg.innerHTML = '<div class="alert alert-error">Mật khẩu hiện tại không đúng.</div>'; return; }
    if (newpw.length < 6) { msg.innerHTML = '<div class="alert alert-error">Mật khẩu mới tối thiểu 6 ký tự.</div>'; return; }
    if (newpw !== confirm) { msg.innerHTML = '<div class="alert alert-error">Mật khẩu xác nhận không khớp.</div>'; return; }
    fullUser.password = newpw;
    DB.saveUsers(users);
    msg.innerHTML = '<div class="alert alert-success">Đổi mật khẩu thành công!</div>';
    document.getElementById('current').value = '';
    document.getElementById('newpw').value = '';
    document.getElementById('confirm').value = '';
  }
</script>
</body>
</html>
