<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghi chú | E-Learning CNTT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><nav id="top-nav"></nav></header>
<main>
  <div class="page">
    <div class="page-header">
      <h2>📓 Ghi chú của tôi</h2>
      <div style="display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;">
        <select id="filter-course" onchange="renderNotes()" class="btn btn-outline btn-sm" style="font-size:.88rem; padding:.4rem .75rem; cursor:pointer;">
          <option value="">Tất cả khóa học</option>
        </select>
        <button onclick="confirmClearAll()" class="btn btn-sm" style="background:#fee2e2; color:#b00020; border:none; width:auto; padding:.4rem .9rem;">🗑 Xóa tất cả</button>
      </div>
    </div>
    <div id="notes-stats" style="font-size:.88rem; color:#666; margin-bottom:1rem;"></div>
    <div id="notes-list"></div>
  </div>
</main>
<footer>© 2026 E-Learning CNTT. All rights reserved.</footer>
<script src="mockData/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!requireLogin()) return;
    renderNav();
    const user = DB.getCurrentUser();

    // Populate course filter
    const enrollments = DB.getEnrollments().filter(e => e.studentId === user.id);
    const courses = DB.getCourses();
    const sel = document.getElementById('filter-course');
    enrollments.forEach(e => {
      const c = courses.find(c => c.id === e.courseId);
      if (c) sel.innerHTML += `<option value="${c.id}">${c.courseCode} – ${c.courseName}</option>`;
    });

    renderNotes();
  });

  function renderNotes() {
    const user = DB.getCurrentUser();
    const courseFilter = parseInt(document.getElementById('filter-course').value) || null;
    const allNotes = DB.getNotes().filter(n => n.studentId === user.id);
    const notes = courseFilter ? allNotes.filter(n => n.courseId === courseFilter) : allNotes;
    const sorted = [...notes].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    document.getElementById('notes-stats').textContent = `${sorted.length} ghi chú${courseFilter ? ' trong khóa học này' : ' tổng cộng'}`;

    if (!sorted.length) {
      document.getElementById('notes-list').innerHTML =
        '<div class="empty-state"><p>Chưa có ghi chú nào. Hãy ghi chú trong khi học bài giảng!</p><a href="courses.html" class="btn btn-outline btn-sm" style="margin-top:.75rem;">Đến khóa học →</a></div>';
      return;
    }

    // Group by course
    const courses = DB.getCourses();
    const lessons = DB.getLessons();
    const grouped = {};
    sorted.forEach(n => {
      if (!grouped[n.courseId]) grouped[n.courseId] = [];
      grouped[n.courseId].push(n);
    });

    document.getElementById('notes-list').innerHTML = Object.entries(grouped).map(([cid, cNotes]) => {
      const course = courses.find(c => c.id === parseInt(cid));
      return `
        <div style="margin-bottom:1.75rem;">
          <div style="display:flex; align-items:center; gap:.5rem; margin-bottom:.75rem;">
            <span class="badge">${course ? course.courseCode : 'N/A'}</span>
            <span style="font-weight:600; color:#0a3d7a; font-size:.95rem;">${course ? course.courseName : 'Khóa học không xác định'}</span>
          </div>
          ${cNotes.map(n => {
            const lesson = lessons.find(l => l.id === n.lessonId);
            return `
            <div class="note-item" style="border-left:3px solid ${n.highlightColor}; margin-bottom:.6rem; position:relative; padding-right:2rem;">
              <div style="font-size:.8rem; color:#888; margin-bottom:.3rem;">
                📖 ${lesson ? lesson.lessonTitle : 'Bài học không xác định'} · ${formatDate(n.createdAt)}
              </div>
              <div style="font-size:.92rem; color:#333; line-height:1.65;">${n.content}</div>
              <div style="display:flex; gap:.5rem; margin-top:.5rem; flex-wrap:wrap;">
                ${lesson ? `<a href="lesson.html?courseId=${n.courseId}&lessonId=${n.lessonId}" class="btn-link" style="font-size:.8rem;">→ Đến bài học</a>` : ''}
                <button onclick="deleteNote(${n.id})" style="background:none;border:none;cursor:pointer;color:#ccc;font-size:.8rem;padding:0;" title="Xóa ghi chú">✕ Xóa</button>
              </div>
            </div>`;
          }).join('')}
        </div>`;
    }).join('');
  }

  function deleteNote(noteId) {
    if (!confirm('Xóa ghi chú này?')) return;
    const notes = DB.getNotes().filter(n => n.id !== noteId);
    DB.saveNotes(notes);
    renderNotes();
    showToast('Đã xóa ghi chú.');
  }

  function confirmClearAll() {
    const user = DB.getCurrentUser();
    const courseFilter = parseInt(document.getElementById('filter-course').value) || null;
    const label = courseFilter ? 'trong khóa học này' : 'của bạn';
    if (!confirm(`Xóa tất cả ghi chú ${label}? Hành động này không thể hoàn tác.`)) return;
    const allNotes = DB.getNotes();
    const remaining = courseFilter
      ? allNotes.filter(n => !(n.studentId === user.id && n.courseId === courseFilter))
      : allNotes.filter(n => n.studentId !== user.id);
    DB.saveNotes(remaining);
    renderNotes();
    showToast('Đã xóa tất cả ghi chú.');
  }
</script>
</body>
</html>
