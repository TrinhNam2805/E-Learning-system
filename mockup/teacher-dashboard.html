<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard | E-Learning CNTT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><nav id="top-nav"></nav></header>
<main>
  <div class="page">
    <div id="dashboard-content"></div>
  </div>
</main>
<footer>© 2026 E-Learning CNTT. All rights reserved.</footer>
<script src="mockData/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!requireLogin()) return;
    renderNav();
    const user = DB.getCurrentUser();
    if (user.role === 'STUDENT') { window.location.href = 'student-dashboard.html'; return; }
    if (user.role === 'ADMIN') { window.location.href = 'admin.html'; return; }

    const myCourses = DB.getCourses().filter(c => c.teacherId === user.id);
    const allEnrollments = DB.getEnrollments();
    const totalStudents = new Set(allEnrollments.filter(e => myCourses.some(c => c.id === e.courseId)).map(e => e.studentId)).size;
    const totalLessons = DB.getLessons().filter(l => myCourses.some(c => c.id === l.courseId)).length;

    document.getElementById('dashboard-content').innerHTML = `
      <div style="margin-bottom:1.5rem;">
        <h2>Dashboard Giảng viên – ${user.fullName} 👨‍🏫</h2>
        <p style="color:#666; font-size:.93rem;">Quản lý khóa học và theo dõi sinh viên.</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num">${myCourses.length}</div><div class="stat-label">Khóa học đang dạy</div></div>
        <div class="stat-card"><div class="stat-num">${myCourses.filter(c=>c.status==='PUBLISHED').length}</div><div class="stat-label">Đang published</div></div>
        <div class="stat-card"><div class="stat-num">${totalStudents}</div><div class="stat-label">Tổng sinh viên</div></div>
        <div class="stat-card"><div class="stat-num">${totalLessons}</div><div class="stat-label">Tổng bài giảng</div></div>
      </div>

      <h2>Khóa học của tôi</h2>
      <div class="table-wrap" style="margin-top:1rem;">
        <table>
          <thead><tr><th>Mã môn</th><th>Tên khóa học</th><th>Học kỳ</th><th>Trạng thái</th><th>Sinh viên</th><th>Bài giảng</th><th>Thao tác</th></tr></thead>
          <tbody>
            ${myCourses.map(c => {
              const enrolled = allEnrollments.filter(e => e.courseId === c.id).length;
              const lessons = DB.getLessons().filter(l => l.courseId === c.id).length;
              return `<tr>
                <td><span class="badge">${c.courseCode}</span></td>
                <td><strong>${c.courseName}</strong></td>
                <td>${c.semester}</td>
                <td><span class="badge ${c.status==='PUBLISHED'?'badge-green':'badge-gray'}">${c.status}</span></td>
                <td>${enrolled}/${c.maxStudents}</td>
                <td>${lessons}</td>
                <td style="display:flex; gap:.4rem; flex-wrap:wrap;">
                  <a href="course-detail.html?id=${c.id}" class="btn btn-outline btn-sm">Xem</a>
                  <a href="forum.html?courseId=${c.id}" class="btn btn-outline btn-sm">Diễn đàn</a>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>

      <div style="margin-top:2rem;">
        <h2>Danh sách sinh viên theo khóa học</h2>
        ${myCourses.map(c => {
          const students = allEnrollments.filter(e => e.courseId === c.id).map(e => {
            const s = DB.getUsers().find(u => u.id === e.studentId);
            return s ? { ...s, enrollment: e } : null;
          }).filter(Boolean);
          if (!students.length) return '';
          return `<div style="margin-top:1.25rem;">
            <h3 style="font-size:1rem; color:#0a3d7a; margin-bottom:.6rem;">${c.courseCode} – ${c.courseName}</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Họ tên</th><th>Email</th><th>Tiến độ</th><th>XP</th><th>Trạng thái</th></tr></thead>
                <tbody>
                  ${students.map(s => `<tr>
                    <td>${s.fullName}</td>
                    <td style="color:#666;">${s.email}</td>
                    <td>
                      <div style="display:flex; align-items:center; gap:.5rem;">
                        <div class="progress-bar-wrap" style="width:80px;"><div class="progress-bar" style="width:${s.enrollment.progressPercentage}%"></div></div>
                        <span style="font-size:.82rem;">${s.enrollment.progressPercentage}%</span>
                      </div>
                    </td>
                    <td>${s.enrollment.totalXp} XP</td>
                    <td><span class="badge ${s.enrollment.status==='ACTIVE'?'badge-green':'badge-gray'}">${s.enrollment.status}</span></td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>`;
        }).join('')}
      </div>`;
  });
</script>
</body>
</html>
