<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký | E-Learning CNTT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><nav id="top-nav"></nav></header>
<main>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Đăng ký tài khoản</h2>
      <div id="msg"></div>
      <form onsubmit="doRegister(event)">
        <label>Họ và tên</label>
        <input type="text" id="fullName" placeholder="Nguyễn Văn A" required>
        <label>Email</label>
        <input type="email" id="email" placeholder="example@email.com" required>
        <label>Mật khẩu</label>
        <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" required>
        <label>Xác nhận mật khẩu</label>
        <input type="password" id="confirm" placeholder="Nhập lại mật khẩu" required>
        <button type="submit" class="btn btn-full" style="margin-top:1rem;">Đăng ký</button>
      </form>
      <div class="auth-links">Đã có tài khoản? <a href="login.html">Đăng nhập</a></div>
    </div>
  </div>
</main>
<footer>© 2026 E-Learning CNTT. All rights reserved.</footer>
<script src="mockData/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => renderNav());
  function doRegister(e) {
    e.preventDefault();
    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const msg = document.getElementById('msg');
    if (pw !== confirm) { msg.innerHTML = '<div class="alert alert-error">Mật khẩu xác nhận không khớp.</div>'; return; }
    if (pw.length < 6) { msg.innerHTML = '<div class="alert alert-error">Mật khẩu tối thiểu 6 ký tự.</div>'; return; }
    const result = DB.register(fullName, email, pw);
    if (!result) { msg.innerHTML = '<div class="alert alert-error">Email đã được sử dụng.</div>'; return; }
    msg.innerHTML = '<div class="alert alert-success">Đăng ký thành công! Đang chuyển đến trang đăng nhập...</div>';
    setTimeout(() => window.location.href = 'login.html', 1500);
  }
</script>
</body>
</html>
