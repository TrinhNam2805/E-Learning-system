<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu | E-Learning CNTT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <nav>
        <div class="logo">
            <span class="logo-mark">E</span>
            E-Learning CNTT
        </div>
        <div class="nav-toggle">&#9776;</div>
    </nav>
</header>

<main>
<div class="container">
    <h2>Quên mật khẩu</h2>
    <p>Nhập email của bạn để nhận liên kết đặt lại mật khẩu.</p>
    <form>
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <button type="submit">Gửi liên kết</button>
    </form>
    <p>Đã nhớ lại mật khẩu? <a href="login.html">Đăng nhập</a></p>
</div>
</main>

<footer>
    &copy; 2026 E-Learning CNTT. All rights reserved.
</footer>

<script>
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.querySelector('nav');
    toggle && toggle.addEventListener('click', () => nav.classList.toggle('open'));
</script>

</body>
</html>
