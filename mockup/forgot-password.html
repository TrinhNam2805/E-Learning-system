<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu | E-Learning CNTT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><nav id="top-nav"></nav></header>
<main>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Quên mật khẩu</h2>
      <p style="color:#666; font-size:.93rem; margin-bottom:1rem;">Nhập email của bạn. Nếu tài khoản tồn tại, mật khẩu sẽ được hiển thị (demo).</p>
      <div id="msg"></div>
      <form onsubmit="doReset(event)">
        <label>Email</label>
        <input type="email" id="email" placeholder="example@email.com" required>
        <button type="submit" class="btn btn-full" style="margin-top:1rem;">Tìm tài khoản</button>
      </form>
      <div class="auth-links"><a href="login.html">← Quay lại đăng nhập</a></div>
    </div>
  </div>
</main>
<footer>© 2026 E-Learning CNTT. All rights reserved.</footer>
<script src="mockData/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => renderNav());

  function doReset(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const msg = document.getElementById('msg');
    const users = DB.getUsers();
    const user = users.find(u => u.email === email);
    if (!user) {
      msg.innerHTML = '<div class="alert alert-error">Không tìm thấy tài khoản với email này.</div>';
      return;
    }
    // Demo: show password hint
    msg.innerHTML = `<div class="alert alert-success">Tài khoản tìm thấy: <strong>${user.fullName}</strong>.<br>
      Mật khẩu demo: <code style="background:#f0f4fa;padding:.1rem .4rem;border-radius:4px;">${user.password}</code><br>
      <a href="login.html" style="margin-top:.5rem;display:inline-block;">→ Đăng nhập ngay</a></div>`;
  }
</script>
</body>
</html>
