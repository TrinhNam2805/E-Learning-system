<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | E-Learning CNTT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <nav>
        <div class="logo">
            <span class="logo-mark">E</span>
            E-Learning CNTT
        </div>
        <div class="nav-toggle">&#9776;</div>
        <div class="links">
            <button class="language-toggle" onclick="i18n && i18n.toggleLanguage()" title="Toggle Language">
                <span>🇬🇧</span>
            </button>
        </div>
    </nav>
</header>

<main>
<div class="container">
    <h2 data-i18n="forgot.title">Forgot Password</h2>
    <p data-i18n="forgot.email">Enter your email</p>
    <form>
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <button type="submit" data-i18n="forgot.button">Send Reset Link</button>
    </form>
    <p><a href="login.html" data-i18n="forgot.back">Back to Login</a></p>
</div>
</main>

<footer>
    <span data-i18n="footer.text">© 2026 E-Learning CNTT. All rights reserved.</span>
</footer>

<script src="js/i18n.js"></script>
<script>
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.querySelector('nav');
    toggle && toggle.addEventListener('click', () => nav.classList.toggle('open'));
</script>

</body>
</html>
