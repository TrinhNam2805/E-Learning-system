<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết khóa học | E-Learning CNTT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><nav id="top-nav"></nav></header>
<main>
  <div class="page">
    <a class="back-link" href="courses.html">← Danh sách khóa học</a>
    <div id="course-content"></div>
  </div>
</main>
<footer>© 2026 E-Learning CNTT. All rights reserved.</footer>
<script src="mockData/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    renderNav();
    const id = parseInt(getParam('id'));
    const course = DB.getCourses().find(c => c.id === id);
    if (!course) { document.getElementById('course-content').innerHTML = '<div class="empty-state"><p>Không tìm thấy khóa học.</p></div>'; return; }

    const user = DB.getCurrentUser();
    const teacher = DB.getUsers().find(u => u.id === course.teacherId);
    const enrolled = user && DB.isEnrolled(user.id, course.id);
    const lessons = DB.getLessons().filter(l => l.courseId === course.id);
    const progress = user ? DB.getProgress() : [];

    let enrollSection = '';
    if (!user) {
      enrollSection = `<div class="alert alert-info">Bạn cần <a href="login.html">đăng nhập</a> để đăng ký và xem bài giảng.</div>`;
    } else if (enrolled) {
      enrollSection = `<div style="margin-top:.75rem;"><span class="badge badge-green" style="font-size:.93rem; padding:.35rem .85rem;">✓ Đã đăng ký khóa học</span></div>`;
    } else {
      const pwField = course.enrollPassword ? `
        <div>
          <label style="margin-top:0;">Mật khẩu khóa học</label>
          <input type="password" id="enroll-pw" placeholder="Nhập mật khẩu" style="max-width:280px;">
          <div class="helper">Demo: <strong>${course.enrollPassword}</strong></div>
        </div>` : '';
      enrollSection = `
        <div id="enroll-msg"></div>
        <form onsubmit="doEnroll(event, ${course.id})" style="display:flex; flex-direction:column; gap:.5rem; max-width:340px; margin-top:.75rem;">
          ${pwField}
          <button type="submit" style="width:auto; align-self:flex-start; padding:.7rem 1.75rem;">Đăng ký khóa học</button>
        </form>`;
    }

    const lessonItems = lessons.map(l => {
      const done = user && progress.some(p => p.studentId === user.id && p.lessonId === l.id && p.completed);
      const canView = enrolled || (user && user.role === 'TEACHER');
      const href = canView ? `lesson.html?courseId=${course.id}&lessonId=${l.id}` : '#';
      const onclick = canView ? '' : `onclick="alert('Bạn cần đăng ký khóa học để xem bài giảng.'); return false;"`;
      return `<a class="lesson-item ${done ? 'completed' : ''}" href="${href}" ${onclick}>
        <div class="lesson-num ${done ? 'done' : ''}">${done ? '✓' : l.lessonOrder}</div>
        <div class="lesson-info">
          <div class="lesson-title">${l.lessonTitle}</div>
          <div class="lesson-meta">${l.durationMinutes} phút ${done ? '· <span style="color:#1a7f37;">Đã hoàn thành</span>' : ''}</div>
        </div>
        <div class="lesson-arrow">${canView ? '→' : '🔒'}</div>
      </a>`;
    }).join('');

    document.getElementById('course-content').innerHTML = `
      <div class="detail-hero">
        <img src="${course.thumbnail}" alt="${course.courseName}" onerror="this.src='images/e-learning.jpg'">
        <div class="content">
          <div class="badge-row">
            <span class="badge">${course.courseCode}</span>
            <span class="badge badge-dark">${course.status}</span>
            <span class="badge">${course.semester}</span>
            ${course.enrollPassword ? '<span class="badge badge-gray">🔒 Có mật khẩu</span>' : ''}
          </div>
          <h3>${course.courseName}</h3>
          <p style="color:#555; margin:.5rem 0;">${course.description}</p>
          <div style="font-size:.88rem; color:#888;">👨‍🏫 ${teacher ? teacher.fullName : 'N/A'} · Tối đa ${course.maxStudents} sinh viên</div>
          <div class="enroll-box">${enrollSection}</div>
        </div>
      </div>

      <h2>Danh sách bài giảng (${lessons.length} bài)</h2>
      <div class="lesson-list">${lessonItems || '<div class="empty-state"><p>Chưa có bài giảng.</p></div>'}</div>

      <div style="margin-top:2rem;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:.75rem;">
          <h2>Diễn đàn thảo luận</h2>
          ${enrolled ? `<a href="forum.html?courseId=${course.id}" class="btn btn-outline btn-sm">Xem diễn đàn →</a>` : ''}
        </div>
        ${renderForumPreview(course.id)}
      </div>`;
  });

  function renderForumPreview(courseId) {
    const posts = DB.getPosts().filter(p => p.courseId === courseId).slice(0, 3);
    if (!posts.length) return '<div class="empty-state"><p>Chưa có bài đăng nào.</p></div>';
    return posts.map(p => {
      const author = DB.getUsers().find(u => u.id === p.authorId);
      return `<div class="post-item" onclick="window.location.href='forum.html?courseId=${courseId}'">
        <div style="display:flex; align-items:center; gap:.5rem; margin-bottom:.35rem;">
          <span class="post-type-badge type-${p.postType}">${p.postType}</span>
          <span class="post-title">${p.title}</span>
        </div>
        <div class="post-meta">👤 ${author ? author.fullName : 'N/A'} · ${formatDate(p.createdAt)} · 👁 ${p.viewCount}</div>
      </div>`;
    }).join('');
  }

  function doEnroll(e, courseId) {
    e.preventDefault();
    const user = DB.getCurrentUser();
    if (!user) { window.location.href = 'login.html'; return; }
    const course = DB.getCourses().find(c => c.id === courseId);
    const pwInput = document.getElementById('enroll-pw');
    const msg = document.getElementById('enroll-msg');
    if (course.enrollPassword && (!pwInput || pwInput.value !== course.enrollPassword)) {
      msg.innerHTML = '<div class="alert alert-error">Mật khẩu khóa học không đúng.</div>';
      return;
    }
    DB.enroll(user.id, courseId);
    showToast('Đăng ký khóa học thành công!');
    setTimeout(() => location.reload(), 800);
  }
</script>
</body>
</html>
