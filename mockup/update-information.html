<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cập nhật thông tin | E-Learning CNTT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><nav id="top-nav"></nav></header>
<main>
  <div class="page">
    <h2>Cập nhật thông tin cá nhân</h2>
    <div id="update-content"></div>
  </div>
</main>
<footer>© 2026 E-Learning CNTT. All rights reserved.</footer>
<script src="mockData/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!requireLogin()) return;
    renderNav();
    const user = DB.getCurrentUser();
    const fullUser = DB.getUsers().find(u => u.id === user.id);

    document.getElementById('update-content').innerHTML = `
      <div style="background:#fff; border:1px solid #e0e7ef; border-radius:12px; padding:1.5rem; max-width:560px;">
        <div id="msg"></div>
        <form onsubmit="doUpdate(event)">
          <div class="info-grid">
            <div>
              <label>Họ và tên</label>
              <input type="text" id="fullName" value="${fullUser.fullName}" required>
            </div>
            <div>
              <label>Số điện thoại</label>
              <input type="tel" id="phone" value="${fullUser.phone || ''}">
            </div>
            <div>
              <label>Email</label>
              <input type="email" value="${fullUser.email}" disabled style="background:#f5f7fa; color:#888;">
            </div>
            <div>
              <label>Tên đăng nhập</label>
              <input type="text" value="${fullUser.username}" disabled style="background:#f5f7fa; color:#888;">
            </div>
          </div>
          <div style="display:flex; gap:.75rem; margin-top:1.25rem; flex-wrap:wrap;">
            <button type="submit" style="width:auto; padding:.65rem 1.5rem;">Lưu thay đổi</button>
            <a href="profile.html" class="btn btn-outline" style="padding:.65rem 1.5rem;">Hủy</a>
          </div>
        </form>
      </div>`;
  });

  function doUpdate(e) {
    e.preventDefault();
    const user = DB.getCurrentUser();
    const fullName = document.getElementById('fullName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const result = DB.updateProfile(user.id, { fullName, phone });
    const msg = document.getElementById('msg');
    if (!result) {
      msg.innerHTML = '<div class="alert alert-error">Cập nhật thất bại.</div>';
      return;
    }
    msg.innerHTML = '<div class="alert alert-success">Cập nhật thông tin thành công!</div>';
    setTimeout(() => window.location.href = 'profile.html', 1200);
  }
</script>
</body>
</html>
