<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài giảng | E-Learning CNTT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><nav id="top-nav"></nav></header>
<main>
  <div class="page">
    <a class="back-link" id="back-link" href="courses.html">← Quay lại khóa học</a>
    <div id="lesson-content"></div>
  </div>
</main>
<footer>© 2026 E-Learning CNTT. All rights reserved.</footer>
<script src="mockData/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!requireLogin()) return;
    renderNav();

    const courseId = parseInt(getParam('courseId'));
    const lessonId = parseInt(getParam('lessonId'));
    const user = DB.getCurrentUser();
    const course = DB.getCourses().find(c => c.id === courseId);
    const lesson = DB.getLessons().find(l => l.id === lessonId);

    if (!course || !lesson) { document.getElementById('lesson-content').innerHTML = '<div class="empty-state"><p>Không tìm thấy bài giảng.</p></div>'; return; }

    // Guard: must be enrolled (or teacher)
    if (user.role === 'STUDENT' && !DB.isEnrolled(user.id, courseId)) {
      window.location.href = `course-detail.html?id=${courseId}`;
      return;
    }

    document.getElementById('back-link').href = `course-detail.html?id=${courseId}`;

    const lessons = DB.getLessons().filter(l => l.courseId === courseId).sort((a,b) => a.lessonOrder - b.lessonOrder);
    const idx = lessons.findIndex(l => l.id === lessonId);
    const prev = idx > 0 ? lessons[idx - 1] : null;
    const next = idx < lessons.length - 1 ? lessons[idx + 1] : null;
    const isCompleted = DB.getLessonCompleted(user.id, lessonId);

    document.getElementById('lesson-content').innerHTML = `
      <div class="lesson-view">
        <div class="lesson-view-header">
          <div class="badge-row">
            <span class="badge">${course.courseCode}</span>
            <span class="badge badge-dark">${course.courseName}</span>
            <span class="badge">Bài ${lesson.lessonOrder}/${lessons.length}</span>
          </div>
          <h2>${lesson.lessonTitle}</h2>
          <div style="font-size:.85rem; color:#888; margin-top:.35rem;">⏱ ${lesson.durationMinutes} phút</div>
        </div>

        <div class="lesson-view-body">
          <div class="lesson-content-box">${lesson.lessonContent.replace(/\n/g, '<br>')}</div>
        </div>

        <div class="lesson-view-footer">
          <div style="display:flex; gap:.75rem; flex-wrap:wrap; align-items:center; width:100%;">
            ${prev ? `<a href="lesson.html?courseId=${courseId}&lessonId=${prev.id}" class="btn btn-outline btn-sm">← Bài trước</a>` : '<span></span>'}
            <div style="flex:1;"></div>
            ${isCompleted
              ? `<span class="badge badge-green" style="font-size:.93rem; padding:.4rem .9rem;">✓ Đã hoàn thành</span>`
              : `<button onclick="markDone()" class="btn-success" style="width:auto; padding:.7rem 1.75rem;">✓ Đánh dấu hoàn thành</button>`}
            ${next ? `<a href="lesson.html?courseId=${courseId}&lessonId=${next.id}" class="btn btn-sm">Bài tiếp theo →</a>` : ''}
          </div>
        </div>
      </div>

      <div style="margin-top:1.5rem;">
        <h2>Bài giảng trong khóa học</h2>
        <div class="lesson-list" style="margin-top:.75rem;">
          ${lessons.map(l => {
            const done = DB.getLessonCompleted(user.id, l.id);
            const active = l.id === lessonId;
            return `<a class="lesson-item ${done ? 'completed' : ''}" href="lesson.html?courseId=${courseId}&lessonId=${l.id}"
              style="${active ? 'background:#e8f0fe; border-color:#0a66c2;' : ''}">
              <div class="lesson-num ${done ? 'done' : ''}">${done ? '✓' : l.lessonOrder}</div>
              <div class="lesson-info">
                <div class="lesson-title" style="${active ? 'color:#0a66c2;' : ''}">${l.lessonTitle}</div>
                <div class="lesson-meta">${l.durationMinutes} phút</div>
              </div>
              <div class="lesson-arrow">${active ? '▶' : '→'}</div>
            </a>`;
          }).join('')}
        </div>
      </div>

      <div style="margin-top:2rem; background:#fff; border:1px solid #e0e7ef; border-radius:12px; padding:1.25rem;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h2 style="font-size:1rem; color:#0a3d7a; margin:0;">📓 Ghi chú bài học này</h2>
          <a href="notes.html" class="btn btn-outline btn-sm">Xem tất cả ghi chú →</a>
        </div>
        <div id="note-list" style="margin-bottom:1rem;"></div>
        <form onsubmit="saveNote(event)" style="display:flex; flex-direction:column; gap:.6rem;">
          <textarea id="note-input" placeholder="Ghi chú của bạn về bài học này..." rows="3" style="resize:vertical;"></textarea>
          <div style="display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;">
            <label style="font-size:.85rem; color:#666; margin:0;">Màu highlight:</label>
            ${['#FFFF00','#90EE90','#FFB6C1','#ADD8E6'].map(c =>
              `<button type="button" onclick="selectColor('${c}')" class="color-dot" data-color="${c}"
                style="width:22px;height:22px;border-radius:50%;background:${c};border:2px solid transparent;cursor:pointer;padding:0;"></button>`
            ).join('')}
            <button type="submit" class="btn btn-sm" style="margin-left:auto; width:auto; padding:.5rem 1.25rem;">Lưu ghi chú</button>
          </div>
        </form>
      </div>`;
  });

  function markDone() {
    const user = DB.getCurrentUser();
    const lessonId = parseInt(getParam('lessonId'));
    const courseId = parseInt(getParam('courseId'));
    DB.markLessonComplete(user.id, lessonId);
    showToast('Đã đánh dấu hoàn thành bài học! +20 XP');
    setTimeout(() => location.reload(), 900);
  }

  let selectedColor = '#FFFF00';

  function selectColor(color) {
    selectedColor = color;
    document.querySelectorAll('.color-dot').forEach(btn => {
      btn.style.border = btn.dataset.color === color ? '2px solid #0a66c2' : '2px solid transparent';
    });
  }

  function renderNoteList(lessonId, userId) {
    const notes = DB.getNotes().filter(n => n.studentId === userId && n.lessonId === lessonId)
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    const el = document.getElementById('note-list');
    if (!el) return;
    el.innerHTML = notes.length ? notes.map(n => `
      <div class="note-item" style="border-left:3px solid ${n.highlightColor}; margin-bottom:.5rem; position:relative;">
        <div style="font-size:.88rem; color:#333; line-height:1.6;">${n.content}</div>
        <div style="font-size:.75rem; color:#aaa; margin-top:.25rem;">${formatDate(n.createdAt)}</div>
        <button onclick="deleteNote(${n.id})" style="position:absolute;top:.5rem;right:.5rem;background:none;border:none;cursor:pointer;color:#ccc;font-size:.85rem;padding:0;" title="Xóa">✕</button>
      </div>`).join('')
      : '<div style="font-size:.85rem; color:#aaa;">Chưa có ghi chú nào cho bài học này.</div>';
    // set first color dot as selected by default
    document.querySelectorAll('.color-dot').forEach(btn => {
      btn.style.border = btn.dataset.color === selectedColor ? '2px solid #0a66c2' : '2px solid transparent';
    });
  }

  function saveNote(e) {
    e.preventDefault();
    const user = DB.getCurrentUser();
    const lessonId = parseInt(getParam('lessonId'));
    const courseId = parseInt(getParam('courseId'));
    const content = document.getElementById('note-input').value.trim();
    if (!content) return;
    const notes = DB.getNotes();
    notes.push({ id: Date.now(), studentId: user.id, lessonId, courseId, content, highlightColor: selectedColor, createdAt: new Date().toISOString().split('T')[0] });
    DB.saveNotes(notes);
    document.getElementById('note-input').value = '';
    renderNoteList(lessonId, user.id);
    showToast('Đã lưu ghi chú!');
  }

  function deleteNote(noteId) {
    const user = DB.getCurrentUser();
    const lessonId = parseInt(getParam('lessonId'));
    const notes = DB.getNotes().filter(n => n.id !== noteId);
    DB.saveNotes(notes);
    renderNoteList(lessonId, user.id);
  }

  // Init note list after content renders
  document.addEventListener('DOMContentLoaded', () => {
    // renderNoteList is called after lesson-content is set, so we hook into a short delay
    setTimeout(() => {
      const user = DB.getCurrentUser();
      const lessonId = parseInt(getParam('lessonId'));
      if (user && lessonId) renderNoteList(lessonId, user.id);
    }, 50);
  });
</script>
</body>
</html>
