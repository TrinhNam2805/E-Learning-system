<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | E-Learning CNTT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><nav id="top-nav"></nav></header>
<main>
  <div class="page">
    <div id="admin-content"></div>
  </div>
</main>
<footer>© 2026 E-Learning CNTT. All rights reserved.</footer>
<script src="mockData/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!requireLogin()) return;
    renderNav();
    const user = DB.getCurrentUser();
    if (user.role !== 'ADMIN') { window.location.href = 'homepage.html'; return; }

    const users = DB.getUsers();
    const courses = DB.getCourses();
    const enrollments = DB.getEnrollments();
    const students = users.filter(u => u.role === 'STUDENT');
    const teachers = users.filter(u => u.role === 'TEACHER');

    document.getElementById('admin-content').innerHTML = `
      <div style="margin-bottom:1.5rem;">
        <h2>Admin Dashboard ⚙️</h2>
        <p style="color:#666; font-size:.93rem;">Quản lý toàn bộ hệ thống E-Learning.</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num">${users.length}</div><div class="stat-label">Tổng người dùng</div></div>
        <div class="stat-card"><div class="stat-num">${students.length}</div><div class="stat-label">Sinh viên</div></div>
        <div class="stat-card"><div class="stat-num">${teachers.length}</div><div class="stat-label">Giảng viên</div></div>
        <div class="stat-card"><div class="stat-num">${courses.length}</div><div class="stat-label">Tổng khóa học</div></div>
        <div class="stat-card"><div class="stat-num">${courses.filter(c=>c.status==='PUBLISHED').length}</div><div class="stat-label">Đang published</div></div>
        <div class="stat-card"><div class="stat-num">${enrollments.length}</div><div class="stat-label">Lượt đăng ký</div></div>
      </div>

      <div style="display:flex; gap:.75rem; margin-bottom:1.5rem; flex-wrap:wrap;">
        <button onclick="showTab('users')" class="btn" id="tab-users">👥 Người dùng</button>
        <button onclick="showTab('courses')" class="btn btn-outline" id="tab-courses">📚 Khóa học</button>
      </div>

      <div id="tab-users-content">
        <div class="page-header" style="margin-bottom:.75rem;">
          <h2>Quản lý người dùng</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Ngày tạo</th><th>Thao tác</th></tr></thead>
            <tbody>
              ${users.map(u => `<tr>
                <td style="color:#888;">#${u.id}</td>
                <td><strong>${u.fullName}</strong></td>
                <td style="color:#666;">${u.email}</td>
                <td><span class="badge ${u.role==='ADMIN'?'badge-dark':u.role==='TEACHER'?'badge-green':'badge'}">${u.role}</span></td>
                <td><span class="badge ${u.locked?'badge-red':'badge-green'}">${u.locked?'Bị khóa':'Hoạt động'}</span></td>
                <td style="color:#888;">${formatDate(u.createdAt)}</td>
                <td>
                  <button onclick="toggleLock(${u.id})" class="btn btn-sm ${u.locked?'btn-success':'btn-danger'}" style="width:auto;">
                    ${u.locked?'Mở khóa':'Khóa'}
                  </button>
                </td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div id="tab-courses-content" style="display:none;">
        <div class="page-header" style="margin-bottom:.75rem;">
          <h2>Quản lý khóa học</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Mã môn</th><th>Tên khóa học</th><th>Giảng viên</th><th>Học kỳ</th><th>Trạng thái</th><th>Sinh viên</th><th>Thao tác</th></tr></thead>
            <tbody>
              ${courses.map(c => {
                const teacher = users.find(u => u.id === c.teacherId);
                const enrolled = enrollments.filter(e => e.courseId === c.id).length;
                return `<tr>
                  <td><span class="badge">${c.courseCode}</span></td>
                  <td><strong>${c.courseName}</strong></td>
                  <td>${teacher ? teacher.fullName : 'N/A'}</td>
                  <td>${c.semester}</td>
                  <td><span class="badge ${c.status==='PUBLISHED'?'badge-green':c.status==='DRAFT'?'badge-gray':'badge-red'}">${c.status}</span></td>
                  <td>${enrolled}/${c.maxStudents}</td>
                  <td><a href="course-detail.html?id=${c.id}" class="btn btn-outline btn-sm">Xem</a></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  });

  function showTab(tab) {
    document.getElementById('tab-users-content').style.display = tab === 'users' ? 'block' : 'none';
    document.getElementById('tab-courses-content').style.display = tab === 'courses' ? 'block' : 'none';
    document.getElementById('tab-users').className = tab === 'users' ? 'btn' : 'btn btn-outline';
    document.getElementById('tab-courses').className = tab === 'courses' ? 'btn' : 'btn btn-outline';
  }

  function toggleLock(userId) {
    const users = DB.getUsers();
    const u = users.find(u => u.id === userId);
    if (!u) return;
    u.locked = !u.locked;
    DB.saveUsers(users);
    showToast(`${u.locked ? 'Đã khóa' : 'Đã mở khóa'} tài khoản ${u.fullName}`);
    setTimeout(() => location.reload(), 800);
  }
</script>
</body>
</html>
