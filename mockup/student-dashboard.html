<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | E-Learning CNTT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><nav id="top-nav"></nav></header>
<main>
  <div class="page">
    <div id="dashboard-content"></div>
  </div>
</main>
<footer>© 2026 E-Learning CNTT. All rights reserved.</footer>
<script src="mockData/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!requireLogin()) return;
    renderNav();
    const user = DB.getCurrentUser();
    if (user.role === 'TEACHER') { window.location.href = 'student-dashboard.html'; return; }
    if (user.role === 'ADMIN') { window.location.href = 'admin.html'; return; }

    const enrollments = DB.getEnrollments().filter(e => e.studentId === user.id);
    const courses = DB.getCourses();
    const progress = DB.getProgress().filter(p => p.studentId === user.id);
    const completedLessons = progress.filter(p => p.completed).length;
    const totalXp = enrollments.reduce((s, e) => s + e.totalXp, 0);
    const notifications = DB.getNotifications().filter(n => n.userId === user.id && !n.isRead);

    document.getElementById('dashboard-content').innerHTML = `
      <div style="margin-bottom:1.5rem;">
        <h2>Xin chào, ${user.fullName} 👋</h2>
        <p style="color:#666; font-size:.93rem;">Tiếp tục hành trình học tập của bạn.</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num">${enrollments.length}</div><div class="stat-label">Khóa học đã đăng ký</div></div>
        <div class="stat-card"><div class="stat-num">${completedLessons}</div><div class="stat-label">Bài học hoàn thành</div></div>
        <div class="stat-card"><div class="stat-num">${totalXp}</div><div class="stat-label">Tổng XP tích lũy</div></div>
        <div class="stat-card"><div class="stat-num">${notifications.length}</div><div class="stat-label">Thông báo chưa đọc</div></div>
      </div>

      <h2>Khóa học của tôi</h2>
      <div class="card-grid" style="margin-top:1rem;">
        ${enrollments.length === 0 ? '<div class="empty-state" style="grid-column:1/-1"><p>Bạn chưa đăng ký khóa học nào. <a href="courses.html">Duyệt khóa học</a></p></div>' :
          enrollments.map(e => {
            const c = courses.find(c => c.id === e.courseId);
            if (!c) return '';
            const teacher = DB.getUsers().find(u => u.id === c.teacherId);
            const lessons = DB.getLessons().filter(l => l.courseId === c.id);
            const nextLesson = lessons.find(l => !DB.getLessonCompleted(user.id, l.id));
            return `<div class="card">
              <div class="card-thumb"><img src="${c.thumbnail}" alt="${c.courseName}" onerror="this.src='images/e-learning.jpg'"></div>
              <div class="content">
                <div class="badge-row"><span class="badge">${c.courseCode}</span><span class="badge badge-dark">${e.status}</span></div>
                <h4>${c.courseName}</h4>
                <div style="font-size:.82rem; color:#888; margin:.25rem 0;">👨‍🏫 ${teacher ? teacher.fullName : 'N/A'}</div>
                <div style="margin:.5rem 0;">
                  <div style="display:flex; justify-content:space-between; font-size:.82rem; color:#666; margin-bottom:.3rem;">
                    <span>Tiến độ</span><span>${e.progressPercentage}%</span>
                  </div>
                  <div class="progress-bar-wrap"><div class="progress-bar ${e.progressPercentage === 100 ? 'green' : ''}" style="width:${e.progressPercentage}%"></div></div>
                </div>
                <div style="font-size:.82rem; color:#0a66c2; margin-bottom:.5rem;">⭐ ${e.totalXp} XP</div>
                <div style="display:flex; gap:.5rem; flex-wrap:wrap;">
                  <a href="course-detail.html?id=${c.id}" class="btn btn-outline btn-sm">Chi tiết</a>
                  ${nextLesson ? `<a href="lesson.html?courseId=${c.id}&lessonId=${nextLesson.id}" class="btn btn-sm">Tiếp tục học</a>` : '<span class="badge badge-green">✓ Hoàn thành</span>'}
                </div>
              </div>
            </div>`;
          }).join('')}
      </div>

      <div style="margin-top:2rem;">
        <div class="page-header">
          <h2>Thông báo gần đây</h2>
          <a href="notifications.html" class="btn btn-outline btn-sm">Xem tất cả</a>
        </div>
        ${DB.getNotifications().filter(n => n.userId === user.id).slice(0,4).map(n => `
          <div class="post-item ${!n.isRead ? 'notif-unread' : ''}" style="margin-bottom:.5rem;">
            <div style="font-weight:${n.isRead ? '400' : '600'};">${n.title}</div>
            <div style="font-size:.88rem; color:#666; margin-top:.25rem;">${n.message}</div>
            <div style="font-size:.8rem; color:#aaa; margin-top:.25rem;">${formatDate(n.createdAt)}</div>
          </div>`).join('') || '<div class="empty-state"><p>Không có thông báo.</p></div>'}
      </div>`;
  });
</script>
</body>
</html>
