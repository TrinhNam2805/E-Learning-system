<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diễn đàn | E-Learning CNTT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><nav id="top-nav"></nav></header>
<main>
  <div class="page">
    <a class="back-link" id="back-link" href="courses.html">← Quay lại khóa học</a>
    <div id="forum-content"></div>
  </div>
</main>
<footer>© 2026 E-Learning CNTT. All rights reserved.</footer>
<script src="mockData/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!requireLogin()) return;
    renderNav();
    const courseId = parseInt(getParam('courseId'));
    const course = DB.getCourses().find(c => c.id === courseId);
    if (!course) { document.getElementById('forum-content').innerHTML = '<div class="empty-state"><p>Không tìm thấy khóa học.</p></div>'; return; }

    document.getElementById('back-link').href = `course-detail.html?id=${courseId}`;
    const user = DB.getCurrentUser();
    const canPost = DB.isEnrolled(user.id, courseId) || user.role === 'TEACHER' || user.role === 'ADMIN';

    renderForum(courseId, canPost);
  });

  function renderForum(courseId, canPost) {
    const course = DB.getCourses().find(c => c.id === courseId);
    const posts = DB.getPosts().filter(p => p.courseId === courseId).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

    document.getElementById('forum-content').innerHTML = `
      <div class="page-header">
        <h2>Diễn đàn – ${course.courseName}</h2>
      </div>

      ${canPost ? `
      <div style="background:#fff; border:1px solid #e0e7ef; border-radius:10px; padding:1.25rem; margin-bottom:1.5rem;">
        <h3 style="font-size:1rem; color:#0a3d7a; margin-bottom:.75rem;">Tạo bài đăng mới</h3>
        <form onsubmit="createPost(event, ${courseId})">
          <label style="margin-top:0;">Tiêu đề</label>
          <input type="text" id="post-title" placeholder="Nhập tiêu đề bài đăng..." required>
          <label>Loại bài đăng</label>
          <select id="post-type">
            <option value="QUESTION">❓ Câu hỏi</option>
            <option value="DISCUSSION">💬 Thảo luận</option>
            <option value="ANNOUNCEMENT">📢 Thông báo (Giảng viên)</option>
          </select>
          <label>Nội dung</label>
          <textarea id="post-content" placeholder="Nội dung bài đăng..." required></textarea>
          <button type="submit" style="width:auto; margin-top:.75rem; padding:.65rem 1.5rem;">Đăng bài</button>
        </form>
      </div>` : '<div class="alert alert-info" style="margin-bottom:1rem;">Đăng ký khóa học để tham gia diễn đàn.</div>'}

      <div id="post-list">
        ${posts.length === 0 ? '<div class="empty-state"><p>Chưa có bài đăng nào. Hãy là người đầu tiên!</p></div>' :
          posts.map(p => {
            const author = DB.getUsers().find(u => u.id === p.authorId);
            return `<div class="post-item" onclick="togglePost('post-${p.id}')">
              <div style="display:flex; align-items:flex-start; gap:.6rem; flex-wrap:wrap;">
                <span class="post-type-badge type-${p.postType}">${p.postType}</span>
                <span class="post-title" style="flex:1;">${p.title}</span>
              </div>
              <div class="post-meta" style="margin-top:.4rem;">
                👤 ${author ? author.fullName : 'N/A'} · ${formatDate(p.createdAt)} · 👁 ${p.viewCount}
              </div>
              <div id="post-${p.id}" style="display:none; margin-top:.75rem; padding-top:.75rem; border-top:1px solid #f0f4fa; font-size:.93rem; color:#333; line-height:1.7;">
                ${p.content}
              </div>
            </div>`;
          }).join('')}
      </div>`;
  }

  function togglePost(id) {
    const el = document.getElementById(id);
    if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
  }

  function createPost(e, courseId) {
    e.preventDefault();
    const user = DB.getCurrentUser();
    const title = document.getElementById('post-title').value.trim();
    const type = document.getElementById('post-type').value;
    const content = document.getElementById('post-content').value.trim();
    if (type === 'ANNOUNCEMENT' && user.role === 'STUDENT') {
      showToast('Chỉ giảng viên mới có thể đăng thông báo.', 'error'); return;
    }
    const posts = DB.getPosts();
    posts.unshift({ id: Date.now(), courseId, authorId: user.id, title, content, postType: type, createdAt: new Date().toISOString().split('T')[0], viewCount: 0 });
    DB.savePosts(posts);
    showToast('Đăng bài thành công!');
    document.getElementById('post-title').value = '';
    document.getElementById('post-content').value = '';
    renderForum(courseId, true);
  }
</script>
</body>
</html>
