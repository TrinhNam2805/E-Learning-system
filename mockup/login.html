<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | E-Learning CNTT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><nav id="top-nav"></nav></header>
<main>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Đăng nhập</h2>
      <div id="msg"></div>
      <form onsubmit="doLogin(event)">
        <label>Email</label>
        <input type="email" id="email" placeholder="example@email.com" required>
        <label>Mật khẩu</label>
        <input type="password" id="password" placeholder="••••••••" required>
        <button type="submit" class="btn btn-full" style="margin-top:1rem;">Đăng nhập</button>
      </form>
      <div class="auth-links">
        <a href="forgot-password.html">Quên mật khẩu?</a>
        &nbsp;·&nbsp;
        Chưa có tài khoản? <a href="register.html">Đăng ký</a>
      </div>
    </div>
  </div>
</main>
<footer>© 2026 E-Learning CNTT. All rights reserved.</footer>
<script src="mockData/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    renderNav();
    // Redirect if already logged in
    if (DB.isLoggedIn()) window.location.href = 'homepage.html';
  });

  function doLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    const result = DB.login(email, password);
    if (!result) {
      msg.innerHTML = '<div class="alert alert-error">Email hoặc mật khẩu không đúng.</div>';
      document.getElementById('password').value = '';
      return;
    }
    if (result === 'locked') {
      msg.innerHTML = '<div class="alert alert-error">Tài khoản đã bị khóa. Vui lòng liên hệ quản trị viên.</div>';
      return;
    }
    // Redirect based on role
    const dest = result.role === 'ADMIN' ? 'admin.html' : result.role === 'TEACHER' ? 'student-dashboard.html' : 'homepage.html';
    window.location.href = dest;
  }
</script>
</body>
</html>
