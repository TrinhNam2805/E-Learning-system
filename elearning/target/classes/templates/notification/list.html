<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page">
        <div class="page-header">
            <h2>&#128276; Notifications</h2>
            <form th:action="@{/notifications/mark-all-read}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline btn-sm">&#10003; Mark all as read</button>
            </form>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div th:if="${notifications.isEmpty()}" class="empty-state">
            <p>No notifications.</p>
        </div>

        <div th:each="n : ${notifications}" class="post-item"
             style="margin-bottom:.5rem; display:flex; gap:.75rem; align-items:flex-start;">
            <div style="font-size:1.5rem; flex-shrink:0;">
                <span th:if="${n.type.name() == 'GRADE'}">&#128202;</span>
                <span th:if="${n.type.name() == 'ASSIGNMENT'}">&#128221;</span>
                <span th:if="${n.type.name() == 'BADGE'}">&#127885;</span>
                <span th:if="${n.type.name() == 'COMMENT'}">&#128172;</span>
                <span th:if="${n.type.name() == 'ANNOUNCEMENT'}">&#128226;</span>
                <span th:if="${n.type.name() == 'SYSTEM'}">&#9881;</span>
            </div>
            <div style="flex:1;">
                <div style="font-weight:600; color:#0a3d7a;" th:text="${n.title}"></div>
                <div style="font-size:.9rem; color:#555; margin-top:.25rem;" th:text="${n.message}"></div>
                <div style="font-size:.8rem; color:#aaa; margin-top:.3rem;"
                     th:text="${#temporals.format(n.createdAt, 'MM/dd/yyyy HH:mm')}"></div>
            </div>
            <span th:unless="${n.isRead}" class="badge badge-dark" style="flex-shrink:0; align-self:center;">New</span>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
