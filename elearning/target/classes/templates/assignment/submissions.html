<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Submissions')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page">
        <a class="back-link" th:href="@{/teacher/courses/{id}/assignments(id=${assignment.course.id})}">← Back to Assignments</a>
        <h2 th:text="'Submissions – ' + ${assignment.title}">Submissions</h2>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div th:if="${submissions.isEmpty()}" class="empty-state"><p>No submissions yet.</p></div>

        <div th:each="s : ${submissions}"
             style="background:#fff; border:1px solid #e0e7ef; border-radius:10px; padding:1.25rem; margin-bottom:1rem;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:.75rem; margin-bottom:.75rem;">
                <div>
                    <div style="font-weight:700; color:#0a3d7a;" th:text="${s.student.fullName}"></div>
                    <div style="font-size:.85rem; color:#888;" th:text="${s.student.email}"></div>
                    <div style="font-size:.82rem; color:#aaa; margin-top:.2rem;"
                         th:text="'Submitted: ' + ${#temporals.format(s.submittedAt, 'MM/dd/yyyy HH:mm')}"></div>
                </div>
                <span class="badge"
                      th:classappend="${s.status.name() == 'GRADED'} ? 'badge-green' : 'badge-gray'"
                      th:text="${s.status}"></span>
            </div>

            <div th:if="${s.content != null}"
                 style="background:#f8faff; border-radius:6px; padding:.75rem; font-size:.9rem; color:#333; white-space:pre-wrap; margin-bottom:.75rem;"
                 th:text="${s.content}"></div>

            <!-- Grade form -->
            <form th:action="@{/assignments/grade/{id}(id=${s.id})}" method="post"
                  style="display:flex; gap:.75rem; align-items:flex-end; flex-wrap:wrap;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div>
                    <label style="margin-top:0; font-size:.85rem;">Score (max <span th:text="${assignment.maxScore}"></span>)</label>
                    <input type="number" name="score" th:value="${s.score}" min="0" th:max="${assignment.maxScore}"
                           step="0.5" style="width:100px; margin-top:.25rem;">
                </div>
                <div style="flex:1; min-width:200px;">
                    <label style="margin-top:0; font-size:.85rem;">Feedback</label>
                    <input type="text" name="feedback" th:value="${s.feedback}" placeholder="Feedback..." style="margin-top:.25rem;">
                </div>
                <button type="submit" class="btn btn-sm btn-success" style="width:auto; margin-bottom:0;">Grade</button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
