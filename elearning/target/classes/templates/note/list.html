<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Notes')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page">
        <div class="page-header">
            <h2>&#128211; My Notes</h2>
            <button onclick="document.getElementById('new-note-form').style.display = document.getElementById('new-note-form').style.display === 'none' ? 'block' : 'none'"
                    class="btn">+ New Note</button>
        </div>

        <form th:action="@{/notes}" method="get" style="margin-bottom:1rem; display:flex; gap:.5rem; flex-wrap:wrap; align-items:center;">
            <input type="search" name="tag" th:value="${filterTag}" placeholder="Filter by tag (contains)..." style="max-width:280px;">
            <button type="submit" class="btn btn-sm">Filter</button>
            <a th:href="@{/notes}" class="btn btn-outline btn-sm" th:if="${filterTag != null and !filterTag.isEmpty()}">Clear</a>
        </form>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- Create standalone note form -->
        <div id="new-note-form" style="display:none; background:#fff; border:1px solid #e0e7ef; border-radius:10px; padding:1.25rem; margin-bottom:1.5rem;">
            <h3 style="font-size:1rem; color:#0a3d7a; margin-bottom:.75rem;">Create New Note</h3>
            <form th:action="@{/notes/save}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="noteType" value="STANDALONE">
                <label style="margin-top:0;">Title</label>
                <input type="text" name="title" placeholder="Note title...">
                <label>Link to Course (optional)</label>
                <select name="courseId">
                    <option value="">-- No link --</option>
                    <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.courseCode + ' - ' + c.courseName}"></option>
                </select>
                <label>Content</label>
                <textarea name="content" placeholder="Note content..." required style="min-height:120px;"></textarea>
                <div style="display:flex; gap:1rem; align-items:center; margin-top:.75rem; flex-wrap:wrap;">
                    <div>
                        <label style="margin-top:0; font-size:.85rem;">Highlight Color</label>
                        <div style="display:flex; gap:.5rem; margin-top:.35rem;">
                            <label th:each="color : ${ {'#FFFF00','#90EE90','#FFB6C1','#87CEEB','#FFA500'} }" style="cursor:pointer;">
                                <input type="radio" name="highlightColor" th:value="${color}" th:checked="${color == '#FFFF00'}" style="display:none;">
                                <span th:style="'display:inline-block; width:24px; height:24px; border-radius:50%; background:' + ${color} + '; border:2px solid #ccc;'"></span>
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-sm" style="margin-top:auto;">Save Note</button>
                </div>
            </form>
        </div>

        <div th:if="${allNotes.isEmpty()}" class="empty-state">
            <p>No notes yet. Create your first note!</p>
        </div>

        <div th:unless="${allNotes.isEmpty()}">
            <!-- Standalone notes -->
            <div th:if="${!standaloneNotes.isEmpty()}" style="margin-bottom:2rem;">
                <h3 style="font-size:1rem; color:#0a3d7a; margin-bottom:.75rem;">&#128204; Standalone Notes</h3>
                <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:1rem;">
                    <div th:each="n : ${standaloneNotes}"
                         th:style="'background:#fff; border:1px solid #e0e7ef; border-radius:10px; padding:1rem; border-top:4px solid ' + ${n.highlightColor} + ';'">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:.5rem; margin-bottom:.5rem;">
                            <div>
                                <a th:href="@{/notes/{id}(id=${n.id})}" style="font-size:.78rem; color:#0a66c2;">Open detail &rarr;</a>
                                <div style="font-weight:600; color:#0a3d7a; font-size:.95rem;"
                                     th:text="${n.title != null and !n.title.trim().isEmpty() ? n.title : 'Note'}"></div>
                            </div>
                            <form th:action="@{/notes/{id}/delete(id=${n.id})}" method="post" style="flex-shrink:0;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('Delete this note?')" style="padding:.2rem .45rem;">&#10005;</button>
                            </form>
                        </div>
                        <div style="font-size:.9rem; color:#333; line-height:1.6; white-space:pre-wrap;" th:text="${n.content}"></div>
                        <div style="margin-top:.5rem; font-size:.78rem; color:#aaa;">
                            <span th:if="${n.course != null}" th:text="${n.course.courseCode} + ' &middot; '"></span>
                            <span th:text="${#temporals.format(n.createdAt, 'MM/dd/yyyy')}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lesson notes -->
            <div>
                <h3 style="font-size:1rem; color:#0a3d7a; margin-bottom:.75rem;">&#128218; Lesson Notes</h3>
                <div style="display:flex; flex-direction:column; gap:.6rem;">
                    <div th:each="n : ${allNotes}" th:if="${n.noteType != null and n.noteType.name() == 'LESSON'}"
                         class="note-item" th:style="'border-left:4px solid ' + ${n.highlightColor} + '; background:#fff; border-radius:0 8px 8px 0; padding:.85rem 1rem;'">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:.5rem;">
                            <div style="flex:1;">
                                <div style="font-size:.9rem; color:#333; line-height:1.6; white-space:pre-wrap;" th:text="${n.content}"></div>
                                <div style="margin-top:.4rem; font-size:.78rem; color:#aaa; display:flex; gap:.75rem; flex-wrap:wrap;">
                                    <span th:if="${n.course != null}">
                                        <a th:href="@{/courses/{id}(id=${n.course.id})}" th:text="${n.course.courseCode}"></a>
                                    </span>
                                    <span th:if="${n.lesson != null}">
                                        <a th:href="@{/lessons/{id}(id=${n.lesson.id}, courseId=${n.course != null ? n.course.id : null})}"
                                           th:text="${#strings.abbreviate(n.lesson.lessonTitle, 40)}"></a>
                                    </span>
                                    <span th:text="${#temporals.format(n.createdAt, 'MM/dd/yyyy HH:mm')}"></span>
                                </div>
                            </div>
                            <form th:action="@{/notes/{id}/delete(id=${n.id})}" method="post" style="flex-shrink:0;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('Delete this note?')" style="padding:.2rem .45rem;">&#10005;</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
