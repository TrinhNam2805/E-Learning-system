<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Assignments')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page">
        <a class="back-link" th:href="@{/teacher/dashboard}">← Dashboard</a>
        <div class="page-header">
            <h2 th:text="'Assignments – ' + ${course.courseCode}">Assignments</h2>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div style="background:#fff; border:1px solid #e0e7ef; border-radius:10px; padding:1.25rem; margin-bottom:1.5rem;">
            <h3 style="font-size:1rem; color:#0a3d7a; margin-bottom:.75rem;">Add Assignment / Quiz</h3>
            <form th:action="@{/teacher/courses/{id}/assignments/add(id=${course.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label style="margin-top:0;">Title</label>
                <input type="text" name="title" placeholder="Assignment title..." required>
                <label>Description</label>
                <textarea name="description" placeholder="Requirements..."></textarea>
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:1rem;">
                    <div>
                        <label>Type</label>
                        <select name="type">
                            <option value="HOMEWORK">📌 Homework</option>
                            <option value="QUIZ">📝 Quiz</option>
                            <option value="EXAM">📋 Exam</option>
                        </select>
                    </div>
                    <div>
                        <label>Due Date</label>
                        <input type="date" name="dueDate" required>
                    </div>
                    <div>
                        <label>Max Score</label>
                        <input type="number" name="maxScore" value="10" min="1" step="0.5">
                    </div>
                </div>
                <button type="submit" class="btn" style="width:auto; margin-top:.75rem; padding:.65rem 1.5rem;">Add Assignment</button>
            </form>
        </div>

        <div th:if="${assignments.isEmpty()}" class="empty-state"><p>No assignments yet.</p></div>
        <div class="table-wrap" th:unless="${assignments.isEmpty()}">
            <table>
                <thead><tr><th>Title</th><th>Type</th><th>Due Date</th><th>Score</th><th>Actions</th></tr></thead>
                <tbody>
                    <tr th:each="a : ${assignments}">
                        <td th:text="${a.title}"></td>
                        <td><span class="badge" th:text="${a.type}"></span></td>
                        <td th:text="${#temporals.format(a.dueDate, 'MM/dd/yyyy')}"></td>
                        <td th:text="${a.maxScore}"></td>
                        <td>
                            <a th:href="@{/assignments/{id}/submissions(id=${a.id})}" class="btn btn-outline btn-sm">View Submissions</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
