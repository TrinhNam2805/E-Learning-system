<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${post.title})}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page">
        <a class="back-link" th:href="@{/forum(courseId=${post.course.id})}">&larr; Back to Forum</a>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <!-- Post -->
        <div style="background:#fff; border:1px solid #e0e7ef; border-radius:12px; padding:1.5rem; margin-bottom:1.5rem;">
            <div style="display:flex; align-items:center; gap:.6rem; margin-bottom:.75rem;">
                <span class="badge" th:text="${post.postType}"></span>
                <span class="badge badge-dark" th:text="${post.course.courseCode}"></span>
            </div>
            <h2 style="color:#0a3d7a; font-size:1.2rem; margin-bottom:.75rem;" th:text="${post.title}"></h2>
            <div style="font-size:.93rem; color:#333; line-height:1.8; white-space:pre-wrap;" th:text="${post.content}"></div>
            <div style="margin-top:1rem; padding-top:.75rem; border-top:1px solid #f0f4fa; font-size:.85rem; color:#888;"
                 th:text="${(post.author != null ? post.author.fullName : '') + ' · ' + #temporals.format(post.createdAt, 'MM/dd/yyyy HH:mm') + ' · ' + post.viewCount + ' views'}"></div>
        </div>

        <!-- Comments -->
        <h3 style="font-size:1rem; color:#0a3d7a; margin-bottom:.75rem;"
            th:text="'Comments (' + ${comments.size()} + ')'">Comments</h3>

        <div th:if="${comments.isEmpty()}" style="font-size:.88rem; color:#aaa; margin-bottom:1rem;">
            No comments yet.
        </div>

        <div th:each="c : ${comments}" style="background:#fff; border:1px solid #e0e7ef; border-radius:8px; padding:1rem; margin-bottom:.6rem;">
            <div style="display:flex; align-items:center; gap:.5rem; margin-bottom:.5rem;">
                <div class="avatar" style="width:32px; height:32px; font-size:.8rem;"
                     th:text="${#strings.toUpperCase(#strings.substring(c.author.fullName, 0, 1))}">A</div>
                <div>
                    <div style="font-weight:600; font-size:.9rem;" th:text="${c.author.fullName}"></div>
                    <div style="font-size:.78rem; color:#aaa;" th:text="${#temporals.format(c.createdAt, 'MM/dd/yyyy HH:mm')}"></div>
                </div>
            </div>
            <div style="font-size:.93rem; color:#333; line-height:1.7; white-space:pre-wrap;" th:text="${c.content}"></div>
        </div>

        <!-- Add comment -->
        <div th:if="${canPost}" style="background:#fff; border:1px solid #e0e7ef; border-radius:10px; padding:1.25rem; margin-top:1rem;">
            <h3 style="font-size:1rem; color:#0a3d7a; margin-bottom:.75rem;">Add Comment</h3>
            <form th:action="@{/forum/comment}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="postId" th:value="${post.id}">
                <textarea name="content" placeholder="Write your comment..." required style="min-height:80px;"></textarea>
                <button type="submit" class="btn" style="width:auto; margin-top:.75rem; padding:.65rem 1.5rem;">Submit</button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
