<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${lesson.lessonTitle})}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page">
        <a class="back-link" th:href="@{/courses/{id}(id=${course.id})}">&larr; Back to Course</a>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div style="display:grid; grid-template-columns:1fr 280px; gap:1.5rem; align-items:start;">
            <!-- Main lesson content -->
            <div>
                <div class="lesson-view">
                    <div class="lesson-view-header">
                        <div class="badge-row">
                            <span class="badge" th:text="${course.courseCode}"></span>
                            <span class="badge badge-dark" th:text="${course.courseName}"></span>
                            <span class="badge" th:text="'Lesson ' + ${lesson.lessonOrder} + '/' + ${allLessons.size()}"></span>
                        </div>
                        <h2 th:text="${lesson.lessonTitle}"></h2>
                        <div style="font-size:.85rem; color:#888; margin-top:.35rem;"
                             th:text="${lesson.durationMinutes} + ' min'"></div>
                    </div>

                    <div class="lesson-view-body">
                        <div class="lesson-content-box" th:text="${lesson.lessonContent}"></div>
                    </div>

                    <div class="lesson-view-footer">
                        <div style="display:flex; gap:.75rem; flex-wrap:wrap; align-items:center; width:100%;">
                            <a th:if="${prev != null}" th:href="@{/lessons/{id}(id=${prev.id}, courseId=${course.id})}"
                               class="btn btn-outline btn-sm">&larr; Previous</a>
                            <div style="flex:1;"></div>
                            <span th:if="${isCompleted}" class="badge badge-green" style="font-size:.93rem; padding:.4rem .9rem;">&#10003; Completed</span>
                            <form th:unless="${isCompleted}" th:action="@{/lessons/{id}/complete(id=${lesson.id})}" method="post" style="display:inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="courseId" th:value="${course.id}">
                                <button type="submit" class="btn btn-success" style="padding:.7rem 1.75rem;">&#10003; Mark Complete</button>
                            </form>
                            <a th:if="${next != null}" th:href="@{/lessons/{id}(id=${next.id}, courseId=${course.id})}"
                               class="btn btn-sm">Next &rarr;</a>
                        </div>
                    </div>
                </div>

                <!-- Notes section -->
                <div style="margin-top:1.5rem; background:#fff; border:1px solid #e0e7ef; border-radius:12px; padding:1.25rem;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                        <h3 style="font-size:1rem; color:#0a3d7a;">&#128211; Lesson Notes</h3>
                        <button onclick="document.getElementById('note-form').style.display = document.getElementById('note-form').style.display === 'none' ? 'block' : 'none'"
                                class="btn btn-outline btn-sm">+ Add Note</button>
                    </div>

                    <div id="note-form" style="display:none; margin-bottom:1rem; padding:1rem; background:#f8faff; border-radius:8px; border:1px solid #dce8fb;">
                        <form th:action="@{/notes/save}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="lessonId" th:value="${lesson.id}">
                            <input type="hidden" name="courseId" th:value="${course.id}">
                            <input type="hidden" name="noteType" value="LESSON">
                            <label style="margin-top:0;">Note Content</label>
                            <textarea name="content" placeholder="Write your note here..." required style="min-height:80px;"></textarea>
                            <div style="display:flex; gap:1rem; align-items:center; margin-top:.75rem; flex-wrap:wrap;">
                                <div>
                                    <label style="margin-top:0; font-size:.85rem;">Highlight Color</label>
                                    <div style="display:flex; gap:.5rem; margin-top:.35rem;">
                                        <label th:each="color : ${ {'#FFFF00','#90EE90','#FFB6C1','#87CEEB','#FFA500'} }"
                                               style="cursor:pointer;">
                                            <input type="radio" name="highlightColor" th:value="${color}"
                                                   th:checked="${color == '#FFFF00'}" style="display:none;">
                                            <span th:style="'display:inline-block; width:24px; height:24px; border-radius:50%; background:' + ${color} + '; border:2px solid #ccc;'"></span>
                                        </label>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-sm" style="margin-top:auto;">Save Note</button>
                            </div>
                        </form>
                    </div>

                    <div th:if="${lessonNotes.isEmpty()}" style="font-size:.88rem; color:#aaa; text-align:center; padding:.5rem 0;">
                        No notes for this lesson yet.
                    </div>
                    <div th:each="n : ${lessonNotes}" class="note-item"
                         th:style="'border-left:3px solid ' + ${n.highlightColor} + '; margin-bottom:.5rem;'">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:.5rem;">
                            <div style="font-size:.9rem; color:#333; line-height:1.6; flex:1;" th:text="${n.content}"></div>
                            <form th:action="@{/notes/{id}/delete(id=${n.id})}" method="post" style="flex-shrink:0;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('Delete this note?')" style="padding:.25rem .5rem;">&#10005;</button>
                            </form>
                        </div>
                        <div style="font-size:.75rem; color:#aaa; margin-top:.25rem;"
                             th:text="${#temporals.format(n.createdAt, 'MM/dd/yyyy HH:mm')}"></div>
                    </div>
                </div>
            </div>

            <!-- Sidebar: lesson list -->
            <aside style="position:sticky; top:calc(56px + 12px);">
                <div style="background:#fff; border:1px solid #e0e7ef; border-radius:12px; padding:1rem;">
                    <div style="font-size:.9rem; font-weight:700; color:#0a3d7a; margin-bottom:.75rem;">
                        Course Lessons
                    </div>
                    <div class="lesson-list" style="margin-top:0;">
                        <a class="lesson-item" th:each="l : ${allLessons}"
                           th:href="@{/lessons/{id}(id=${l.id}, courseId=${course.id})}"
                           th:style="${l.id == lesson.id} ? 'background:#e8f0fe; border-color:#0a66c2;' : ''">
                            <div class="lesson-num" th:text="${l.lessonOrder}">1</div>
                            <div class="lesson-info">
                                <div class="lesson-title"
                                     th:style="${l.id == lesson.id} ? 'color:#0a66c2;' : ''"
                                     th:text="${l.lessonTitle}"></div>
                                <div class="lesson-meta" th:text="${l.durationMinutes} + ' min'"></div>
                            </div>
                            <div class="lesson-arrow" th:text="${l.id == lesson.id} ? '&#9654;' : '&rarr;'"></div>
                        </a>
                    </div>
                </div>
            </aside>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
