<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Teacher Dashboard')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page">
        <div style="margin-bottom:1.5rem;">
            <h2 th:text="'Teacher Dashboard - ' + ${currentUser.fullName}">Dashboard</h2>
            <p style="color:#666; font-size:.93rem;">Manage your courses and track student progress.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-num" th:text="${myCourses.size()}">0</div>
                <div class="stat-label">My Courses</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" th:text="${totalStudents}">0</div>
                <div class="stat-label">Total Students</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" th:text="${totalLessons}">0</div>
                <div class="stat-label">Total Lessons</div>
            </div>
        </div>

        <h2 style="margin-top:1.5rem;">My Courses</h2>
        <div class="table-wrap" style="margin-top:1rem;">
            <table>
                <thead>
                    <tr><th>Code</th><th>Course Name</th><th>Semester</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${myCourses}">
                        <td><span class="badge" th:text="${c.courseCode}"></span></td>
                        <td><strong th:text="${c.courseName}"></strong></td>
                        <td th:text="${c.semester}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${c.status.name() == 'PUBLISHED'} ? 'badge-green' : 'badge-gray'"
                                  th:text="${c.status}"></span>
                        </td>
                        <td>
                            <div style="display:flex; gap:.4rem; flex-wrap:wrap;">
                                <a th:href="@{/courses/{id}(id=${c.id})}" class="btn btn-outline btn-sm">View</a>
                                <a th:href="@{/teacher/courses/{id}/lessons(id=${c.id})}" class="btn btn-outline btn-sm">Lessons</a>
                                <a th:href="@{/teacher/courses/{id}/assignments(id=${c.id})}" class="btn btn-outline btn-sm">Assignments</a>
                                <a th:href="@{/teacher/courses/{id}/students(id=${c.id})}" class="btn btn-outline btn-sm">Students</a>
                                <a th:href="@{/forum(courseId=${c.id})}" class="btn btn-outline btn-sm">Forum</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
