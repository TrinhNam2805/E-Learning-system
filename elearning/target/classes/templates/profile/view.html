<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page">
        <h2>My Profile</h2>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <!-- Profile card -->
        <div class="profile-card">
            <div class="avatar"
                 th:text="${#strings.toUpperCase(#strings.substring(currentUser.fullName, 0, 1))}">A</div>
            <div class="profile-info">
                <h3 th:text="${currentUser.fullName}"></h3>
                <p th:text="${currentUser.email}"></p>
                <p style="margin-top:.35rem;"><span class="badge badge-dark" th:text="${currentUser.role}"></span></p>
            </div>
        </div>

        <!-- Edit form -->
        <div style="background:#fff; border:1px solid #e0e7ef; border-radius:12px; padding:1.5rem; margin-bottom:1.5rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h3 style="font-size:1rem; color:#0a3d7a;">Personal Information</h3>
                <button onclick="toggleEdit()" class="btn btn-outline btn-sm" id="edit-btn">Edit</button>
            </div>

            <div id="view-mode">
                <div class="info-grid">
                    <div class="info-item"><label>Full Name</label><span th:text="${currentUser.fullName}"></span></div>
                    <div class="info-item"><label>Email</label><span th:text="${currentUser.email}"></span></div>
                    <div class="info-item"><label>Username</label><span th:text="${currentUser.username}"></span></div>
                    <div class="info-item"><label>Phone</label><span th:text="${currentUser.phone != null ? currentUser.phone : '-'}"></span></div>
                    <div class="info-item"><label>Role</label><span th:text="${currentUser.role}"></span></div>
                    <div class="info-item"><label>Joined</label><span th:text="${#temporals.format(currentUser.createdAt, 'MM/dd/yyyy')}"></span></div>
                </div>
            </div>

            <div id="edit-mode" style="display:none;">
                <form th:action="@{/profile/update}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="info-grid">
                        <div>
                            <label>Full Name</label>
                            <input type="text" name="fullName" th:value="${currentUser.fullName}" required>
                        </div>
                        <div>
                            <label>Phone</label>
                            <input type="tel" name="phone" th:value="${currentUser.phone}">
                        </div>
                    </div>
                    <div style="display:flex; gap:.75rem; margin-top:1rem;">
                        <button type="submit" class="btn" style="width:auto; padding:.65rem 1.5rem;">Save Changes</button>
                        <button type="button" onclick="toggleEdit()" class="btn btn-outline" style="width:auto; padding:.65rem 1.5rem;">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div style="display:flex; gap:.75rem; flex-wrap:wrap;">
            <a th:href="@{/change-password}" class="btn btn-outline">Change Password</a>
            <a th:href="@{/dashboard}" class="btn btn-outline">Dashboard</a>
            <a th:href="@{/notes}" class="btn btn-outline">My Notes</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
function toggleEdit() {
    var view = document.getElementById('view-mode');
    var edit = document.getElementById('edit-mode');
    var btn = document.getElementById('edit-btn');
    var isEditing = edit.style.display !== 'none';
    view.style.display = isEditing ? 'block' : 'none';
    edit.style.display = isEditing ? 'none' : 'block';
    btn.textContent = isEditing ? 'Edit' : 'Cancel';
}
</script>
</body>
</html>
