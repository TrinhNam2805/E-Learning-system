<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change Password')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page">
        <a class="back-link" th:href="@{/profile}">← Back to Profile</a>
        <h2>Change Password</h2>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div style="background:#fff; border:1px solid #e0e7ef; border-radius:12px; padding:1.5rem; max-width:480px;">
            <form th:action="@{/change-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>Current Password</label>
                <input type="password" name="currentPassword" placeholder="Current password" required>
                <label>New Password</label>
                <input type="password" name="newPassword" placeholder="New password (min 6 chars)" required>
                <label>Confirm New Password</label>
                <input type="password" name="confirmPassword" placeholder="Confirm new password" required>
                <button type="submit" class="btn" style="margin-top:1rem; width:auto; padding:.75rem 2rem;">Change Password</button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
