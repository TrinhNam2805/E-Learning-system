<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot Password')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Forgot Password</h2>
            <p style="color:#666; font-size:.93rem; margin-bottom:1rem;">
                Please contact your administrator to reset your password.
            </p>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <div style="background:#f4f7fb; border-radius:8px; padding:1rem; font-size:.88rem; color:#555; margin-bottom:1.25rem;">
                <div style="margin-bottom:.5rem;">&#128231; Contact support at <strong>support@elearning.edu</strong></div>
                <div>&#128222; Or reach out to your course administrator directly.</div>
            </div>

            <div class="auth-links">
                <a th:href="@{/login}">&larr; Back to Login</a>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
