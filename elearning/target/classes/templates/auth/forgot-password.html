<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot Password')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Forgot Password</h2>
            <p style="color:#666; font-size:.93rem; margin-bottom:1.25rem;">
                Enter your email to receive password reset instructions.
            </p>
            <div class="alert alert-info">
                This feature is under development. Please contact the administrator for assistance.
            </div>
            <div class="auth-links">
                <a th:href="@{/login}">&larr; Back to Login</a>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
