<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rankings')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page">
        <div class="page-header">
            <h2>&#127942; XP Leaderboard</h2>
        </div>

        <!-- My rank card -->
        <div th:if="${myRank != null}" style="background:linear-gradient(135deg,#0a66c2,#004fa3); color:#fff; border-radius:12px; padding:1.5rem; margin-bottom:1.5rem; display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap;">
            <div style="font-size:2.5rem;">
                <span th:if="${myRank.rank == 1}">&#129351;</span>
                <span th:if="${myRank.rank == 2}">&#129352;</span>
                <span th:if="${myRank.rank == 3}">&#129353;</span>
                <span th:if="${myRank.rank > 3}" th:text="'#' + ${myRank.rank}"></span>
            </div>
            <div style="flex:1;">
                <div style="font-size:1.1rem; font-weight:700;" th:text="${myRank.fullName} + ' (you)'"></div>
                <div style="font-size:.9rem; opacity:.85;" th:text="${'Level ' + myRank.level + ' · ' + myRank.totalXp + ' XP'}"></div>
                <div style="margin-top:.5rem;">
                    <div style="font-size:.78rem; opacity:.7; margin-bottom:.25rem;"
                         th:text="${myRank.xpInLevel} + '/100 XP to Level ' + (${myRank.level} + 1)"></div>
                    <div style="background:rgba(255,255,255,.3); border-radius:999px; height:6px;">
                        <div th:style="'width:' + ${myRank.xpInLevel} + '%; background:#f59e0b; height:6px; border-radius:999px;'"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Leaderboard -->
        <div style="background:#fff; border:1px solid #e0e7ef; border-radius:12px; overflow:hidden;">
            <div style="padding:1rem 1.25rem; border-bottom:1px solid #e8eef6; font-weight:700; color:#0a3d7a;">
                Top Students
            </div>
            <div th:each="r, stat : ${rankings}"
                 th:style="'display:flex; align-items:center; gap:1rem; padding:.85rem 1.25rem; border-bottom:1px solid #f0f4fa;' + (${currentUser != null and r.userId == currentUser.id} ? 'background:#e8f0fe;' : '')">
                <div style="width:2.5rem; text-align:center; flex-shrink:0;">
                    <span th:if="${stat.index == 0}" style="font-size:1.5rem;">&#129351;</span>
                    <span th:if="${stat.index == 1}" style="font-size:1.5rem;">&#129352;</span>
                    <span th:if="${stat.index == 2}" style="font-size:1.5rem;">&#129353;</span>
                    <span th:if="${stat.index >= 3}" style="font-size:1rem; font-weight:700; color:#888;"
                          th:text="${r.rank}"></span>
                </div>
                <div class="avatar" style="width:40px; height:40px; font-size:.9rem; flex-shrink:0;"
                     th:text="${#strings.toUpperCase(#strings.substring(r.fullName, 0, 1))}">A</div>
                <div style="flex:1; min-width:0;">
                    <div style="font-weight:600; color:#0a3d7a;"
                         th:text="${r.fullName} + (${currentUser != null and r.userId == currentUser.id} ? ' (you)' : '')"></div>
                    <div style="font-size:.82rem; color:#888;" th:text="'Level ' + ${r.level}"></div>
                </div>
                <div style="width:120px; flex-shrink:0;">
                    <div style="font-size:.82rem; color:#666; text-align:right; margin-bottom:.2rem;"
                         th:text="${r.totalXp} + ' XP'"></div>
                    <div class="progress-bar-wrap" style="height:6px;">
                        <div class="progress-bar" th:style="'width:' + ${r.xpInLevel} + '%; background:#f59e0b;'"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
