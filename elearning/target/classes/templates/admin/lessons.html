<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Lessons')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page">
        <a class="back-link" th:href="@{/admin/dashboard}">← Admin Dashboard</a>
        <div class="page-header">
            <h2 th:text="${'Lessons – ' + course.courseCode + ': ' + course.courseName}">Lessons</h2>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <!-- Add lesson form -->
        <div style="background:#fff; border:1px solid #e0e7ef; border-radius:10px; padding:1.25rem; margin-bottom:1.5rem;">
            <h3 style="font-size:1rem; color:#0a3d7a; margin-bottom:.75rem;">Add New Lesson</h3>
            <form th:action="@{/admin/courses/{id}/lessons/add(id=${course.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label style="margin-top:0;">Lesson Title</label>
                <input type="text" name="lessonTitle" placeholder="Title..." required>
                <label>Content</label>
                <textarea name="lessonContent" placeholder="Lesson content..." style="min-height:150px;" required></textarea>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div>
                        <label>Video URL (optional)</label>
                        <input type="url" name="videoUrl" placeholder="https://...">
                    </div>
                    <div>
                        <label>Duration (minutes)</label>
                        <input type="number" name="durationMinutes" value="45" min="1" required>
                    </div>
                </div>
                <button type="submit" class="btn" style="width:auto; margin-top:.75rem; padding:.65rem 1.5rem;">Add Lesson</button>
            </form>
        </div>

        <!-- Lessons list -->
        <div class="lesson-list" th:if="${!lessons.isEmpty()}">
            <div class="lesson-item" th:each="l : ${lessons}" style="cursor:default;">
                <div class="lesson-num" th:text="${l.lessonOrder}">1</div>
                <div class="lesson-info">
                    <div class="lesson-title" th:text="${l.lessonTitle}"></div>
                    <div class="lesson-meta" th:text="${l.durationMinutes} + ' min'"></div>
                </div>
                <a th:href="@{/lessons/{id}(id=${l.id}, courseId=${course.id})}" class="btn btn-outline btn-sm">View</a>
            </div>
        </div>
        <div class="empty-state" th:if="${lessons.isEmpty()}">
            <p>No lessons yet.</p>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
