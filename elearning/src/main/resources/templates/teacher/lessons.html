<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Lessons')}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="flex-1 overflow-y-auto pt-16 p-4 md:p-8 bg-background">
    <div class="max-w-3xl mx-auto space-y-6">
        <a th:href="@{/teacher/dashboard}" class="inline-flex items-center gap-1 text-sm font-semibold text-primary hover:underline no-underline">
            <span class="material-symbols-outlined text-lg">arrow_back</span> Dashboard
        </a>
        <h1 class="text-2xl font-extrabold font-headline text-on-background" th:text="'Lessons — ' + course.courseCode">Lessons</h1>

        <div th:if="${success}" class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-800 border border-emerald-100" th:text="${success}"></div>

        <div class="bg-surface-container-lowest rounded-xl border border-slate-100 p-6 shadow-sm mb-6">
            <h2 class="text-sm font-bold font-headline text-on-background mb-4">Add section</h2>
            <form th:action="@{/teacher/courses/{id}/sections/add(id=${course.id})}" method="post" class="flex flex-wrap gap-3 items-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Section title</label>
                    <input type="text" name="sectionTitle" placeholder="e.g. Section 2 — Lab" required class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                </div>
                <button type="submit" class="px-4 py-2 bg-slate-800 text-white text-sm font-bold rounded-lg border-0 cursor-pointer">Add section</button>
            </form>
        </div>

        <div class="bg-surface-container-lowest rounded-xl border border-slate-100 p-6 shadow-sm">
            <h2 class="text-sm font-bold font-headline text-on-background mb-4">Add New Lesson</h2>
            <form th:action="@{/teacher/courses/{id}/lessons/add(id=${course.id})}" method="post" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div th:if="${sections != null and !sections.isEmpty()}">
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Section</label>
                    <select name="sectionId" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2 bg-white">
                        <option th:each="s : ${sections}" th:value="${s.id}" th:text="${s.title}"></option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Lesson Title</label>
                    <input type="text" name="lessonTitle" placeholder="Title..." required class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Content</label>
                    <textarea name="lessonContent" placeholder="Lesson content..." rows="6" required class="w-full rounded-lg border-slate-200 text-sm px-3 py-2"></textarea>
                </div>
                <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Video URL (optional)</label>
                        <input type="url" name="videoUrl" placeholder="https://..." class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Duration (minutes)</label>
                        <input type="number" name="durationMinutes" value="45" min="1" required class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                    </div>
                </div>
                <button type="submit" class="px-4 py-2 bg-primary text-on-primary text-sm font-bold rounded-lg border-0 cursor-pointer">Add Lesson</button>
            </form>
        </div>

        <div class="flex flex-col gap-2" th:if="${!lessons.isEmpty()}">
            <div class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 bg-surface-container-lowest flex-wrap" th:each="l : ${lessons}">
                <div class="w-9 h-9 rounded-lg flex items-center justify-center text-xs font-bold bg-primary-container/25 text-primary" th:text="${l.lessonOrder}">1</div>
                <div class="flex-1 min-w-0">
                    <div class="font-semibold text-sm text-on-surface" th:text="${l.lessonTitle}"></div>
                    <div class="text-[11px] text-slate-500" th:text="${l.durationMinutes} + ' min'"></div>
                </div>
                <div class="flex gap-2">
                    <a th:href="@{/lessons/{id}(id=${l.id}, courseId=${course.id})}" class="px-3 py-1.5 text-xs font-bold border border-primary text-primary rounded-lg hover:bg-primary/5 no-underline">View</a>
                    <form th:action="@{/teacher/lessons/{id}/delete(id=${l.id})}" method="post" class="inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="courseId" th:value="${course.id}">
                        <button type="submit" class="px-3 py-1.5 text-xs font-bold bg-red-50 text-red-700 rounded-lg border-0 cursor-pointer"
                                onclick="return confirm('Delete this lesson?')">Delete</button>
                    </form>
                </div>
            </div>
        </div>
        <div th:if="${lessons.isEmpty()}" class="text-center py-12 text-on-surface-variant rounded-xl border border-dashed border-slate-200">No lessons yet.</div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
