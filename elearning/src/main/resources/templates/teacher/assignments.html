<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Assignments')}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="flex-1 overflow-y-auto pt-16 p-4 md:p-8 bg-background">
    <div class="max-w-3xl mx-auto space-y-6">
        <a th:href="@{/teacher/dashboard}" class="inline-flex items-center gap-1 text-sm font-semibold text-primary hover:underline no-underline">
            <span class="material-symbols-outlined text-lg">arrow_back</span> Dashboard
        </a>
        <h1 class="text-2xl font-extrabold font-headline text-on-background" th:text="'Assignments — ' + ${course.courseCode}">Assignments</h1>

        <div th:if="${success}" class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-800 border border-emerald-100" th:text="${success}"></div>

        <div class="bg-surface-container-lowest rounded-xl border border-slate-100 p-6 shadow-sm">
            <h2 class="text-sm font-bold font-headline text-on-background mb-4">Add Assignment / Quiz</h2>
            <form th:action="@{/teacher/courses/{id}/assignments/add(id=${course.id})}" method="post" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Title</label>
                    <input type="text" name="title" placeholder="Assignment title..." required class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Description</label>
                    <textarea name="description" placeholder="Requirements..." rows="3" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2"></textarea>
                </div>
                <div class="grid sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Type</label>
                        <select name="type" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2 bg-white">
                            <option value="HOMEWORK">Homework</option>
                            <option value="QUIZ">Quiz</option>
                            <option value="EXAM">Exam</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Due Date</label>
                        <input type="date" name="dueDate" required class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Max Score</label>
                        <input type="number" name="maxScore" value="10" min="1" step="0.5" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                    </div>
                </div>
                <button type="submit" class="px-4 py-2 bg-primary text-on-primary text-sm font-bold rounded-lg border-0 cursor-pointer">Add Assignment</button>
            </form>
        </div>

        <div th:if="${assignments.isEmpty()}" class="text-center py-12 text-on-surface-variant rounded-xl border border-dashed border-slate-200">No assignments yet.</div>
        <div th:unless="${assignments.isEmpty()}" class="it-table-wrap">
            <table class="it-data-table">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Due Date</th>
                    <th>Score</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${assignments}">
                    <td th:text="${a.title}"></td>
                    <td><span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100" th:text="${a.type}"></span></td>
                    <td th:text="${#temporals.format(a.dueDate, 'MM/dd/yyyy')}"></td>
                    <td th:text="${a.maxScore}"></td>
                    <td><a th:href="@{/assignments/{id}/submissions(id=${a.id})}" class="text-xs font-bold text-primary no-underline hover:underline">View Submissions</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
