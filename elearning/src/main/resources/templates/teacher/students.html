<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Students')}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="flex-1 overflow-y-auto pt-16 p-4 md:p-8 bg-background">
    <div class="max-w-5xl mx-auto space-y-6">
        <a th:href="@{/teacher/dashboard}" class="inline-flex items-center gap-1 text-sm font-semibold text-primary hover:underline no-underline">
            <span class="material-symbols-outlined text-lg">arrow_back</span> Back to Dashboard
        </a>

        <div th:if="${success}" class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-800 border border-emerald-100" th:text="${success}"></div>
        <div th:if="${error}" class="rounded-lg px-4 py-3 text-sm bg-red-50 text-red-800 border border-red-100" th:text="${error}"></div>

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-extrabold font-headline text-on-background" th:text="'Students — ' + ${course.courseName}">Students</h1>
                <p class="text-sm text-on-surface-variant mt-1" th:text="${course.courseCode + ' · ' + enrollments.size() + ' enrolled'}"></p>
            </div>
            <a th:href="@{/courses/{id}(id=${course.id})}" class="px-4 py-2 text-xs font-bold border border-primary text-primary rounded-lg hover:bg-primary/5 no-underline">View Course</a>
        </div>

        <div class="it-table-wrap">
            <table class="it-data-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Student</th>
                    <th>Email</th>
                    <th>Enrolled At</th>
                    <th>Progress</th>
                    <th>XP</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${enrollments.isEmpty()}">
                    <td colspan="6" class="text-center text-slate-400 py-12">No students enrolled yet.</td>
                </tr>
                <tr th:each="e, stat : ${enrollments}">
                    <td th:text="${stat.count}"></td>
                    <td class="font-semibold" th:text="${e.student.fullName}"></td>
                    <td class="text-sm text-on-surface-variant" th:text="${e.student.email}"></td>
                    <td class="text-sm text-slate-500" th:text="${#temporals.format(e.enrolledAt, 'MM/dd/yyyy')}"></td>
                    <td>
                        <div class="flex items-center gap-2 min-w-[140px]">
                            <div class="flex-1 h-2 rounded-full bg-surface-container overflow-hidden">
                                <div class="h-full rounded-full bg-gradient-to-r from-primary to-primary-container" th:style="'width:' + ${e.progressPercentage} + '%'"></div>
                            </div>
                            <span class="text-xs text-on-surface-variant whitespace-nowrap" th:text="${e.progressPercentage} + '%'"></span>
                        </div>
                    </td>
                    <td><span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800" th:text="${e.totalXp} + ' XP'"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
