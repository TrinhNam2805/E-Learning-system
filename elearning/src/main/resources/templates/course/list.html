<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Courses')}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>

<!--
  One page = one layout: do not define a fragment in the same file and then insert it,
  because the fragment definition node can still render one extra time (duplicate content / nested scrolling).
  Students: sidebar + main; others: main only.
-->
<th:block th:if="${currentUser != null and currentUser.role.name() == 'STUDENT'}">
    <div class="flex flex-1 overflow-x-hidden pt-16 min-h-0 w-full">
        <aside th:replace="~{fragments/layout :: studentSidebar('courses')}"></aside>
        <main class="flex-1 min-w-0 bg-background p-4 sm:p-6 md:p-8">
            <div th:replace="~{fragments/course-list-inner :: inner}"></div>
        </main>
    </div>
</th:block>
<th:block th:if="${currentUser == null or currentUser.role.name() != 'STUDENT'}">
    <main class="flex-1 min-w-0 pt-16 bg-background p-4 sm:p-6 md:p-8">
        <div th:replace="~{fragments/course-list-inner :: inner}"></div>
    </main>
</th:block>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
