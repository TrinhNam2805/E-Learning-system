<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${course.courseName})}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<div class="flex flex-1 overflow-hidden pt-16 min-h-0">
    <aside th:if="${currentUser != null and currentUser.role.name() == 'STUDENT' and hideStudentSidebar != true}"
           th:replace="~{fragments/layout :: studentSidebar('courses')}"></aside>
    <main class="flex-1 overflow-y-auto bg-background p-4 md:p-8">
        <div class="max-w-5xl mx-auto space-y-8">
            <a th:href="@{/courses}" class="inline-flex items-center gap-1 text-sm font-semibold text-primary hover:underline no-underline">
                <span class="material-symbols-outlined text-lg">arrow_back</span> Back to Courses
            </a>

            <div th:if="${success}" class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-800 border border-emerald-100" th:text="${success}"></div>
            <div th:if="${error}" class="rounded-lg px-4 py-3 text-sm bg-red-50 text-red-800 border border-red-100" th:text="${error}"></div>

            <div class="grid md:grid-cols-[1fr_320px] gap-6 items-start">
                <div class="rounded-xl overflow-hidden border border-slate-200 shadow-sm bg-surface-container-lowest udemy-course-hero">
                    <div class="aspect-video bg-[#1c1d1f] relative">
                        <iframe th:if="${previewVideoEmbedUrl != null}"
                                class="absolute inset-0 w-full h-full border-0"
                                th:src="${previewVideoEmbedUrl}"
                                title="Course preview"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                allowfullscreen></iframe>
                        <img th:unless="${previewVideoEmbedUrl != null}" th:src="${course.thumbnail}" th:alt="${course.courseName}" class="w-full h-full object-cover" onerror="this.src='/images/e-learning.jpg'">
                    </div>
                    <div class="p-6">
                        <div class="flex flex-wrap gap-2 mb-3">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-primary-container/25 text-primary" th:text="${course.courseCode}"></span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-700 text-white" th:text="${course.status}"></span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-on-surface" th:text="${course.semester}"></span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-50 text-amber-800" th:if="${course.enrollPassword != null and !course.enrollPassword.trim().isEmpty()}">&#128274; Password</span>
                        </div>
                        <h1 class="text-2xl font-extrabold font-headline text-on-background" th:text="${course.courseName}"></h1>
                        <p class="text-sm text-on-surface-variant mt-2 leading-relaxed" th:text="${course.description}"></p>
                        <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-4 text-sm text-on-surface-variant">
                            <span th:if="${course.teacher != null}" class="flex items-center gap-1">
                                <span class="material-symbols-outlined text-lg text-slate-500">person</span>
                                <span th:text="${course.teacher.fullName}"></span>
                            </span>
                            <span class="text-slate-300">|</span>
                            <span th:text="${totalLectures} + ' bài giảng'"></span>
                            <span class="text-slate-300">|</span>
                            <span th:text="'Tổng ' + ${courseDurationLabel}"></span>
                            <span class="text-slate-300">|</span>
                            <span th:text="'Tối đa ' + ${course.maxStudents} + ' SV'"></span>
                        </div>
                    </div>
                </div>
                <div class="bg-surface-container-lowest rounded-xl border border-slate-100 p-5 shadow-sm">
                    <h2 class="text-sm font-bold font-headline text-on-background mb-4">Enrollment</h2>
                    <th:block th:if="${currentUser == null}">
                        <a class="block w-full text-center py-3 rounded-lg bg-primary text-on-primary font-bold text-sm no-underline hover:opacity-90"
                           th:href="@{/login(redirect=${'/courses/' + course.id})}">Enroll</a>
                    </th:block>
                    <th:block th:if="${currentUser != null}">
                        <div th:if="${enrolled == true}" class="text-center py-3 rounded-lg bg-emerald-100 text-emerald-800 font-bold text-sm">&#10003; Enrolled</div>
                        <form th:unless="${enrolled == true}" th:action="@{/courses/{id}/enroll(id=${course.id})}" method="post" class="space-y-3">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div th:if="${course.enrollPassword != null and !course.enrollPassword.trim().isEmpty()}">
                                <label class="block text-xs font-semibold text-on-surface-variant mb-1">Course password</label>
                                <div class="password-field">
                                    <input type="password" name="enrollPassword" placeholder="Enrollment password" autocomplete="off" required class="w-full rounded-lg border-slate-200 text-sm">
                                    <button th:replace="~{fragments/password-toggle-button :: toggleBtn}"></button>
                                </div>
                            </div>
                            <button type="submit" class="w-full py-3 rounded-lg bg-primary text-on-primary font-bold text-sm border-0 cursor-pointer hover:opacity-90">Enroll</button>
                        </form>
                    </th:block>
                </div>
            </div>

            <section class="udemy-curriculum-wrap">
                <h2 class="text-xl font-bold font-headline text-on-background mb-1">Nội dung khóa học</h2>
                <p class="text-sm text-on-surface-variant mb-4">
                    <span th:text="${totalLectures}"></span> bài giảng
                    <span th:if="${totalCourseMinutes > 0}" th:text="' · Tổng ' + ${courseDurationLabel}"></span>
                </p>
                <div class="border border-slate-200 rounded-lg overflow-hidden bg-white" th:if="${!lessons.isEmpty()}">
                    <th:block th:each="sec, secStat : ${curriculumSections}">
                        <details class="udemy-curriculum-section group border-b border-slate-200 last:border-b-0" th:open="${secStat.first}">
                            <summary class="flex cursor-pointer list-none items-center justify-between gap-3 px-4 py-3 bg-slate-50 hover:bg-slate-100 font-semibold text-sm text-on-surface [&::-webkit-details-marker]:hidden">
                                <span class="flex items-center gap-2 min-w-0">
                                    <span class="material-symbols-outlined text-slate-500 shrink-0 udemy-acc-icon-expand text-lg">expand_more</span>
                                    <span class="truncate" th:text="${sec.title}">Section</span>
                                </span>
                                <span class="text-xs font-normal text-slate-500 shrink-0" th:text="${sec.lessons.size()} + ' bài · ' + ${sec.sectionMinutesTotal} + ' phút'"></span>
                            </summary>
                            <div class="divide-y divide-slate-100">
                                <a class="udemy-lecture-row flex items-start gap-3 px-4 py-2.5 pl-11 hover:bg-slate-50/80 transition-colors no-underline text-inherit"
                                   th:each="l : ${sec.lessons}"
                                   th:href="${enrolled == true} ? @{/lessons/{id}(id=${l.id}, courseId=${course.id})} : '#'"
                                   th:classappend="${enrolled != true} ? ' opacity-60 pointer-events-none' : ''">
                                    <span class="material-symbols-outlined text-lg shrink-0 mt-0.5"
                                          th:classappend="${l.videoUrl != null and !l.videoUrl.isEmpty()} ? ' text-slate-500' : ' text-slate-400'"
                                          th:text="${l.videoUrl != null and !l.videoUrl.isEmpty()} ? 'play_circle' : 'article'">play_circle</span>
                                    <div class="flex-1 min-w-0">
                                        <div class="text-sm font-medium text-on-surface leading-snug" th:text="${l.lessonTitle}"></div>
                                    </div>
                                    <div class="flex items-center gap-2 shrink-0 text-xs text-slate-500">
                                        <span th:if="${completedLessonIds != null and completedLessonIds.contains(l.id)}" class="text-emerald-600 font-semibold">Đã xem</span>
                                        <span th:text="${l.durationMinutes} + ' phút'"></span>
                                        <span th:if="${enrolled == true}" class="text-primary">▶</span>
                                        <span th:if="${enrolled != true}">&#128274;</span>
                                    </div>
                                </a>
                            </div>
                        </details>
                    </th:block>
                </div>
                <div th:if="${lessons.isEmpty()}" class="text-center py-12 text-on-surface-variant rounded-xl border border-dashed border-slate-200">Chưa có bài giảng.</div>
            </section>

            <section th:if="${enrolled == true and !assignments.isEmpty()}">
                <h2 class="text-lg font-bold font-headline text-on-background mb-4">Assignments &amp; Quizzes</h2>
                <div class="it-table-wrap">
                    <table class="it-data-table">
                        <thead>
                        <tr>
                            <th>Title</th>
                            <th>Type</th>
                            <th>Due Date</th>
                            <th>Max Score</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="a : ${assignments}">
                            <td th:text="${a.title}"></td>
                            <td><span class="inline-block px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-100" th:text="${a.type}"></span></td>
                            <td>
                                <span th:if="${a.dueDate != null}" th:text="${#temporals.format(a.dueDate, 'MM/dd/yyyy')}"></span>
                                <span th:if="${a.dueDate == null}">—</span>
                            </td>
                            <td th:text="${a.maxScore}"></td>
                            <td><a th:href="@{/assignments/{id}(id=${a.id})}" class="text-xs font-bold text-primary no-underline hover:underline">Start</a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section>
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                    <h2 class="text-lg font-bold font-headline text-on-background">Discussion Forum</h2>
                    <a th:if="${enrolled == true}" th:href="@{/forum(courseId=${course.id})}"
                       class="text-xs font-bold text-primary hover:underline no-underline">Open Forum →</a>
                </div>
                <div th:if="${recentPosts == null or recentPosts.isEmpty()}" class="text-center py-8 text-on-surface-variant rounded-xl border border-dashed border-slate-200 text-sm">No posts yet.</div>
                <div th:each="p : ${recentPosts}" class="bg-surface-container-low rounded-xl border border-slate-100 p-4 mb-2">
                    <div class="flex flex-wrap items-center gap-2 mb-1">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-primary/10 text-primary" th:text="${p.postType}"></span>
                        <span class="font-semibold text-on-surface text-sm" th:text="${p.title}"></span>
                    </div>
                    <div class="text-xs text-on-surface-variant">
                        <span th:text="${p.author != null ? p.author.fullName : 'Unknown'}"></span>
                        <span th:if="${p.createdAt != null}" th:text="${' · ' + #temporals.format(p.createdAt, 'MM/dd/yyyy')}"></span>
                        <span th:text="${' · ' + p.viewCount + ' views'}"></span>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
