<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${course.courseName})}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<div class="flex flex-1 overflow-x-hidden pt-16 min-h-0">
    <aside th:if="${currentUser != null and currentUser.role.name() == 'STUDENT'}"
           th:replace="~{fragments/layout :: studentSidebar('courses')}"></aside>
    <main class="flex-1 min-w-0 bg-background p-4 md:p-8">
        <div class="max-w-5xl mx-auto space-y-8">
            <a th:href="@{/courses}" class="inline-flex items-center gap-1 text-sm font-semibold text-primary hover:underline no-underline">
                <span class="material-symbols-outlined text-lg">arrow_back</span> Back to Courses
            </a>

            <div th:if="${success}" class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-800 border border-emerald-100" th:text="${success}"></div>
            <div th:if="${error}" class="rounded-lg px-4 py-3 text-sm bg-red-50 text-red-800 border border-red-100" th:text="${error}"></div>

            <div class="grid md:grid-cols-[1fr_320px] gap-6 items-start">
                <div class="rounded-xl overflow-hidden border border-slate-100 shadow-sm bg-surface-container-lowest">
                    <div class="aspect-video md:aspect-[21/9] bg-surface-container">
                        <img th:src="${course.thumbnail}" th:alt="${course.courseName}" class="w-full h-full object-cover" onerror="this.src='/images/e-learning.jpg'">
                    </div>
                    <div class="p-6">
                        <div class="flex flex-wrap gap-2 mb-3">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-primary-container/25 text-primary" th:text="${course.courseCode}"></span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-700 text-white" th:text="${course.status}"></span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-on-surface" th:text="${course.semester}"></span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-50 text-amber-800" th:if="${course.enrollPassword != null and !course.enrollPassword.trim().isEmpty()}">&#128274; Password</span>
                        </div>
                        <h1 class="text-2xl font-extrabold font-headline text-on-background" th:text="${course.courseName}"></h1>
                        <p class="text-sm text-on-surface-variant mt-3 leading-relaxed" th:text="${course.description}"></p>
                        <p class="text-xs text-slate-500 mt-3" th:text="${(course.teacher != null ? course.teacher.fullName : '') + ' | Max ' + course.maxStudents + ' students'}"></p>
                    </div>
                </div>
                <div class="bg-surface-container-lowest rounded-xl border border-slate-100 p-5 shadow-sm">
                    <h2 class="text-sm font-bold font-headline text-on-background mb-4">Enrollment</h2>
                    <th:block th:if="${currentUser == null}">
                        <a class="block w-full text-center py-3 rounded-lg bg-primary text-on-primary font-bold text-sm no-underline hover:opacity-90"
                           th:href="@{/login(redirect=${'/courses/' + course.id})}">Enroll</a>
                    </th:block>
                    <th:block th:if="${currentUser != null}">
                        <div th:if="${enrolled == true}" class="text-center py-3 rounded-lg bg-emerald-100 text-emerald-800 font-bold text-sm">&#10003; Enrolled</div>
                        <form th:unless="${enrolled == true}" th:action="@{/courses/{id}/enroll(id=${course.id})}" method="post" class="space-y-3">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div th:if="${course.enrollPassword != null and !course.enrollPassword.trim().isEmpty()}">
                                <label class="block text-xs font-semibold text-on-surface-variant mb-1">Course password</label>
                                <div class="password-field">
                                    <input type="password" name="enrollPassword" placeholder="Enrollment password" autocomplete="off" required class="w-full rounded-lg border-slate-200 text-sm">
                                    <button th:replace="~{fragments/password-toggle-button :: toggleBtn}"></button>
                                </div>
                            </div>
                            <button type="submit" class="w-full py-3 rounded-lg bg-primary text-on-primary font-bold text-sm border-0 cursor-pointer hover:opacity-90">Enroll</button>
                        </form>
                    </th:block>
                </div>
            </div>

            <section>
                <h2 class="text-lg font-bold font-headline text-on-background mb-4">Lessons (<span th:text="${lessons.size()}"></span>)</h2>
                <div class="flex flex-col gap-2" th:if="${!lessons.isEmpty()}">
                    <th:block th:each="l : ${lessons}" th:with="access=${lessonAccessMap != null ? lessonAccessMap.get(l.id) : null}">
                        <a th:if="${enrolled == true and (access == null or access.accessible)}"
                           class="lesson-item flex items-center gap-3 p-3 rounded-xl border border-slate-100 bg-surface-container-lowest hover:border-primary-container/40 transition-colors no-underline text-inherit"
                           th:href="@{/lessons/{id}(id=${l.id}, courseId=${course.id})}">
                            <div class="lesson-num w-9 h-9 rounded-lg flex items-center justify-center text-xs font-bold shrink-0"
                                 th:style="${completedLessonIds != null and completedLessonIds.contains(l.id)} ? 'background:#22c55e;color:#fff;' : 'background:#e3e7ff;color:#005baf;'"
                                 th:text="${completedLessonIds != null and completedLessonIds.contains(l.id)} ? 'OK' : ${l.lessonOrder}">1</div>
                            <div class="lesson-info flex-1 min-w-0">
                                <div class="lesson-title font-semibold text-on-surface text-sm" th:text="${l.lessonTitle}"></div>
                                <div class="lesson-meta text-[11px] text-slate-500" th:text="${l.durationMinutes} + ' min'"></div>
                            </div>
                            <span class="text-slate-400 text-sm">Open</span>
                        </a>
                        <div th:unless="${enrolled == true and (access == null or access.accessible)}"
                             class="lesson-item flex items-center gap-3 p-3 rounded-xl border border-slate-100 bg-surface-container-lowest opacity-60">
                            <div class="lesson-num w-9 h-9 rounded-lg flex items-center justify-center text-xs font-bold shrink-0"
                                 th:style="${completedLessonIds != null and completedLessonIds.contains(l.id)} ? 'background:#22c55e;color:#fff;' : 'background:#e3e7ff;color:#005baf;'"
                                 th:text="${completedLessonIds != null and completedLessonIds.contains(l.id)} ? 'OK' : ${l.lessonOrder}">1</div>
                            <div class="lesson-info flex-1 min-w-0">
                                <div class="lesson-title font-semibold text-on-surface text-sm" th:text="${l.lessonTitle}"></div>
                                <div class="lesson-meta text-[11px] text-slate-500" th:text="${l.durationMinutes} + ' min'"></div>
                                <div th:if="${access != null and !access.accessible}" class="text-[11px] text-amber-700 mt-1" th:text="${access.lockedReason}"></div>
                            </div>
                            <span class="text-slate-400 text-sm">Locked</span>
                        </div>
                    </th:block>
                </div>
                <div th:if="${lessons.isEmpty()}" class="text-center py-12 text-on-surface-variant rounded-xl border border-dashed border-slate-200">No lessons available yet.</div>
            </section>

            <section th:if="${enrolled == true and !assignments.isEmpty()}">
                <h2 class="text-lg font-bold font-headline text-on-background mb-4">Assignments and quizzes</h2>
                <div class="it-table-wrap">
                    <table class="it-data-table">
                        <thead>
                        <tr>
                            <th>Title</th>
                            <th>Type</th>
                            <th>Due date</th>
                            <th>Max score</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="a : ${assignments}">
                            <td th:text="${a.title}"></td>
                            <td><span class="inline-block px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-100" th:text="${a.type.name() == 'QUIZ' ? 'Quiz' : (a.type.name() == 'EXAM' ? 'Exam' : 'Assignment')}"></span></td>
                            <td>
                                <span th:if="${a.dueDate != null}" th:text="${#temporals.format(a.dueDate, 'MM/dd/yyyy')}"></span>
                                <span th:if="${a.dueDate == null}">N/A</span>
                            </td>
                            <td th:text="${a.maxScore}"></td>
                            <td><a th:href="@{/assignments/{id}(id=${a.id})}" class="text-xs font-bold text-primary no-underline hover:underline">Open assignment</a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section>
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                    <h2 class="text-lg font-bold font-headline text-on-background">Discussion Forum</h2>
                    <a th:if="${enrolled == true}" th:href="@{/forum(courseId=${course.id})}"
                       class="text-xs font-bold text-primary hover:underline no-underline">Open Forum</a>
                </div>
                <div th:if="${recentPosts == null or recentPosts.isEmpty()}" class="text-center py-8 text-on-surface-variant rounded-xl border border-dashed border-slate-200 text-sm">No posts yet.</div>
                <div th:each="p : ${recentPosts}" class="bg-surface-container-low rounded-xl border border-slate-100 p-4 mb-2">
                    <div class="flex flex-wrap items-center gap-2 mb-1">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-primary/10 text-primary" th:text="${p.postType}"></span>
                        <span class="font-semibold text-on-surface text-sm" th:text="${p.title}"></span>
                    </div>
                    <div class="text-xs text-on-surface-variant">
                        <span th:text="${p.author != null ? p.author.fullName : 'Unknown'}"></span>
                        <span th:if="${p.createdAt != null}" th:text="${' | ' + #temporals.format(p.createdAt, 'MM/dd/yyyy')}"></span>
                        <span th:text="${' | ' + p.viewCount + ' views'}"></span>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
