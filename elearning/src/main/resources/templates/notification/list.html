<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page section-stack">
        <div class="page-header">
            <div class="page-header-copy">
                <h2>Notification Center</h2>
                <p>Review academic updates, grading events, badges, comments, and system activity in one place.</p>
            </div>
            <form th:action="@{/notifications/mark-all-read}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline btn-sm">&#10003; Mark all as read</button>
            </form>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div th:if="${notifications.isEmpty()}" class="section-card">
            <div class="empty-state">
                <div class="empty-state-icon">&#128276;</div>
                <h3>No notifications</h3>
                <p>When assignments, grades, comments, or badges update, they will appear here.</p>
            </div>
        </div>

        <div class="section-stack" th:unless="${notifications.isEmpty()}">
            <div th:each="n : ${notifications}" class="post-item" style="display:flex; gap:1rem; align-items:flex-start;">
                <div class="empty-state-icon" style="width:52px; height:52px; border-radius:16px; flex-shrink:0; background:#f8fafc;">
                    <span th:if="${n.type.name() == 'GRADE'}">&#128202;</span>
                    <span th:if="${n.type.name() == 'ASSIGNMENT'}">&#128221;</span>
                    <span th:if="${n.type.name() == 'BADGE'}">&#127885;</span>
                    <span th:if="${n.type.name() == 'COMMENT'}">&#128172;</span>
                    <span th:if="${n.type.name() == 'ANNOUNCEMENT'}">&#128226;</span>
                    <span th:if="${n.type.name() == 'SYSTEM'}">&#9881;</span>
                </div>
                <div class="stack-sm" style="flex:1; min-width:0;">
                    <div class="button-row" style="justify-content:space-between; align-items:flex-start; gap:.75rem;">
                        <div>
                            <div class="heading-sm" th:text="${n.title}"></div>
                            <div class="text-muted mt-1" th:text="${n.message}"></div>
                        </div>
                        <span th:unless="${n.isRead}" class="badge badge-primary">New</span>
                    </div>
                    <div class="button-row text-soft" style="font-size:.82rem; justify-content:space-between;">
                        <span class="badge badge-gray" th:text="${n.type}"></span>
                        <span th:text="${#temporals.format(n.createdAt, 'MM/dd/yyyy HH:mm')}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
