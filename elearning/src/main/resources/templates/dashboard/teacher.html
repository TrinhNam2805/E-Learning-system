<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Teacher Dashboard')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page section-stack">
        <div class="page-header">
            <div class="page-header-copy">
                <h2 th:text="'Teacher Dashboard - ' + ${currentUser.fullName}">Dashboard</h2>
                <p>Manage your courses, lessons, assignments, and student progress from a single workspace.</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><span class="stat-num" th:text="${myCourses.size()}">0</span><span class="stat-label">My courses</span></div>
            <div class="stat-card"><span class="stat-num" th:text="${totalStudents}">0</span><span class="stat-label">Total students</span></div>
            <div class="stat-card"><span class="stat-num" th:text="${totalLessons}">0</span><span class="stat-label">Total lessons</span></div>
        </div>

        <div class="section-card">
            <div class="section-heading">
                <div>
                    <h3>Managed Courses</h3>
                    <p>Open the tools you need without leaving the overview.</p>
                </div>
            </div>
            <div class="table-wrap responsive-cards">
                <table>
                    <thead>
                    <tr><th>Code</th><th>Course Name</th><th>Semester</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${myCourses}">
                        <td data-label="Code"><span class="badge" th:text="${c.courseCode}"></span></td>
                        <td data-label="Course Name"><strong th:text="${c.courseName}"></strong></td>
                        <td data-label="Semester" th:text="${c.semester}"></td>
                        <td data-label="Status"><span class="badge" th:classappend="${c.status.name() == 'PUBLISHED'} ? 'badge-green' : 'badge-gray'" th:text="${c.status}"></span></td>
                        <td data-label="Actions" class="actions-cell">
                            <div class="button-row">
                                <a th:href="@{/courses/{id}(id=${c.id})}" class="btn btn-outline btn-sm">View</a>
                                <a th:href="@{/teacher/courses/{id}/lessons(id=${c.id})}" class="btn btn-outline btn-sm">Lessons</a>
                                <a th:href="@{/teacher/courses/{id}/assignments(id=${c.id})}" class="btn btn-outline btn-sm">Assignments</a>
                                <a th:href="@{/teacher/courses/{id}/students(id=${c.id})}" class="btn btn-outline btn-sm">Students</a>
                                <a th:href="@{/forum(courseId=${c.id})}" class="btn btn-outline btn-sm">Forum</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
