<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rankings')}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<div class="flex flex-1 overflow-hidden pt-16 min-h-0">
    <aside th:if="${currentUser != null and currentUser.role.name() == 'STUDENT'}"
           th:replace="~{fragments/layout :: studentSidebar('rankings')}"></aside>
    <main class="flex-1 overflow-y-auto bg-background p-6 md:p-8">
        <div class="max-w-3xl mx-auto space-y-8">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold font-headline text-on-background">XP Leaderboard</h1>
                <p class="text-sm text-on-surface-variant mt-1">Top scholars by total XP.</p>
            </div>

            <div th:if="${myRank != null}" class="rounded-xl p-6 bg-gradient-to-br from-primary to-primary-dim text-on-primary shadow-lg">
                <div class="flex flex-wrap items-center gap-4">
                    <div class="text-4xl">
                        <span th:if="${myRank.rank == 1}">&#129351;</span>
                        <span th:if="${myRank.rank == 2}">&#129352;</span>
                        <span th:if="${myRank.rank == 3}">&#129353;</span>
                        <span th:if="${myRank.rank > 3}" th:text="'#' + ${myRank.rank}"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-lg" th:text="${myRank.fullName} + ' (you)'"></div>
                        <div class="text-sm opacity-90" th:text="${'Level ' + myRank.level + ' · ' + myRank.totalXp + ' XP'}"></div>
                        <div class="mt-3">
                            <div class="text-[11px] opacity-80 mb-1"
                                 th:text="${myRank.xpInLevel} + '/100 XP to Level ' + (${myRank.level} + 1)"></div>
                            <div class="h-2 rounded-full bg-white/30 overflow-hidden">
                                <div class="h-full rounded-full bg-amber-400 transition-all" th:style="'width:' + ${myRank.xpInLevel} + '%'"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <section class="bg-surface-container-lowest rounded-xl border border-slate-100 shadow-sm overflow-hidden">
                <div class="px-5 py-4 border-b border-slate-100 font-bold text-on-background text-sm font-headline">Top Students</div>
                <div class="divide-y divide-slate-50">
                    <div th:each="r, stat : ${rankings}"
                         class="flex items-center gap-4 px-5 py-4 transition-colors"
                         th:classappend="${currentUser != null and r.userId == currentUser.id} ? ' bg-primary/5' : ' hover:bg-surface-container-low/80'">
                        <div class="w-10 text-center shrink-0 text-xl">
                            <span th:if="${stat.index == 0}">&#129351;</span>
                            <span th:if="${stat.index == 1}">&#129352;</span>
                            <span th:if="${stat.index == 2}">&#129353;</span>
                            <span th:if="${stat.index >= 3}" class="text-sm font-black text-on-surface-variant" th:text="${r.rank}"></span>
                        </div>
                        <div class="h-10 w-10 rounded-full bg-primary-container/25 flex items-center justify-center text-sm font-bold text-primary shrink-0 border border-slate-100"
                             th:text="${#strings.toUpperCase(#strings.substring(r.fullName, 0, 1))}">A</div>
                        <div class="flex-1 min-w-0">
                            <div class="font-semibold text-on-surface text-sm"
                                 th:text="${r.fullName} + (${currentUser != null and r.userId == currentUser.id} ? ' (you)' : '')"></div>
                            <div class="text-xs text-on-surface-variant" th:text="'Level ' + ${r.level}"></div>
                        </div>
                        <div class="text-right shrink-0 w-28">
                            <div class="text-xs font-bold text-on-surface" th:text="${r.totalXp} + ' XP'"></div>
                            <div class="w-full h-1.5 bg-surface-container rounded-full mt-1 overflow-hidden">
                                <div class="h-full rounded-full bg-amber-400" th:style="'width:' + ${r.xpInLevel} + '%'"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
