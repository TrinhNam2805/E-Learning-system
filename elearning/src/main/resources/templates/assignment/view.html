<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${assignment.title})}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="page-scroll-main flex-1 pt-16 p-4 md:p-8 bg-background">
    <div class="max-w-3xl mx-auto space-y-6">
        <a th:href="@{/courses/{id}(id=${assignment.course.id})}" class="inline-flex items-center gap-1 text-sm font-semibold text-primary hover:underline no-underline">
            <span class="material-symbols-outlined text-lg">arrow_back</span> Back to Course
        </a>

        <div th:if="${success}" class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-800 border border-emerald-100" th:text="${success}"></div>
        <div th:if="${error}" class="rounded-lg px-4 py-3 text-sm bg-red-50 text-red-800 border border-red-100" th:text="${error}"></div>

        <div class="bg-surface-container-lowest rounded-xl border border-slate-100 p-6 shadow-sm">
            <div class="flex flex-wrap gap-2 mb-3">
                <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-primary-container/25 text-primary" th:text="${assignment.course.courseCode}"></span>
                <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-700 text-white" th:text="${assignment.type}"></span>
            </div>
            <h1 class="text-xl font-bold font-headline text-on-background" th:text="${assignment.title}"></h1>
            <div class="text-sm text-on-surface-variant mt-2">
                <span th:if="${assignment.dueDate != null}"
                      th:text="${'Due: ' + #temporals.format(assignment.dueDate, 'MM/dd/yyyy HH:mm') + ' Â· Max Score: ' + assignment.maxScore}"></span>
                <span th:if="${assignment.dueDate == null}" th:text="${'No due date Â· Max Score: ' + assignment.maxScore}"></span>
            </div>
            <div th:if="${pastDue != null and pastDue}" class="mt-4 rounded-lg px-4 py-3 text-sm bg-red-50 text-red-800 border border-red-100">
                The due date has passed. To submit, check "Late submission" below.
            </div>
            <div th:if="${assignment.description != null}" class="mt-4 text-sm text-on-surface leading-relaxed whitespace-pre-wrap" th:text="${assignment.description}"></div>
        </div>

        <div th:if="${mySubmission != null}" class="rounded-xl border border-emerald-200 bg-emerald-50/80 p-5">
            <div class="font-bold text-emerald-800 mb-2">âœ“ Submitted</div>
            <div th:if="${mySubmission.status != null and mySubmission.status.name() == 'LATE'}" class="text-sm text-amber-800 mb-2">Late submission</div>
            <div class="text-sm text-on-surface" th:if="${mySubmission.score != null}"
                 th:text="${'Score: ' + mySubmission.score + '/' + assignment.maxScore}"></div>
            <div class="text-sm text-on-surface-variant" th:if="${mySubmission.score == null}">Awaiting grading...</div>
            <div th:if="${mySubmission.feedback != null}" class="mt-3 text-sm text-on-surface">
                <strong>Feedback:</strong> <span th:text="${mySubmission.feedback}"></span>
            </div>
            <div class="text-xs text-slate-500 mt-2" th:text="'Submitted at: ' + ${#temporals.format(mySubmission.submittedAt, 'MM/dd/yyyy HH:mm')}"></div>
        </div>

        <div th:if="${mySubmission == null and assignment.type.name() == 'QUIZ' and !questions.isEmpty()}">
            <h3 class="text-sm font-bold font-headline text-on-background mb-4">Take Quiz</h3>
            <form th:action="@{/assignments/{id}/submit(id=${assignment.id})}" method="post" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label th:if="${pastDue != null and pastDue}" class="flex items-center gap-2 text-sm text-on-surface">
                    <input type="checkbox" name="confirmLate" value="true" class="rounded border-slate-300">
                    <span>I confirm this is a late submission</span>
                </label>
                <div th:each="q, stat : ${questions}" class="bg-surface-container-lowest rounded-xl border border-slate-100 p-5">
                    <div class="font-semibold text-on-background text-sm mb-3" th:text="${(stat.index + 1) + '. ' + q.questionText}"></div>
                    <div class="flex flex-col gap-2">
                        <label th:each="opt : ${ {'A','B','C','D'} }" class="flex items-center gap-2 cursor-pointer text-sm text-on-surface">
                            <input type="radio" th:name="'q_' + ${q.id}" th:value="${opt}" required class="text-primary">
                            <span th:switch="${opt}">
                                <span th:case="'A'" th:text="'A. ' + ${q.optionA}"></span>
                                <span th:case="'B'" th:text="'B. ' + ${q.optionB}"></span>
                                <span th:case="'C'" th:text="'C. ' + ${q.optionC}"></span>
                                <span th:case="'D'" th:text="'D. ' + ${q.optionD}"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <button type="submit" class="px-6 py-3 bg-primary text-on-primary font-bold text-sm rounded-lg border-0 cursor-pointer hover:opacity-90">Submit Quiz</button>
            </form>
        </div>

        <div th:if="${mySubmission == null and assignment.type.name() != 'QUIZ'}">
            <h3 class="text-sm font-bold font-headline text-on-background mb-4">Submit Assignment</h3>
            <form th:action="@{/assignments/{id}/submit(id=${assignment.id})}" method="post" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label th:if="${pastDue != null and pastDue}" class="flex items-center gap-2 text-sm text-on-surface">
                    <input type="checkbox" name="confirmLate" value="true" class="rounded border-slate-300">
                    <span>I confirm this is a late submission</span>
                </label>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Your Answer</label>
                    <textarea name="content" placeholder="Enter your answer here..." rows="10" required class="w-full rounded-lg border-slate-200 text-sm px-3 py-2"></textarea>
                </div>
                <button type="submit" class="px-6 py-3 bg-primary text-on-primary font-bold text-sm rounded-lg border-0 cursor-pointer hover:opacity-90">Submit</button>
            </form>
        </div>

        <div th:if="${mySubmission == null and assignment.type.name() == 'QUIZ' and questions.isEmpty()}"
             class="rounded-lg px-4 py-3 text-sm bg-blue-50 text-blue-900 border border-blue-100">
            This quiz has no questions yet. Please contact support.
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
