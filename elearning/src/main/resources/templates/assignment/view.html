<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${assignment.title})}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page">
        <a class="back-link" th:href="@{/courses/{id}(id=${assignment.course.id})}">← Back to Course</a>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div style="background:#fff; border:1px solid #e0e7ef; border-radius:12px; padding:1.5rem; margin-bottom:1.5rem;">
            <div class="badge-row">
                <span class="badge" th:text="${assignment.course.courseCode}"></span>
                <span class="badge badge-dark" th:text="${assignment.type}"></span>
            </div>
            <h2 style="color:#0a3d7a; margin:.5rem 0;" th:text="${assignment.title}"></h2>
            <div style="font-size:.88rem; color:#888; margin-bottom:.75rem;"
                 th:text="'Due: ' + ${#temporals.format(assignment.dueDate, 'MM/dd/yyyy HH:mm')} + ' · Max Score: ' + ${assignment.maxScore}"></div>
            <div th:if="${assignment.description != null}"
                 style="font-size:.93rem; color:#333; line-height:1.7; white-space:pre-wrap;" th:text="${assignment.description}"></div>
        </div>

        <!-- Already submitted -->
        <div th:if="${mySubmission != null}" style="background:#f0fff4; border:1px solid #b7ebc8; border-radius:10px; padding:1.25rem; margin-bottom:1.5rem;">
            <div style="font-weight:700; color:#1a7f37; margin-bottom:.5rem;">✓ Submitted</div>
            <div style="font-size:.9rem; color:#333;" th:if="${mySubmission.score != null}"
                 th:text="'Score: ' + ${mySubmission.score} + '/' + ${assignment.maxScore}"></div>
            <div style="font-size:.9rem; color:#666;" th:if="${mySubmission.score == null}">Awaiting grading...</div>
            <div th:if="${mySubmission.feedback != null}"
                 style="margin-top:.5rem; font-size:.9rem; color:#333;">
                <strong>Feedback:</strong> <span th:text="${mySubmission.feedback}"></span>
            </div>
            <div style="font-size:.8rem; color:#aaa; margin-top:.35rem;"
                 th:text="'Submitted at: ' + ${#temporals.format(mySubmission.submittedAt, 'MM/dd/yyyy HH:mm')}"></div>
        </div>

        <!-- Quiz form -->
        <div th:if="${mySubmission == null and assignment.type.name() == 'QUIZ' and !questions.isEmpty()}">
            <h3 style="font-size:1rem; color:#0a3d7a; margin-bottom:1rem;">Take Quiz</h3>
            <form th:action="@{/assignments/{id}/submit(id=${assignment.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div th:each="q, stat : ${questions}"
                     style="background:#fff; border:1px solid #e0e7ef; border-radius:10px; padding:1.25rem; margin-bottom:1rem;">
                    <div style="font-weight:600; color:#0a3d7a; margin-bottom:.75rem;"
                         th:text="${stat.index + 1} + '. ' + ${q.questionText}"></div>
                    <div style="display:flex; flex-direction:column; gap:.5rem;">
                        <label th:each="opt : ${ {'A','B','C','D'} }" style="display:flex; align-items:center; gap:.5rem; cursor:pointer; margin-top:0;">
                            <input type="radio" th:name="'q_' + ${q.id}" th:value="${opt}" required>
                            <span th:switch="${opt}">
                                <span th:case="'A'" th:text="'A. ' + ${q.optionA}"></span>
                                <span th:case="'B'" th:text="'B. ' + ${q.optionB}"></span>
                                <span th:case="'C'" th:text="'C. ' + ${q.optionC}"></span>
                                <span th:case="'D'" th:text="'D. ' + ${q.optionD}"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <button type="submit" class="btn" style="padding:.75rem 2rem;">Submit Quiz</button>
            </form>
        </div>

        <!-- Homework/Exam form -->
        <div th:if="${mySubmission == null and assignment.type.name() != 'QUIZ'}">
            <h3 style="font-size:1rem; color:#0a3d7a; margin-bottom:.75rem;">Submit Assignment</h3>
            <form th:action="@{/assignments/{id}/submit(id=${assignment.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label style="margin-top:0;">Your Answer</label>
                <textarea name="content" placeholder="Enter your answer here..." style="min-height:200px;" required></textarea>
                <button type="submit" class="btn" style="width:auto; margin-top:.75rem; padding:.75rem 2rem;">Submit</button>
            </form>
        </div>

        <!-- No questions for quiz -->
        <div th:if="${mySubmission == null and assignment.type.name() == 'QUIZ' and questions.isEmpty()}"
             class="alert alert-info">This quiz has no questions yet. Please contact your teacher.</div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
