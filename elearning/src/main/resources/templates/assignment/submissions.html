<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Submissions')}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="flex-1 overflow-y-auto pt-16 p-4 md:p-8 bg-background">
    <div class="max-w-4xl mx-auto space-y-6">
        <a th:href="@{/teacher/courses/{id}/assignments(id=${assignment.course.id})}" class="inline-flex items-center gap-1 text-sm font-semibold text-primary hover:underline no-underline">
            <span class="material-symbols-outlined text-lg">arrow_back</span> Back to Assignments
        </a>
        <h1 class="text-2xl font-extrabold font-headline text-on-background" th:text="'Submissions – ' + ${assignment.title}">Submissions</h1>

        <div th:if="${success}" class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-800 border border-emerald-100" th:text="${success}"></div>

        <div th:if="${submissions.isEmpty()}" class="text-center py-12 text-on-surface-variant rounded-xl border border-dashed border-slate-200">No submissions yet.</div>

        <div th:each="s : ${submissions}" class="bg-surface-container-lowest rounded-xl border border-slate-100 p-5 shadow-sm">
            <div class="flex flex-wrap justify-between items-start gap-3 mb-4">
                <div>
                    <div class="font-bold text-on-background" th:text="${s.student.fullName}"></div>
                    <div class="text-sm text-on-surface-variant" th:text="${s.student.email}"></div>
                    <div class="text-xs text-slate-400 mt-1" th:text="'Submitted: ' + ${#temporals.format(s.submittedAt, 'MM/dd/yyyy HH:mm')}"></div>
                </div>
                <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase"
                      th:classappend="${s.status.name() == 'GRADED'} ? ' bg-emerald-100 text-emerald-800' : ' bg-slate-100 text-on-surface'"
                      th:text="${s.status}"></span>
            </div>

            <div th:if="${s.content != null}" class="bg-surface-container-low rounded-lg p-3 text-sm text-on-surface whitespace-pre-wrap mb-4 border border-slate-100" th:text="${s.content}"></div>

            <form th:action="@{/assignments/grade/{id}(id=${s.id})}" method="post" class="flex flex-wrap gap-4 items-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div>
                    <label class="block text-[11px] font-semibold text-on-surface-variant mb-1">Score (max <span th:text="${assignment.maxScore}"></span>)</label>
                    <input type="number" name="score" th:value="${s.score}" min="0" th:max="${assignment.maxScore}" step="0.5" class="w-28 rounded-lg border-slate-200 text-sm px-3 py-2">
                </div>
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-[11px] font-semibold text-on-surface-variant mb-1">Feedback</label>
                    <input type="text" name="feedback" th:value="${s.feedback}" placeholder="Feedback..." class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                </div>
                <button type="submit" class="px-4 py-2 bg-emerald-600 text-white text-sm font-bold rounded-lg border-0 cursor-pointer hover:opacity-90">Grade</button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
