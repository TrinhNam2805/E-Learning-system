<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Submissions')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page section-stack">
        <a class="back-link" th:href="@{/teacher/courses/{id}/assignments(id=${assignment.course.id})}">&larr; Back to Assignments</a>

        <div class="page-header">
            <div class="page-header-copy">
                <h2 th:text="'Submissions - ' + ${assignment.title}">Submissions</h2>
                <p>Review submissions, assign scores, and leave feedback from the same screen.</p>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div th:if="${submissions.isEmpty()}" class="empty-state"><p>No submissions yet.</p></div>

        <div th:each="s : ${submissions}" class="section-card">
            <div class="section-toolbar mb-1">
                <div class="stack-sm">
                    <div class="heading-sm" th:text="${s.student.fullName}"></div>
                    <div class="text-muted" th:text="${s.student.email}"></div>
                    <div class="text-soft" th:text="'Submitted: ' + ${#temporals.format(s.submittedAt, 'MM/dd/yyyy HH:mm')}"></div>
                </div>
                <span class="badge" th:classappend="${s.status.name() == 'GRADED'} ? 'badge-green' : 'badge-gray'" th:text="${s.status}"></span>
            </div>

            <div th:if="${s.content != null}" class="surface-card mb-1" style="white-space:pre-wrap;" th:text="${s.content}"></div>

            <form th:action="@{/assignments/grade/{id}(id=${s.id})}" method="post" class="form-grid responsive-inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-col-3">
                    <label class="mt-0">Score (max <span th:text="${assignment.maxScore}"></span>)</label>
                    <input type="number" name="score" th:value="${s.score}" min="0" th:max="${assignment.maxScore}" step="0.5">
                </div>
                <div class="form-col-9">
                    <label class="mt-0">Feedback</label>
                    <input type="text" name="feedback" th:value="${s.feedback}" placeholder="Feedback">
                </div>
                <div class="form-col-12">
                    <button type="submit" class="btn btn-sm btn-success">Grade</button>
                </div>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
