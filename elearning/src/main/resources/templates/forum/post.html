<!DOCTYPE html>
<html class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${post.title})}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="flex-1 overflow-y-auto pt-16 p-4 md:p-8 bg-background">
    <div class="max-w-3xl mx-auto space-y-6">
        <a th:if="${post.course != null}" th:href="@{/forum(courseId=${post.course.id})}" class="inline-flex items-center gap-1 text-sm font-semibold text-primary hover:underline no-underline">
            <span class="material-symbols-outlined text-lg">arrow_back</span> Về diễn đàn môn
        </a>
        <a th:unless="${post.course != null}" th:href="@{/forum}" class="inline-flex items-center gap-1 text-sm font-semibold text-primary hover:underline no-underline">
            <span class="material-symbols-outlined text-lg">arrow_back</span> Diễn đàn chung
        </a>
        <div th:if="${success}" class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-800 border border-emerald-100" th:text="${success}"></div>
        <div th:if="${error}" class="rounded-lg px-4 py-3 text-sm bg-red-50 text-red-800 border border-red-100" th:text="${error}"></div>

        <article class="bg-surface-container-lowest rounded-xl border border-slate-100 p-6 shadow-sm">
            <div class="flex flex-wrap gap-2 mb-4">
                <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-primary/10 text-primary" th:text="${post.postType}"></span>
                <span th:if="${post.course != null}" class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-700 text-white" th:text="${post.course.courseCode}"></span>
                <span th:if="${post.lesson != null}" class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-200 text-slate-800" th:text="'Bài: ' + ${post.lesson.lessonTitle}"></span>
            </div>
            <h1 class="text-xl font-bold font-headline text-on-background mb-4" th:text="${post.title}"></h1>
            <div class="text-sm text-on-surface leading-relaxed whitespace-pre-wrap" th:text="${post.content}"></div>
            <div class="mt-6 pt-4 border-t border-slate-100 text-xs text-on-surface-variant"
                 th:text="${(post.author != null ? post.author.fullName : '') + ' · ' + #temporals.format(post.createdAt, 'dd/MM/yyyy HH:mm') + ' · ' + post.viewCount + ' lượt xem'}"></div>
            <div th:if="${post.lesson != null and post.course != null}" class="mt-4">
                <a th:href="@{/lessons/{lid}(lid=${post.lesson.id}, courseId=${post.course.id})}"
                   class="inline-flex items-center gap-1 text-xs font-bold text-primary hover:underline no-underline">
                    <span class="material-symbols-outlined text-base">school</span> Mở bài học liên quan
                </a>
            </div>
        </article>

        <div>
            <h2 class="text-sm font-bold font-headline text-on-background mb-4" th:text="'Bình luận (' + ${comments.size()} + ')'">Comments</h2>
            <div th:if="${comments.isEmpty()}" class="text-sm text-slate-400 mb-4">Chưa có bình luận.</div>
            <div th:each="c : ${comments}" class="bg-surface-container-lowest rounded-xl border border-slate-100 p-4 mb-3">
                <div class="flex items-center gap-3 mb-2">
                    <div class="h-8 w-8 rounded-full bg-primary-container/25 flex items-center justify-center text-xs font-bold text-primary"
                         th:text="${#strings.toUpperCase(#strings.substring(c.author.fullName, 0, 1))}">A</div>
                    <div>
                        <div class="font-semibold text-sm text-on-surface" th:text="${c.author.fullName}"></div>
                        <div class="text-[11px] text-slate-400" th:text="${#temporals.format(c.createdAt, 'dd/MM/yyyy HH:mm')}"></div>
                    </div>
                </div>
                <div class="text-sm text-on-surface leading-relaxed whitespace-pre-wrap pl-11" th:text="${c.content}"></div>
            </div>
        </div>

        <div th:if="${canComment}" class="bg-surface-container-lowest rounded-xl border border-slate-100 p-5">
            <h3 class="text-sm font-bold font-headline text-on-background mb-4">Thêm bình luận</h3>
            <form th:action="@{/forum/comment}" method="post" class="space-y-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="postId" th:value="${post.id}">
                <textarea name="content" placeholder="Viết bình luận..." required rows="4" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2"></textarea>
                <button type="submit" class="px-4 py-2 bg-primary text-on-primary text-sm font-bold rounded-lg border-0 cursor-pointer">Gửi</button>
            </form>
        </div>
        <p th:if="${!canComment and post.course != null}" class="text-sm text-on-surface-variant rounded-lg px-4 py-3 bg-slate-50 border border-slate-100">
            Đăng ký khóa học để bình luận trong diễn đàn này.
        </p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
