<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forum')}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="flex-1 overflow-y-auto pt-16 p-4 md:p-8">
    <div class="max-w-3xl mx-auto space-y-6">
        <a th:href="@{/courses/{id}(id=${course.id})}" class="inline-flex items-center gap-1 text-sm font-semibold text-primary hover:underline no-underline">
            <span class="material-symbols-outlined text-lg">arrow_back</span> Back to Course
        </a>

        <div th:if="${success}" class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-800 border border-emerald-100" th:text="${success}"></div>
        <div th:if="${error}" class="rounded-lg px-4 py-3 text-sm bg-red-50 text-red-800 border border-red-100" th:text="${error}"></div>

        <div>
            <h1 class="text-2xl font-extrabold font-headline text-on-background" th:text="'Forum — ' + ${course.courseName}">Forum</h1>
            <p class="text-sm text-on-surface-variant mt-1">Course discussion</p>
        </div>

        <div th:if="${canPost}" class="bg-surface-container-lowest rounded-xl border border-slate-100 p-5 shadow-sm">
            <h3 class="text-sm font-bold font-headline text-on-background mb-4">Create New Post</h3>
            <form th:action="@{/forum/create}" method="post" class="space-y-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="courseId" th:value="${course.id}">
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Title</label>
                    <input type="text" name="title" required class="w-full rounded-lg border-slate-200 text-sm" placeholder="Post title...">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Post Type</label>
                    <select name="postType" class="w-full rounded-lg border-slate-200 text-sm bg-white">
                        <option value="QUESTION">Question</option>
                        <option value="DISCUSSION">Discussion</option>
                        <option value="ANNOUNCEMENT" th:if="${currentUser.role.name() != 'STUDENT'}">Announcement</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Content</label>
                    <textarea name="content" required rows="5" class="w-full rounded-lg border-slate-200 text-sm" placeholder="Post content..."></textarea>
                </div>
                <button type="submit" class="px-4 py-2 bg-primary text-on-primary text-sm font-bold rounded-lg border-0 cursor-pointer">Post</button>
            </form>
        </div>
        <div th:unless="${canPost}" class="rounded-lg px-4 py-3 text-sm bg-blue-50 text-blue-900 border border-blue-100">
            Enroll in this course to participate in the forum.
        </div>

        <div th:if="${posts.isEmpty()}" class="text-center py-12 text-on-surface-variant rounded-xl border border-dashed border-slate-200">No posts yet. Be the first to post!</div>
        <div th:each="p : ${posts}"
             class="bg-surface-container-low rounded-xl border border-slate-100 p-4 cursor-pointer hover:border-primary-container/40 transition-colors"
             th:onclick="'window.location.href=\'' + @{/forum/post/{id}(id=${p.id})} + '\''">
            <div class="flex flex-wrap items-start gap-2 mb-2">
                <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-primary/10 text-primary" th:text="${p.postType}"></span>
                <span class="font-semibold text-on-surface text-sm flex-1" th:text="${p.title}"></span>
            </div>
            <div class="text-xs text-on-surface-variant"
                 th:text="${(p.author != null ? p.author.fullName : '') + ' · ' + #temporals.format(p.createdAt, 'MM/dd/yyyy') + ' · ' + p.viewCount + ' views'}"></div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
