<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${lesson.lessonTitle})}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<div class="flex flex-1 overflow-hidden pt-16 min-h-0">
    <aside th:if="${currentUser != null and currentUser.role.name() == 'STUDENT'}"
           th:replace="~{fragments/layout :: studentSidebar('other')}"></aside>
    <main class="flex-1 overflow-y-auto bg-background p-4 md:p-8">
        <div class="max-w-6xl mx-auto space-y-4">
            <a th:href="@{/courses/{id}(id=${course.id})}" class="inline-flex items-center gap-1 text-sm font-semibold text-primary hover:underline no-underline">
                <span class="material-symbols-outlined text-lg">arrow_back</span> Back to Course
            </a>
            <div th:if="${success}" class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-800 border border-emerald-100" th:text="${success}"></div>
            <div th:if="${error}" class="rounded-lg px-4 py-3 text-sm bg-red-50 text-red-800 border border-red-100" th:text="${error}"></div>

            <div class="grid grid-cols-1 lg:grid-cols-[1fr_280px] gap-6 items-start">
                <div class="space-y-6 min-w-0">
                    <div class="bg-surface-container-lowest rounded-xl border border-slate-100 shadow-sm overflow-hidden">
                        <div class="p-5 md:p-6 border-b border-slate-100">
                            <div class="flex flex-wrap gap-2 mb-3">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-primary-container/25 text-primary" th:text="${course.courseCode}"></span>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-700 text-white" th:text="${course.courseName}"></span>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-on-surface"
                                      th:text="${'Lesson ' + lesson.lessonOrder + '/' + allLessons.size()}"></span>
                            </div>
                            <h1 class="text-xl md:text-2xl font-bold font-headline text-on-background" th:text="${lesson.lessonTitle}"></h1>
                            <p class="text-sm text-on-surface-variant mt-2 flex items-center gap-1">
                                <span class="material-symbols-outlined text-base">schedule</span>
                                <span th:text="${lesson.durationMinutes} + ' min'"></span>
                            </p>
                        </div>
                        <div class="p-5 md:p-6 lesson-view-body">
                            <div class="lesson-content-box lesson-content-html prose-lesson max-w-none" th:utext="${lesson.lessonContent}"></div>
                        </div>
                        <div class="p-4 md:p-6 border-t border-slate-100 bg-surface-container-low/30 flex flex-wrap gap-3 items-center">
                            <a th:if="${prev != null}" th:href="@{/lessons/{id}(id=${prev.id}, courseId=${course.id})}"
                               class="px-3 py-2 text-xs font-bold border border-slate-200 rounded-lg text-on-surface hover:bg-white no-underline">&larr; Previous</a>
                            <div class="flex-1 min-w-[1rem]"></div>
                            <span th:if="${isCompleted}" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-100 text-emerald-800">&#10003; Completed</span>
                            <form th:unless="${isCompleted}" th:action="@{/lessons/{id}/complete(id=${lesson.id})}" method="post" class="inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="courseId" th:value="${course.id}">
                                <button type="submit" class="px-4 py-2 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700 border-0 cursor-pointer">&#10003; Mark Complete</button>
                            </form>
                            <a th:if="${next != null}" th:href="@{/lessons/{id}(id=${next.id}, courseId=${course.id})}"
                               class="px-4 py-2 rounded-lg text-sm font-bold bg-primary text-on-primary no-underline hover:opacity-90">Next &rarr;</a>
                        </div>
                    </div>

                    <div class="bg-surface-container-lowest rounded-xl border border-slate-100 p-5 shadow-sm">
                        <div class="flex justify-between items-center gap-3 mb-4">
                            <h3 class="text-sm font-bold font-headline text-on-background flex items-center gap-2">
                                <span class="material-symbols-outlined text-primary text-xl">sticky_note_2</span> Lesson Notes
                            </h3>
                            <button type="button" onclick="document.getElementById('note-form').classList.toggle('hidden')"
                                    class="px-3 py-1.5 text-xs font-bold border border-primary text-primary rounded-lg hover:bg-primary/5">+ Add Note</button>
                        </div>

                        <div id="note-form" class="hidden mb-4 p-4 rounded-xl bg-surface-container-low border border-slate-100">
                            <form th:action="@{/notes/save}" method="post" class="space-y-3">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="lessonId" th:value="${lesson.id}">
                                <input type="hidden" name="courseId" th:value="${course.id}">
                                <input type="hidden" name="noteType" value="LESSON">
                                <div>
                                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Title (optional)</label>
                                    <input type="text" name="title" placeholder="e.g. Key definitions" class="w-full rounded-lg border-slate-200 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Tags</label>
                                    <input type="text" name="tags" placeholder="e.g. big-o, sorting" class="w-full rounded-lg border-slate-200 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Source excerpt (optional)</label>
                                    <textarea name="sourceExcerpt" rows="2" class="w-full rounded-lg border-slate-200 text-sm" placeholder="Quote from lesson..."></textarea>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Note Content</label>
                                    <textarea name="content" required rows="4" class="w-full rounded-lg border-slate-200 text-sm" placeholder="Your summary..."></textarea>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Link to another note</label>
                                    <select name="linkToNoteId" class="w-full rounded-lg border-slate-200 text-sm bg-white">
                                        <option value="">— None —</option>
                                        <option th:each="cn : ${noteLinkCandidates}" th:value="${cn.id}"
                                                th:text="${(cn.title != null and !cn.title.isEmpty() ? cn.title : 'Note') + ' · ' + #temporals.format(cn.createdAt, 'MM/dd')}"></option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Relation label</label>
                                    <input type="text" name="linkLabel" placeholder="e.g. builds on" class="w-full rounded-lg border-slate-200 text-sm">
                                </div>
                                <div class="flex flex-wrap items-end gap-4">
                                    <div>
                                        <span class="block text-xs font-semibold text-on-surface-variant mb-2">Highlight Color</span>
                                        <div class="flex gap-2">
                                            <label th:each="color : ${ {'#FFFF00','#90EE90','#FFB6C1','#87CEEB','#FFA500'} }" class="cursor-pointer">
                                                <input type="radio" name="highlightColor" th:value="${color}" th:checked="${color == '#FFFF00'}" class="hidden">
                                                <span th:style="'display:inline-block; width:24px; height:24px; border-radius:50%; background:' + ${color} + '; border:2px solid #ccc;'"></span>
                                            </label>
                                        </div>
                                    </div>
                                    <button type="submit" class="px-4 py-2 bg-primary text-on-primary text-sm font-bold rounded-lg border-0 cursor-pointer">Save Note</button>
                                </div>
                            </form>
                        </div>

                        <div th:if="${lessonNotes.isEmpty()}" class="text-center text-sm text-slate-400 py-6">No notes for this lesson yet.</div>
                        <div th:each="n : ${lessonNotes}"
                             th:id="${'note-' + n.id}"
                             class="note-item lesson-note-card rounded-lg border border-slate-100 bg-white mb-3"
                             th:style="'border-left:3px solid ' + ${n.highlightColor}">
                            <div class="flex justify-between gap-3 p-3">
                                <a th:href="@{/notes/{id}/open-lesson(id=${n.id})}" class="lesson-note-hit flex-1 min-w-0 no-underline text-inherit">
                                    <span class="lesson-note-jump-hint">Open in lesson →</span>
                                    <div th:if="${n.title != null and !n.title.trim().isEmpty()}" class="font-semibold text-on-surface text-sm mt-1" th:text="${n.title}"></div>
                                    <div th:if="${n.sourceExcerpt != null and !n.sourceExcerpt.isEmpty()}" class="text-xs text-slate-600 italic mt-2 whitespace-pre-wrap" th:text="'“' + ${n.sourceExcerpt} + '”'"></div>
                                    <div th:if="${n.tags != null and !n.tags.isEmpty()}" class="text-[11px] text-slate-500 mt-2" th:text="${n.tags}"></div>
                                    <div class="text-sm text-on-surface mt-2 whitespace-pre-wrap" th:text="${n.content}"></div>
                                    <div class="text-[11px] text-slate-400 mt-2" th:text="${#temporals.format(n.createdAt, 'MM/dd/yyyy HH:mm')}"></div>
                                </a>
                                <div class="flex flex-col items-end gap-2 shrink-0">
                                    <a th:href="@{/notes/{id}(id=${n.id})}" class="text-[11px] font-semibold text-primary no-underline">Detail</a>
                                    <form th:action="@{/notes/{id}/delete(id=${n.id})}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="text-xs px-2 py-1 rounded bg-red-50 text-red-700 border-0 cursor-pointer"
                                                onclick="return confirm('Delete this note?')">×</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <aside class="lg:sticky lg:top-20 space-y-4">
                    <div class="bg-surface-container-lowest rounded-xl border border-slate-100 p-4 shadow-sm">
                        <div class="text-sm font-bold font-headline text-on-background mb-3">Course Lessons</div>
                        <div class="lesson-list flex flex-col gap-1 max-h-[70vh] overflow-y-auto pr-1">
                            <a class="lesson-item flex items-center gap-3 p-2.5 rounded-lg border border-transparent hover:bg-surface-container-low transition-colors no-underline text-inherit"
                               th:each="l : ${allLessons}"
                               th:href="@{/lessons/{id}(id=${l.id}, courseId=${course.id})}"
                               th:classappend="${l.id == lesson.id} ? ' bg-primary/10 border-primary/30' : ''">
                                <div class="lesson-num w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold shrink-0"
                                     th:style="${completedLessonIds != null and completedLessonIds.contains(l.id)} ? 'background:#22c55e;color:#fff;' : 'background:#e3e7ff;color:#005baf;'"
                                     th:text="${completedLessonIds != null and completedLessonIds.contains(l.id)} ? '✓' : ${l.lessonOrder}">1</div>
                                <div class="lesson-info min-w-0 flex-1">
                                    <div class="lesson-title text-sm font-semibold truncate"
                                         th:classappend="${l.id == lesson.id} ? ' text-primary' : ' text-on-surface'"
                                         th:text="${l.lessonTitle}"></div>
                                    <div class="lesson-meta text-[11px] text-slate-500" th:text="${l.durationMinutes} + ' min'"></div>
                                </div>
                                <span class="lesson-arrow text-slate-400 text-sm" th:text="${l.id == lesson.id} ? '▶' : '→'"></span>
                            </a>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:if="${scrollToNoteId != null}" th:inline="javascript">
    (function () {
        var el = document.getElementById('note-' + [[${scrollToNoteId}]]);
        if (el) {
            el.scrollIntoView({behavior: 'smooth', block: 'center'});
            el.classList.add('lesson-note-flash');
            setTimeout(function () { el.classList.remove('lesson-note-flash'); }, 2200);
        }
    })();
</script>
</body>
</html>
