<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot Password')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Forgot Password</h2>
            <p style="color:#666; font-size:.93rem; margin-bottom:1rem;">
                Enter the email you registered with. If it matches an active account, we will send a reset link
                (or log the link in the server console when email is not configured).
            </p>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <form th:action="@{/forgot-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required autofocus>
                <button type="submit" class="btn btn-full" style="margin-top:1rem;">Send reset link</button>
            </form>

            <div class="auth-links">
                <a th:href="@{/login}">&larr; Back to Login</a>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
