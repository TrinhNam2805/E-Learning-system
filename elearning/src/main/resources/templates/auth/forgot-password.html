<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot Password')}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="flex-1 flex items-center justify-center px-4 py-12 pt-24">
    <div class="w-full max-w-md bg-surface-container-lowest rounded-2xl border border-slate-100 shadow-lg p-8">
        <h2 class="text-xl font-extrabold font-headline text-on-background text-center mb-2">Forgot Password</h2>
        <p class="text-sm text-on-surface-variant text-center mb-6">
            Enter the email you registered with. If it matches an active account, we will send a reset link
            (or log the link in the server console when email is not configured).
        </p>

        <div th:if="${error}" class="rounded-lg px-4 py-3 text-sm bg-red-50 text-red-800 border border-red-100 mb-4" th:text="${error}"></div>
        <div th:if="${success}" class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-800 border border-emerald-100 mb-4" th:text="${success}"></div>

        <form th:action="@{/forgot-password}" method="post" class="space-y-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div>
                <label class="block text-xs font-semibold text-on-surface-variant mb-1">Email</label>
                <input type="email" name="email" placeholder="you@example.com" required autofocus class="w-full rounded-lg border-slate-200 text-sm px-3 py-2.5 bg-white">
            </div>
            <button type="submit" class="w-full py-3 rounded-lg bg-primary text-on-primary font-bold text-sm border-0 cursor-pointer hover:opacity-90">Send reset link</button>
        </form>

        <div class="mt-6 text-center">
            <a th:href="@{/login}" class="text-sm font-semibold text-primary no-underline hover:underline">← Back to Login</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
