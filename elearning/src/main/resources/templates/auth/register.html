<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-card-header">
                <div class="eyebrow">Get started</div>
                <h2>Create your learning account</h2>
                <p>Set up a secure account to access courses, assignments, notes, and progress tracking.</p>
            </div>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <form th:action="@{/register}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="redirect" th:if="${redirectAfterLogin != null}" th:value="${redirectAfterLogin}">
                <label>Full Name</label>
                <input type="text" name="fullName" placeholder="John Doe" required autofocus>
                <label>Email</label>
                <input type="email" name="email" placeholder="example@email.com" required>
                <label>Password</label>
                <p class="helper">Use at least 8 characters, including uppercase, lowercase, a digit, and a special character.</p>
                <div class="password-field">
                    <input type="password" name="password" placeholder="Create a strong password" required autocomplete="new-password">
                    <button th:replace="~{fragments/password-toggle-button :: toggleBtn}"></button>
                </div>
                <label>Confirm Password</label>
                <div class="password-field">
                    <input type="password" name="confirm" placeholder="Re-enter password" required autocomplete="new-password">
                    <button th:replace="~{fragments/password-toggle-button :: toggleBtn}"></button>
                </div>
                <button type="submit" class="btn btn-full mt-1">Register</button>
            </form>

            <div class="auth-links">
                Already have an account?
                <a th:if="${redirectAfterLogin == null}" th:href="@{/login}">Login</a>
                <a th:if="${redirectAfterLogin != null}" th:href="@{/login(redirect=${redirectAfterLogin})}">Login</a>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
