<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Create Account</h2>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <form th:action="@{/register}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>Full Name</label>
                <input type="text" name="fullName" placeholder="John Doe" required autofocus>
                <label>Email</label>
                <input type="email" name="email" placeholder="example@email.com" required>
                <label>Password</label>
                <input type="password" name="password" placeholder="At least 6 characters" required>
                <label>Confirm Password</label>
                <input type="password" name="confirm" placeholder="Re-enter password" required>
                <button type="submit" class="btn btn-full" style="margin-top:1rem;">Register</button>
            </form>

            <div class="auth-links">
                Already have an account? <a th:href="@{/login}">Login</a>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
