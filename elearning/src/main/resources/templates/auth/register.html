<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="flex-1 flex items-center justify-center px-4 py-12 pt-24">
    <div class="w-full max-w-md bg-surface-container-lowest rounded-2xl border border-slate-100 shadow-lg p-8">
        <h2 class="text-xl font-extrabold font-headline text-on-background text-center mb-6">Create Account</h2>

        <div th:if="${error}" class="rounded-lg px-4 py-3 text-sm bg-red-50 text-red-800 border border-red-100 mb-4" th:text="${error}"></div>
        <div th:if="${success}" class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-800 border border-emerald-100 mb-4" th:text="${success}"></div>

        <form th:action="@{/register}" method="post" class="space-y-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="redirect" th:if="${redirectAfterLogin != null}" th:value="${redirectAfterLogin}">
            <div>
                <label class="block text-xs font-semibold text-on-surface-variant mb-1">Full Name</label>
                <input type="text" name="fullName" placeholder="John Doe" required autofocus class="w-full rounded-lg border-slate-200 text-sm px-3 py-2.5 bg-white">
            </div>
            <div>
                <label class="block text-xs font-semibold text-on-surface-variant mb-1">Email</label>
                <input type="email" name="email" placeholder="example@email.com" required class="w-full rounded-lg border-slate-200 text-sm px-3 py-2.5 bg-white">
            </div>
            <div>
                <label class="block text-xs font-semibold text-on-surface-variant mb-1">Password</label>
                <p class="text-[11px] text-on-surface-variant mb-1">At least 8 characters, uppercase, lowercase, a digit, and a special character.</p>
                <div class="password-field">
                    <input type="password" name="password" placeholder="Strong password" required autocomplete="new-password" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2.5 pr-10 bg-white">
                    <button th:replace="~{fragments/password-toggle-button :: toggleBtn}"></button>
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-on-surface-variant mb-1">Confirm Password</label>
                <div class="password-field">
                    <input type="password" name="confirm" placeholder="Re-enter password" required autocomplete="new-password" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2.5 pr-10 bg-white">
                    <button th:replace="~{fragments/password-toggle-button :: toggleBtn}"></button>
                </div>
            </div>
            <button type="submit" class="w-full py-3 rounded-lg bg-primary text-on-primary font-bold text-sm border-0 cursor-pointer hover:opacity-90 mt-2">Register</button>
        </form>

        <div class="mt-6 text-center text-sm text-on-surface-variant">
            Already have an account?
            <a th:if="${redirectAfterLogin == null}" th:href="@{/login}" class="text-primary font-semibold no-underline hover:underline">Login</a>
            <a th:if="${redirectAfterLogin != null}" th:href="@{/login(redirect=${redirectAfterLogin})}" class="text-primary font-semibold no-underline hover:underline">Login</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
