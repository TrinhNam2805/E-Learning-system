<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change Password')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Change Password</h2>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <form th:action="@{/change-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>Current Password</label>
                <input type="password" name="currentPassword" placeholder="••••••••" required autofocus>
                <label>New Password</label>
                <input type="password" name="newPassword" placeholder="At least 6 characters" required>
                <label>Confirm New Password</label>
                <input type="password" name="confirmPassword" placeholder="Re-enter new password" required>
                <button type="submit" class="btn btn-full" style="margin-top:1rem;">Update Password</button>
            </form>

            <div class="auth-links">
                <a th:href="@{/profile}">&larr; Back to Profile</a>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
