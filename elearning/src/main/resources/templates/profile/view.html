<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="flex-1 overflow-y-auto pt-16 p-4 md:p-8 bg-background">
    <div class="max-w-3xl mx-auto space-y-6">
        <h1 class="text-2xl font-extrabold font-headline text-on-background">My Profile</h1>
        <div th:if="${success}" class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-800 border border-emerald-100" th:text="${success}"></div>

        <div class="flex flex-col sm:flex-row gap-4 items-start bg-surface-container-lowest rounded-xl border border-slate-100 p-6 shadow-sm">
            <div class="h-16 w-16 rounded-2xl bg-primary-container/30 flex items-center justify-center text-2xl font-bold text-primary shrink-0"
                 th:text="${#strings.toUpperCase(#strings.substring(currentUser.fullName, 0, 1))}">A</div>
            <div class="min-w-0">
                <h2 class="text-xl font-bold font-headline text-on-background" th:text="${currentUser.fullName}"></h2>
                <p class="text-sm text-on-surface-variant mt-1" th:text="${currentUser.email}"></p>
                <span class="inline-block mt-2 px-2 py-0.5 rounded text-[10px] font-bold bg-slate-700 text-white" th:text="${currentUser.role}"></span>
            </div>
        </div>

        <div class="bg-surface-container-lowest rounded-xl border border-slate-100 p-6 shadow-sm">
            <div class="flex flex-wrap justify-between items-center gap-3 mb-6">
                <h3 class="text-sm font-bold font-headline text-on-background">Personal Information</h3>
                <button type="button" onclick="toggleEdit()" class="px-3 py-1.5 text-xs font-bold border border-primary text-primary rounded-lg hover:bg-primary/5" id="edit-btn">Edit</button>
            </div>

            <div id="view-mode">
                <div class="grid sm:grid-cols-2 gap-4 text-sm">
                    <div><span class="text-[11px] font-semibold text-on-surface-variant uppercase tracking-wide">Full Name</span><span class="block text-on-surface mt-1" th:text="${currentUser.fullName}"></span></div>
                    <div><span class="text-[11px] font-semibold text-on-surface-variant uppercase tracking-wide">Email</span><span class="block text-on-surface mt-1" th:text="${currentUser.email}"></span></div>
                    <div><span class="text-[11px] font-semibold text-on-surface-variant uppercase tracking-wide">Username</span><span class="block text-on-surface mt-1" th:text="${currentUser.username}"></span></div>
                    <div><span class="text-[11px] font-semibold text-on-surface-variant uppercase tracking-wide">Phone</span><span class="block text-on-surface mt-1" th:text="${currentUser.phone != null ? currentUser.phone : '-'}"></span></div>
                    <div><span class="text-[11px] font-semibold text-on-surface-variant uppercase tracking-wide">Role</span><span class="block text-on-surface mt-1" th:text="${currentUser.role}"></span></div>
                    <div><span class="text-[11px] font-semibold text-on-surface-variant uppercase tracking-wide">Joined</span><span class="block text-on-surface mt-1" th:text="${#temporals.format(currentUser.createdAt, 'MM/dd/yyyy')}"></span></div>
                </div>
            </div>

            <div id="edit-mode" class="hidden">
                <form th:action="@{/profile/update}" method="post" class="space-y-4">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="grid sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-on-surface-variant mb-1">Full Name</label>
                            <input type="text" name="fullName" th:value="${currentUser.fullName}" required class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-on-surface-variant mb-1">Phone</label>
                            <input type="tel" name="phone" th:value="${currentUser.phone}" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button type="submit" class="px-4 py-2 bg-primary text-on-primary text-sm font-bold rounded-lg border-0 cursor-pointer">Save Changes</button>
                        <button type="button" onclick="toggleEdit()" class="px-4 py-2 border border-slate-200 text-on-surface text-sm font-bold rounded-lg hover:bg-slate-50">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="flex flex-wrap gap-4">
            <a th:href="@{/change-password}" class="px-4 py-2 text-sm font-bold border border-primary text-primary rounded-lg hover:bg-primary/5 no-underline">Change Password</a>
            <a th:href="@{/dashboard}" class="px-4 py-2 text-sm font-bold border border-slate-200 text-on-surface rounded-lg hover:bg-slate-50 no-underline">Dashboard</a>
            <a th:href="@{/notes}" class="px-4 py-2 text-sm font-bold border border-slate-200 text-on-surface rounded-lg hover:bg-slate-50 no-underline">My Notes</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
function toggleEdit() {
    var view = document.getElementById('view-mode');
    var edit = document.getElementById('edit-mode');
    var btn = document.getElementById('edit-btn');
    var showingEdit = !edit.classList.contains('hidden');
    if (showingEdit) {
        edit.classList.add('hidden');
        view.classList.remove('hidden');
        btn.textContent = 'Edit';
    } else {
        edit.classList.remove('hidden');
        view.classList.add('hidden');
        btn.textContent = 'Cancel';
    }
}
</script>
</body>
</html>
