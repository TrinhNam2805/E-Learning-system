<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Note')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page">
        <a class="back-link" th:href="@{/notes}">&larr; All notes</a>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div th:style="'background:#fff; border:1px solid #e0e7ef; border-radius:12px; padding:1.25rem; margin-bottom:1rem; border-top:4px solid ' + ${note.highlightColor}">
            <div style="font-size:.82rem; color:#888; margin-bottom:.5rem;">
                <span th:if="${note.course != null}" th:text="${note.course.courseCode}"></span>
                <span th:if="${note.lesson != null}"> · <span th:text="${note.lesson.lessonTitle}"></span></span>
                <span th:text="' · ' + ${#temporals.format(note.updatedAt != null ? note.updatedAt : note.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
            </div>
            <h2 style="margin:.25rem 0 .75rem; color:#0a3d7a;" th:text="${note.title != null and !note.title.isEmpty() ? note.title : 'Note'}">Note</h2>
            <div th:if="${note.tags != null and !note.tags.isEmpty()}" style="margin-bottom:.75rem;">
                <span th:each="t : ${#strings.arraySplit(note.tags, ',')}" class="badge badge-gray" style="margin-right:.35rem;"
                      th:text="${#strings.trim(t)}">tag</span>
            </div>
            <div th:if="${note.sourceExcerpt != null and !note.sourceExcerpt.isEmpty()}"
                 style="font-size:.88rem; color:#555; background:#f8fafc; border-left:3px solid #0a66c2; padding:.75rem 1rem; margin-bottom:1rem; white-space:pre-wrap;">
                <strong>Source excerpt:</strong>
                <span th:text="${note.sourceExcerpt}"></span>
            </div>
            <div style="font-size:.95rem; line-height:1.65; white-space:pre-wrap; color:#222;" th:text="${note.content}"></div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem;">
            <div style="background:#fff; border:1px solid #e0e7ef; border-radius:10px; padding:1rem;">
                <h3 style="font-size:.95rem; color:#0a3d7a; margin-bottom:.5rem;">Links to (this → other)</h3>
                <ul style="margin:0; padding-left:1.1rem; font-size:.88rem;">
                    <li th:each="l : ${outgoing}">
                        <a th:href="@{/notes/{id}(id=${l.toNote.id})}" th:text="${l.toNote.title != null ? l.toNote.title : 'Note #' + l.toNote.id}"></a>
                        <span th:if="${l.relationLabel != null}" th:text="' (' + ${l.relationLabel} + ')'"></span>
                    </li>
                    <li th:if="${outgoing.isEmpty()}" style="color:#aaa;">None</li>
                </ul>
            </div>
            <div style="background:#fff; border:1px solid #e0e7ef; border-radius:10px; padding:1rem;">
                <h3 style="font-size:.95rem; color:#0a3d7a; margin-bottom:.5rem;">Linked from (other → this)</h3>
                <ul style="margin:0; padding-left:1.1rem; font-size:.88rem;">
                    <li th:each="l : ${incoming}">
                        <a th:href="@{/notes/{id}(id=${l.fromNote.id})}" th:text="${l.fromNote.title != null ? l.fromNote.title : 'Note #' + l.fromNote.id}"></a>
                    </li>
                    <li th:if="${incoming.isEmpty()}" style="color:#aaa;">None</li>
                </ul>
            </div>
        </div>

        <div style="background:#f8faff; border:1px solid #dce8fb; border-radius:10px; padding:1rem; margin-bottom:1rem;">
            <h3 style="font-size:.95rem; color:#0a3d7a; margin-bottom:.75rem;">Add link to another note</h3>
            <form th:action="@{/notes/{id}/link(id=${note.id})}" method="post" style="display:flex; flex-wrap:wrap; gap:.75rem; align-items:flex-end;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div>
                    <label style="margin-top:0;">Target note</label>
                    <select name="toNoteId" required style="min-width:220px;">
                        <option value="">— Select —</option>
                        <option th:each="c : ${linkCandidates}" th:value="${c.id}"
                                th:text="${(c.title != null and !c.title.isEmpty() ? c.title : 'Note') + ' · ' + #temporals.format(c.createdAt, 'MM/dd')}"></option>
                    </select>
                </div>
                <div>
                    <label style="margin-top:0;">Relation (optional)</label>
                    <input type="text" name="linkLabel" placeholder="e.g. prerequisite, extends" style="min-width:180px;">
                </div>
                <button type="submit" class="btn btn-sm">Link</button>
            </form>
        </div>

        <div style="background:#fff; border:1px solid #e0e7ef; border-radius:10px; padding:1rem;">
            <h3 style="font-size:.95rem; color:#0a3d7a; margin-bottom:.75rem;">Edit</h3>
            <form th:action="@{/notes/{id}/update(id=${note.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>Title</label>
                <input type="text" name="title" th:value="${note.title}">
                <label>Tags (comma-separated)</label>
                <input type="text" name="tags" th:value="${note.tags}" placeholder="e.g. normalization, exam-prep">
                <label>Source excerpt</label>
                <textarea name="sourceExcerpt" rows="3" placeholder="Quote from lesson..." th:text="${note.sourceExcerpt}"></textarea>
                <label>Content</label>
                <textarea name="content" required rows="8" th:text="${note.content}"></textarea>
                <label>Highlight</label>
                <div style="display:flex; gap:.5rem; flex-wrap:wrap;">
                    <label th:each="color : ${ {'#FFFF00','#90EE90','#FFB6C1','#87CEEB','#FFA500'} }">
                        <input type="radio" name="highlightColor" th:value="${color}" th:checked="${note.highlightColor == color}">
                        <span th:style="'display:inline-block;width:20px;height:20px;border-radius:50%;background:' + ${color}"></span>
                    </label>
                </div>
                <button type="submit" class="btn" style="margin-top:.75rem;">Save</button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
