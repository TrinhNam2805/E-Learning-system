<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Notes')}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<div class="flex flex-1 overflow-hidden pt-16 min-h-0">
    <aside th:if="${currentUser != null and currentUser.role.name() == 'STUDENT'}"
           th:replace="~{fragments/layout :: studentSidebar('notes')}"></aside>
    <main class="flex-1 overflow-y-auto bg-background p-6 md:p-8">
        <div class="max-w-5xl mx-auto space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl md:text-3xl font-extrabold font-headline text-on-background">My Notes</h1>
                    <p class="text-sm text-on-surface-variant mt-1">Standalone and lesson notes.</p>
                </div>
                <button type="button" onclick="document.getElementById('new-note-form').classList.toggle('hidden')"
                        class="px-4 py-2 bg-primary text-on-primary text-sm font-bold rounded-lg hover:opacity-90 shadow-sm border-0 cursor-pointer">
                    + New Note
                </button>
            </div>

            <form th:action="@{/notes}" method="get" class="flex flex-wrap gap-2 items-center">
                <input type="search" name="tag" th:value="${filterTag}" placeholder="Filter by tag..."
                       class="rounded-lg border border-slate-200 text-sm max-w-xs px-3 py-2 bg-white">
                <button type="submit" class="px-3 py-2 bg-surface-container-high text-on-surface text-sm font-semibold rounded-lg border border-slate-200 cursor-pointer">Filter</button>
                <a th:href="@{/notes}" class="text-xs font-bold text-primary hover:underline" th:if="${filterTag != null and !filterTag.isEmpty()}">Clear</a>
            </form>

            <div th:if="${success}" class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-800 border border-emerald-100" th:text="${success}"></div>
            <div th:if="${error}" class="rounded-lg px-4 py-3 text-sm bg-red-50 text-red-800 border border-red-100" th:text="${error}"></div>

            <div id="new-note-form" class="hidden bg-surface-container-lowest rounded-xl border border-slate-100 p-5 shadow-sm">
                <h3 class="text-sm font-bold text-on-background mb-4 font-headline">Create New Note</h3>
                <form th:action="@{/notes/save}" method="post" class="space-y-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="noteType" value="STANDALONE">
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Title</label>
                        <input type="text" name="title" placeholder="Note title..." class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Link to Course (optional)</label>
                        <select name="courseId" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2 bg-white">
                            <option value="">-- No link --</option>
                            <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.courseCode + ' - ' + c.courseName}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Content</label>
                        <textarea name="content" placeholder="Note content..." required rows="5" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2"></textarea>
                    </div>
                    <div class="flex flex-wrap items-end gap-4">
                        <div>
                            <span class="block text-xs font-semibold text-on-surface-variant mb-2">Highlight Color</span>
                            <div class="flex gap-2">
                                <label th:each="color : ${ {'#FFFF00','#90EE90','#FFB6C1','#87CEEB','#FFA500'} }" class="cursor-pointer">
                                    <input type="radio" name="highlightColor" th:value="${color}" th:checked="${color == '#FFFF00'}" class="hidden">
                                    <span th:style="'display:inline-block; width:24px; height:24px; border-radius:50%; background:' + ${color} + '; border:2px solid #ccc;'"></span>
                                </label>
                            </div>
                        </div>
                        <button type="submit" class="px-4 py-2 bg-primary text-on-primary text-sm font-bold rounded-lg border-0 cursor-pointer">Save Note</button>
                    </div>
                </form>
            </div>

            <div th:if="${allNotes.isEmpty()}" class="text-center py-16 text-on-surface-variant rounded-xl border border-dashed border-slate-200">
                No notes yet. Create your first note!
            </div>

            <th:block th:unless="${allNotes.isEmpty()}">
                <section th:if="${!standaloneNotes.isEmpty()}" class="space-y-4">
                    <h2 class="text-lg font-bold font-headline text-on-background">Standalone Notes</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div th:each="n : ${standaloneNotes}"
                             class="bg-surface-container-low rounded-xl p-4 border border-slate-100 shadow-sm"
                             th:style="'border-top-width:4px;border-top-style:solid;border-top-color:' + ${n.highlightColor}">
                            <div class="flex justify-between items-start gap-2 mb-2">
                                <div class="min-w-0">
                                    <a th:href="@{/notes/{id}(id=${n.id})}" class="text-[11px] text-primary font-semibold no-underline">Open detail →</a>
                                    <div class="font-semibold text-on-surface text-sm mt-1"
                                         th:text="${n.title != null and !n.title.trim().isEmpty() ? n.title : 'Note'}"></div>
                                </div>
                                <form th:action="@{/notes/{id}/delete(id=${n.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="text-xs px-2 py-1 rounded bg-red-50 text-red-700 hover:bg-red-100 border-0 cursor-pointer"
                                            onclick="return confirm('Delete this note?')">×</button>
                                </form>
                            </div>
                            <div class="text-sm text-on-surface whitespace-pre-wrap" th:text="${n.content}"></div>
                            <div class="mt-2 text-[11px] text-slate-400">
                                <span th:if="${n.course != null}" th:text="${n.course.courseCode} + ' · '"></span>
                                <span th:text="${#temporals.format(n.createdAt, 'MM/dd/yyyy')}"></span>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="space-y-3 mt-8">
                    <h2 class="text-lg font-bold font-headline text-on-background">Lesson Notes</h2>
                    <div class="flex flex-col gap-2">
                        <div th:each="n : ${allNotes}" th:if="${n.noteType != null and n.noteType.name() == 'LESSON'}"
                             class="note-item note-list-lesson-row flex gap-2 rounded-xl border border-slate-100 bg-surface-container-lowest overflow-hidden"
                             th:style="'border-left:4px solid ' + ${n.highlightColor}">
                            <a th:href="@{/notes/{id}/open-lesson(id=${n.id})}"
                               class="note-list-lesson-link flex-1 min-w-0 no-underline text-inherit">
                                <span class="note-list-lesson-hint">Open lesson →</span>
                                <div class="text-sm text-on-surface whitespace-pre-wrap mt-1" th:text="${n.content}"></div>
                                <div class="mt-2 text-[11px] text-on-surface-variant flex flex-wrap gap-2">
                                    <span th:if="${n.course != null}" th:text="${n.course.courseCode}"></span>
                                    <span th:if="${n.lesson != null}" class="text-primary font-medium" th:text="${#strings.abbreviate(n.lesson.lessonTitle, 48)}"></span>
                                    <span class="text-slate-400" th:text="${#temporals.format(n.createdAt, 'MM/dd/yyyy HH:mm')}"></span>
                                </div>
                            </a>
                            <form th:action="@{/notes/{id}/delete(id=${n.id})}" method="post" class="p-2 shrink-0">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="text-xs px-2 py-1 rounded bg-red-50 text-red-700 border-0 cursor-pointer"
                                        onclick="return confirm('Delete this note?')">×</button>
                            </form>
                        </div>
                    </div>
                </section>
            </th:block>
        </div>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
