<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Announcements')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page">
        <a class="back-link" th:href="@{/}">&larr; Home</a>
        <div class="page-header" style="margin-bottom:1rem;">
            <h2>Announcements</h2>
            <p style="color:#666;font-size:.92rem;margin-top:.35rem;">Official notices from courses (forum posts marked as announcement).</p>
        </div>

        <div th:if="${posts == null or posts.isEmpty()}" class="empty-state">
            <p>No announcements yet.</p>
        </div>

        <div th:each="p : ${posts}" class="post-item" style="margin-bottom:.75rem;">
            <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem;flex-wrap:wrap;">
                <span class="post-type-badge type-ANNOUNCEMENT">ANNOUNCEMENT</span>
                <span class="post-title" th:text="${p.title}">Title</span>
            </div>
            <div style="font-size:.82rem;color:#888;margin-bottom:.5rem;">
                <span th:if="${p.course != null}" th:text="${p.course.courseCode}"></span>
                <span th:if="${p.author != null}" th:text="' · ' + ${p.author.fullName}"></span>
                <span th:if="${p.createdAt != null}" th:text="' · ' + ${#temporals.format(p.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
            </div>
            <div style="font-size:.9rem;color:#444;line-height:1.55;" th:text="${p.content}">Content</div>
            <div th:if="${p.course != null}" style="margin-top:.65rem;">
                <a th:href="@{/courses/{id}(id=${p.course.id})}" class="btn-link" style="font-size:.88rem;">Go to course &rarr;</a>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
