<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Course')}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="flex-1 overflow-y-auto pt-16 p-4 md:p-8 bg-background">
    <div class="max-w-2xl mx-auto space-y-6">
        <a th:href="@{/admin/dashboard}" class="inline-flex items-center gap-1 text-sm font-semibold text-primary hover:underline no-underline">
            <span class="material-symbols-outlined text-lg">arrow_back</span> Admin Dashboard
        </a>
        <h1 class="text-2xl font-extrabold font-headline text-on-background">Create New Course</h1>

        <div th:if="${error}" class="rounded-lg px-4 py-3 text-sm bg-red-50 text-red-800 border border-red-100" th:text="${error}"></div>

        <div class="bg-surface-container-lowest rounded-xl border border-slate-100 p-6 shadow-sm">
            <form th:action="@{/admin/courses/create}" method="post" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Course Code</label>
                        <input type="text" name="courseCode" placeholder="e.g. CS201" required class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Semester</label>
                        <input type="text" name="semester" placeholder="e.g. HK1" required class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                    </div>
                </div>
                <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Department</label>
                        <select name="departmentId" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2 bg-white">
                            <option value="">— Optional —</option>
                            <option th:each="d : ${departments}" th:value="${d.id}" th:text="|${d.name} (${d.code})|"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Credits</label>
                        <input type="number" name="credits" value="3" min="1" max="30" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                    </div>
                </div>
                <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Theory hours (LT)</label>
                        <input type="number" name="theoryHours" value="30" min="0" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Practice hours (TH)</label>
                        <input type="number" name="practiceHours" value="15" min="0" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Course Name</label>
                    <input type="text" name="courseName" placeholder="Course name..." required class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Description</label>
                    <textarea name="description" placeholder="Course description..." rows="4" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2"></textarea>
                </div>
                <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Teacher</label>
                        <select name="teacherId" required class="w-full rounded-lg border-slate-200 text-sm px-3 py-2 bg-white">
                            <option value="">-- Select Teacher --</option>
                            <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.fullName}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Status</label>
                        <select name="status" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2 bg-white">
                            <option value="DRAFT">DRAFT</option>
                            <option value="PUBLISHED">PUBLISHED</option>
                        </select>
                    </div>
                </div>
                <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Enrollment Password (optional)</label>
                        <input type="text" name="enrollPassword" placeholder="Leave blank if not needed" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Max Students</label>
                        <input type="number" name="maxStudents" value="50" min="1" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                    </div>
                </div>
                <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Academic Year</label>
                        <input type="text" name="academicYear" placeholder="e.g. 2024-2025" required class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-on-surface-variant mb-1">Thumbnail URL</label>
                        <input type="text" name="thumbnail" placeholder="/images/e-learning.jpg" class="w-full rounded-lg border-slate-200 text-sm px-3 py-2">
                    </div>
                </div>
                <button type="submit" class="px-6 py-3 bg-primary text-on-primary font-bold text-sm rounded-lg border-0 cursor-pointer hover:opacity-90">Create Course</button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
