<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Course')}"></head>
<body>
<header><nav th:replace="~{fragments/layout :: navbar}"></nav></header>
<main>
    <div class="page">
        <a class="back-link" th:href="@{/admin/dashboard}">← Admin Dashboard</a>
        <h2>Create New Course</h2>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div style="background:#fff; border:1px solid #e0e7ef; border-radius:12px; padding:1.5rem; max-width:700px;">
            <form th:action="@{/admin/courses/create}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div>
                        <label style="margin-top:0;">Course Code</label>
                        <input type="text" name="courseCode" placeholder="e.g. CS201" required>
                    </div>
                    <div>
                        <label style="margin-top:0;">Semester</label>
                        <input type="text" name="semester" placeholder="e.g. HK1" required>
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div>
                        <label style="margin-top:0;">Department</label>
                        <select name="departmentId">
                            <option value="">— Optional —</option>
                            <option th:each="d : ${departments}" th:value="${d.id}" th:text="|${d.name} (${d.code})|"></option>
                        </select>
                    </div>
                    <div>
                        <label style="margin-top:0;">Credits (tín chỉ)</label>
                        <input type="number" name="credits" value="3" min="1" max="30">
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div>
                        <label style="margin-top:0;">Theory hours (giờ LT)</label>
                        <input type="number" name="theoryHours" value="30" min="0">
                    </div>
                    <div>
                        <label style="margin-top:0;">Practice hours (giờ TH)</label>
                        <input type="number" name="practiceHours" value="15" min="0">
                    </div>
                </div>
                <label>Course Name</label>
                <input type="text" name="courseName" placeholder="Course name..." required>
                <label>Description</label>
                <textarea name="description" placeholder="Course description..." style="min-height:100px;"></textarea>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div>
                        <label>Teacher</label>
                        <select name="teacherId" required>
                            <option value="">-- Select Teacher --</option>
                            <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.fullName}"></option>
                        </select>
                    </div>
                    <div>
                        <label>Status</label>
                        <select name="status">
                            <option value="DRAFT">DRAFT</option>
                            <option value="PUBLISHED">PUBLISHED</option>
                        </select>
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div>
                        <label>Enrollment Password (optional)</label>
                        <input type="text" name="enrollPassword" placeholder="Leave blank if not needed">
                    </div>
                    <div>
                        <label>Max Students</label>
                        <input type="number" name="maxStudents" value="50" min="1">
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div>
                        <label>Academic Year</label>
                        <input type="text" name="academicYear" placeholder="e.g. 2024-2025" required>
                    </div>
                    <div>
                        <label>Thumbnail URL</label>
                        <input type="text" name="thumbnail" placeholder="/images/e-learning.jpg">
                    </div>
                </div>
                <button type="submit" class="btn" style="margin-top:1.25rem; width:auto; padding:.75rem 2rem;">Create Course</button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
