<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin Dashboard')}"></head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="flex-1 overflow-y-auto pt-16 p-4 md:p-8 bg-background">
    <div class="max-w-7xl mx-auto space-y-8">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold font-headline text-on-background">Admin Dashboard</h1>
            <p class="text-sm text-on-surface-variant mt-1">Manage the entire E-Learning system.</p>
        </div>

        <div th:if="${success}" class="rounded-lg px-4 py-3 text-sm bg-emerald-50 text-emerald-800 border border-emerald-100" th:text="${success}"></div>

        <section class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
            <div class="bg-surface-container-low p-4 rounded-xl text-center">
                <div class="text-2xl font-black text-primary" th:text="${totalUsers}">0</div>
                <div class="text-[10px] font-semibold uppercase tracking-wider text-on-surface-variant">Users</div>
            </div>
            <div class="bg-surface-container-low p-4 rounded-xl text-center">
                <div class="text-2xl font-black text-on-surface" th:text="${totalStudents}">0</div>
                <div class="text-[10px] font-semibold uppercase tracking-wider text-on-surface-variant">Students</div>
            </div>
            <div class="bg-surface-container-low p-4 rounded-xl text-center">
                <div class="text-2xl font-black text-on-surface" th:text="${totalTeachers}">0</div>
                <div class="text-[10px] font-semibold uppercase tracking-wider text-on-surface-variant">Teachers</div>
            </div>
            <div class="bg-surface-container-low p-4 rounded-xl text-center">
                <div class="text-2xl font-black text-tertiary" th:text="${totalCourses}">0</div>
                <div class="text-[10px] font-semibold uppercase tracking-wider text-on-surface-variant">Courses</div>
            </div>
            <div class="bg-surface-container-low p-4 rounded-xl text-center">
                <div class="text-2xl font-black text-emerald-700" th:text="${totalPublished}">0</div>
                <div class="text-[10px] font-semibold uppercase tracking-wider text-on-surface-variant">Published</div>
            </div>
            <div class="bg-surface-container-low p-4 rounded-xl text-center">
                <div class="text-2xl font-black text-on-surface" th:text="${totalEnrollments}">0</div>
                <div class="text-[10px] font-semibold uppercase tracking-wider text-on-surface-variant">Enrollments</div>
            </div>
        </section>

        <div class="flex flex-wrap gap-3 items-center">
            <button type="button" onclick="showTab('users')" id="tab-users" class="tab-btn px-4 py-2 rounded-lg text-sm font-bold bg-primary text-white">Users</button>
            <button type="button" onclick="showTab('courses')" id="tab-courses" class="tab-btn px-4 py-2 rounded-lg text-sm font-bold border border-slate-200 text-on-surface hover:bg-slate-50">Courses</button>
            <a th:href="@{/admin/courses/create}" class="px-4 py-2 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:opacity-90 no-underline ml-auto">+ Create Course</a>
        </div>

        <div id="tab-users-content">
            <div class="it-table-wrap">
                <table class="it-data-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${users}">
                        <td class="text-slate-400" th:text="'#' + ${u.id}"></td>
                        <td class="font-semibold" th:text="${u.fullName}"></td>
                        <td class="text-on-surface-variant text-sm" th:text="${u.email}"></td>
                        <td>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold"
                                  th:classappend="${u.role.name() == 'ADMIN'} ? ' bg-slate-800 text-white' : (${u.role.name() == 'TEACHER'} ? ' bg-emerald-100 text-emerald-800' : ' bg-slate-100 text-on-surface')"
                                  th:text="${u.role}"></span>
                        </td>
                        <td>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold"
                                  th:classappend="${u.locked} ? ' bg-red-100 text-red-800' : ' bg-emerald-100 text-emerald-800'"
                                  th:text="${u.locked} ? 'Locked' : 'Active'"></span>
                        </td>
                        <td class="text-sm text-slate-500" th:text="${#temporals.format(u.createdAt, 'MM/dd/yyyy')}"></td>
                        <td>
                            <form th:action="@{/admin/users/{id}/toggle-lock(id=${u.id})}" method="post" class="inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="text-xs font-bold px-3 py-1 rounded-lg border-0 cursor-pointer"
                                        th:classappend="${u.locked} ? ' bg-emerald-600 text-white' : ' bg-red-600 text-white'"
                                        th:text="${u.locked} ? 'Unlock' : 'Lock'"></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="tab-courses-content" class="hidden">
            <div class="it-table-wrap">
                <table class="it-data-table">
                    <thead>
                    <tr>
                        <th>Code</th>
                        <th>Course Name</th>
                        <th>Teacher</th>
                        <th>Semester</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${courses}">
                        <td><span class="px-2 py-0.5 rounded text-[10px] font-bold bg-primary-container/20 text-primary" th:text="${c.courseCode}"></span></td>
                        <td class="font-semibold" th:text="${c.courseName}"></td>
                        <td th:text="${c.teacher != null ? c.teacher.fullName : ''}"></td>
                        <td th:text="${c.semester}"></td>
                        <td>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold"
                                  th:classappend="${c.status.name() == 'PUBLISHED'} ? ' bg-emerald-100 text-emerald-800' : ' bg-slate-100 text-on-surface'"
                                  th:text="${c.status}"></span>
                        </td>
                        <td>
                            <div class="flex flex-wrap gap-2">
                                <a th:href="@{/courses/{id}(id=${c.id})}" class="text-[11px] font-bold text-primary no-underline">View</a>
                                <a th:href="@{/admin/courses/{id}/lessons(id=${c.id})}" class="text-[11px] font-bold text-primary no-underline">Lessons</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
function showTab(tab) {
    var usersContent = document.getElementById('tab-users-content');
    var coursesContent = document.getElementById('tab-courses-content');
    var btnUsers = document.getElementById('tab-users');
    var btnCourses = document.getElementById('tab-courses');
    var active = 'px-4 py-2 rounded-lg text-sm font-bold bg-primary text-white';
    var inactive = 'px-4 py-2 rounded-lg text-sm font-bold border border-slate-200 text-on-surface hover:bg-slate-50';
    if (tab === 'users') {
        usersContent.classList.remove('hidden');
        coursesContent.classList.add('hidden');
        btnUsers.className = active;
        btnCourses.className = inactive;
    } else {
        usersContent.classList.add('hidden');
        coursesContent.classList.remove('hidden');
        btnUsers.className = inactive;
        btnCourses.className = active;
    }
}
</script>
</body>
</html>
