spring.application.name=elearning

# ===== DATABASE =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/e-learning?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:kmtien.270410}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== THYMELEAF =====
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.content-type=text/html;charset=UTF-8

# ===== SERVER =====
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

# ===== FILE UPLOAD =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.assessment.upload-dir=${ASSESSMENT_UPLOAD_DIR:uploads/assessment}
app.assessment.allowed-extensions=${ASSESSMENT_ALLOWED_EXTENSIONS:pdf,doc,docx,txt,zip}
app.assessment.max-file-size-bytes=${ASSESSMENT_MAX_FILE_SIZE_BYTES:5242880}

# ===== APP URL (password reset link in emails) =====
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ===== EMAIL (optional — if spring.mail.host is not set, the reset link is only written to the server log) =====
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# app.mail.from=noreply@yourdomain.edu

# ===== LOGGING =====
logging.level.com.elearning=DEBUG
logging.level.org.springframework.security=WARN
